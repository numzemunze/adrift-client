  html,body { width:100%; height:100%; overflow:hidden; background:#0b1020; font-family:system-ui,-apple-system,sans-serif; color:#fff; }
  #app { position:fixed; inset:0; }

  .bar { position:fixed; left:0; right:0; padding:10px 12px; display:flex; gap:8px; align-items:center; z-index:10; pointer-events:none; flex-wrap:wrap; justify-content:center; }

  #top { top:0; justify-content:flex-start; background:linear-gradient(180deg,rgba(11,16,32,.9),rgba(11,16,32,0)); }
  #bottom, #bottom-visit, #bottom-raid {
    bottom:0; background:linear-gradient(0deg,rgba(11,16,32,.92),rgba(11,16,32,0));
    padding-bottom:14px;
  }

  .pill { background:rgba(255,255,255,.08); backdrop-filter:blur(8px); padding:6px 12px; border-radius:20px; font-size:14px; font-variant-numeric:tabular-nums; color:#fff; border:1px solid rgba(255,255,255,.1); font-family:inherit; }
  .pill b { color:#7dd3fc; }
  .pill-btn { display:flex; gap:8px; align-items:center; cursor:pointer; transition:background .15s; }
  .pill-btn:active { background:rgba(255,255,255,.22); }
  .pill-btn.ready { background:#16a34a; border-color:#22c55e; }
  .pill-btn.ready b { color:#fff; }
  #claim-hint { font-size:12px; opacity:.8; }
  #target-pill b { color:#fca5a5; }

  button {
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.16);
    color:#fff; padding:11px 14px; border-radius:12px;
    font-size:14px; font-weight:500; font-family:inherit; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    transition:transform .1s ease, background .15s ease, box-shadow .15s ease;
  }
  button:active { transform:scale(.94); background:rgba(255,255,255,.22); }
  button.on { background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#60a5fa; }
  button.locked { opacity:.5; }
  button.danger { background:linear-gradient(180deg,#dc2626,#b91c1c); border-color:#ef4444; }
  button.go { background:linear-gradient(180deg,#22c55e,#15803d); border-color:#4ade80; }
  button.demolish-on { background:linear-gradient(180deg,#dc2626,#7f1d1d); border-color:#ef4444; }
  button.primary { background:linear-gradient(180deg,#3b82f6,#1d4ed8); border-color:#60a5fa; font-weight:600; }
  button.icon { padding:11px 13px; }
  button.rot-on { background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#60a5fa; }

  #toast {
    position:fixed; top:64px; left:50%; transform:translateX(-50%) translateY(-8px);
    background:rgba(30,41,59,.96); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); border-radius:14px;
    padding:12px 20px; font-size:14px; font-weight:500;
    max-width:88vw; text-align:center; pointer-events:none; z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0; transition:opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.error { background:rgba(127,29,29,.96); border-color:rgba(239,68,68,.5); }
  #toast.tip { background:rgba(21,128,61,.96); border-color:rgba(74,222,128,.5); }

  #price-tag {
    position:fixed; top:0; left:0;
    background:rgba(17,26,51,.94); backdrop-filter:blur(6px);
    padding:4px 10px; border-radius:10px;
    font-size:13px; font-weight:600; color:#fde68a;
    border:1px solid rgba(255,255,255,.18);
    pointer-events:none; z-index:9; white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  #price-tag.bad { color:#fca5a5; }

  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:#0b1020; z-index:100; font-size:16px; line-height:1.5; }
  #status.hidden { display:none; }
  #err { color:#fca5a5; font-size:13px; }

  .screen { position:fixed; inset:0; background:#0b1020; z-index:50; display:flex; flex-direction:column; padding:14px; overflow-y:auto; animation:fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .screen-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .screen-title { font-size:20px; font-weight:700; }
  .island-row { display:flex; flex-direction:column; gap:4px; width:100%; text-align:left; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:13px 15px; margin-bottom:8px; }
  .island-row:active { background:rgba(255,255,255,.16); }
  .island-row.locked { opacity:.55; }
  .island-name { font-size:16px; font-weight:600; }
  .island-meta { font-size:13px; color:rgba(255,255,255,.7); }
  .island-badge { font-size:12px; color:#fca5a5; }
  .screen-note { text-align:center; color:rgba(255,255,255,.5); padding:32px 16px; }

  #loot-screen { align-items:center; justify-content:center; }
  .loot-card { background:#111a33; border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:28px 24px; text-align:center; max-width:340px; width:100%; }
  .loot-emoji { font-size:48px; margin-bottom:8px; }
  .loot-title { font-size:20px; font-weight:700; margin-bottom:16px; }
  .loot-row { font-size:15px; color:rgba(255,255,255,.8); margin-bottom:8px; }
  .loot-row b { color:#7dd3fc; font-size:18px; }
  .loot-card button { width:100%; margin-top:16px; }

  #onboard-screen { align-items:center; justify-content:center; }
  .onboard-card { background:#111a33; border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:24px 22px; max-width:360px; width:100%; }
  .onboard-emoji { font-size:44px; text-align:center; margin-bottom:6px; }
  .onboard-title { font-size:19px; font-weight:700; text-align:center; margin-bottom:18px; }
  .onboard-step { font-size:14px; line-height:1.5; color:rgba(255,255,255,.85); margin-bottom:12px; }
  .onboard-step b { color:#7dd3fc; }
  .onboard-card button { width:100%; margin-top:6px; }

    background:linear-gradient(0deg, rgba(11,16,32,.94) 0%, rgba(11,16,32,.55) 42%, rgba(11,16,32,0) 100%);
    justify-content:flex-end;
    align-items:center;

  .tip-card {
    background:rgba(17,26,51,.97);
    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;
    padding:18px 20px 16px;
    width:100%;
    max-width:440px;
    box-shadow:0 14px 44px rgba(0,0,0,.6);
  }
  .tip-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .tip-dot { width:10px; height:10px; border-radius:50%; background:#7dd3fc; box-shadow:0 0 10px #7dd3fc; }
  .tip-title { font-size:15px; font-weight:700; color:#7dd3fc; letter-spacing:.3px; }
  .tip-text { font-size:15px; line-height:1.5; color:rgba(255,255,255,.94); margin-bottom:16px; }
  .tip-card button { width:100%; }

  #palette, #block-palette, #size-palette {
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:rgba(17,26,51,.98); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15); border-radius:16px;
    padding:14px; z-index:60; box-shadow:0 12px 40px rgba(0,0,0,.6);

  .palette-title { font-size:12px; color:rgba(255,255,255,.65); margin-bottom:10px; text-align:center; letter-spacing:.5px; text-transform:uppercase; }
  .palette-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .color-dot { width:46px; height:46px; border-radius:12px; border:2px solid rgba(255,255,255,.2); cursor:pointer; padding:0; }
  .color-dot:active { transform:scale(.86); }
  .color-dot.selected { border-color:#fff; border-width:3px; }

  .size-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .size-btn { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:100px; padding:12px 10px; }
  .size-btn .glyph { font-family:ui-monospace,monospace; font-size:15px; font-weight:700; }
  .size-btn .price { font-size:11px; opacity:.75; }
  .size-btn.selected { background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#60a5fa; }

  .hidden { display:none !important; }
</style>

</div>

<div class="screen hidden" id="loot-screen">

const lang = (navigator.language || 'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en';

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.ru[key] || key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace('{' + k + '}', v);
  return s;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.documentElement.lang = lang;
}

let toastTimer = null;
function toast(msg, isError = false, isTip = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('error', !!isError);
  toastEl.classList.toggle('tip', !!isTip);
  toastEl.classList.remove('hidden');
  requestAnimationFrame(() => toastEl.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove('show');
    setTimeout(() => toastEl.classList.add('hidden'), 220);
  }, isTip ? 3000 : (isError ? 2600 : 1600));

async function signIn() {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}` },
    body: '{}',
  });
  if (!res.ok) throw new Error('Auth: ' + res.status);
  const data = await res.json();
  token = data.access_token; myId = data.user.id;
  localStorage.setItem('adrift_token', token);
  localStorage.setItem('adrift_id', myId);
}

function clearSession() {
  token = null; myId = null;
  localStorage.removeItem('adrift_token'); localStorage.removeItem('adrift_id');
}

async function api(path, options = {}) {
  const res = await fetch(API_URL + path, {
    ...options,
    headers: { 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json', ...(options.headers||{}) },
  });
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const err = new Error(body?.error?.message || res.statusText);
    err.code = body?.error?.code || ('HTTP_' + res.status);
    throw err;
  }
  return body;
}

const AUTH_ERRORS = ['TOKEN_EXPIRED','TOKEN_INVALID','TOKEN_MISSING','UNAUTHORIZED'];

async function auth() {
  const saved = localStorage.getItem('adrift_token');
  const savedId = localStorage.getItem('adrift_id');
  if (saved && savedId) {
    token = saved; myId = savedId;
    try { await api('/api/v1/build/catalog'); return; }
    catch (e) { if (!AUTH_ERRORS.includes(e.code)) throw e; clearSession(); }
  }
  fail(t('login')); await signIn();
}

function makeWoodTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);

  for (let i = 0; i < 22; i++) {
    const y = Math.random() * size;
    ctx.strokeStyle = `rgba(0,0,0,${0.04 + Math.random()*0.06})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath(); ctx.moveTo(0, y);
    for (let x = 0; x <= size; x += 8) ctx.lineTo(x, y + Math.sin(x/14+i)*2.5);
    ctx.stroke();
  }
  for (let i = 0; i < 2; i++) {
    const cx = Math.random()*size, cy = Math.random()*size;
    for (let r = 2; r < 8; r += 2) {
      ctx.strokeStyle = `rgba(0,0,0,${0.08 - r*0.008})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(cx, cy, r*1.6, r, 0, 0, Math.PI*2); ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const WOOD_TEXTURE = makeWoodTexture();

// ---------- КУБЫ ----------
const cubeMeshes = new Map();
let blockedGround = new Set();

function makeCubeMaterial(color) {
  return new THREE.MeshLambertMaterial({
    map: WOOD_TEXTURE,
    color: new THREE.Color(BLOCK_COLORS_HEX[color] || BLOCK_COLORS_HEX.wood),
  });
}

function cubeCenter(c) {
  const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
  return { x: c.x + sx/2, y: c.y + sy/2, z: c.z + sz/2 };
}

// Клетки, занятые кубами, СТОЯЩИМИ НА ЗЕМЛЕ. Именно их обходит Буй.
function rebuildBlockedGround() {
  blockedGround = new Set();
  for (const m of cubeMeshes.values()) {
    const c = m.userData.cube;
    const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
    if (c.y <= 0 && c.y + sy - 1 >= 0) {
      for (let dx = 0; dx < sx; dx++)
        for (let dz = 0; dz < sz; dz++)
          blockedGround.add((c.x+dx) + ',' + (c.z+dz));
    }
  }
}

function addCube(c) {
  if (cubeMeshes.has(c.id)) return;
  const color = c.color || 'wood';
  const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), makeCubeMaterial(color));
  const cc = cubeCenter({ ...c, size_x:sx, size_y:sy, size_z:sz });
  mesh.position.set(cc.x, cc.y, cc.z);
  mesh.userData.cube = { ...c, color, size_x:sx, size_y:sy, size_z:sz };
  scene.add(mesh); cubeMeshes.set(c.id, mesh);
  paintCube(mesh);
  rebuildBlockedGround();
  resetMinionPath();
}

function paintCube(mesh) {
  const c = mesh.userData.cube;
  const ratio = c.max_hp > 0 ? Math.max(0, Math.min(1, c.hp/c.max_hp)) : 0;
  const base = new THREE.Color(BLOCK_COLORS_HEX[c.color] || BLOCK_COLORS_HEX.wood);
  const hurt = new THREE.Color(0x7f1d1d);
  mesh.material.color.copy(base).lerp(hurt, 1 - ratio);
}

function updateCubeHp(id, hp) {
  const mesh = cubeMeshes.get(id); if (!mesh) return;
  mesh.userData.cube.hp = hp; paintCube(mesh);
}

function removeCube(id) {
  const mesh = cubeMeshes.get(id); if (!mesh) return;
  scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); cubeMeshes.delete(id);
  rebuildBlockedGround();
  resetMinionPath();
}

function resetCubes() { for (const id of [...cubeMeshes.keys()]) removeCube(id); rebuildBlockedGround(); }

function countSafeCubes() { let n = 0; for (const m of cubeMeshes.values()) if (m.userData.cube.is_safe_zone) n++; return n; }
function refreshCounters() { $('cubes').textContent = cubeMeshes.size; }

function setFlagVisual(hp, maxHp, color) {
  currentFlagHp = hp; currentFlagMax = maxHp;
  if (color) displayFlagColor = color;
  const ratio = maxHp > 0 ? Math.max(0, Math.min(1, hp/maxHp)) : 0;
  const base = new THREE.Color(FLAG_COLORS_HEX[displayFlagColor] || FLAG_COLORS_HEX.red);
  banner.material.color.copy(base).lerp(new THREE.Color(0x7f1d1d), 1 - ratio);
  $('flag').textContent = Math.max(0, hp) + ' / ' + maxHp;
}

const minionGroup = new THREE.Group();

(function buildMinion() {
  const SKIN = 0xe8dcc8;   // светлая голова и кисти
  const CLOTH = 0x9c9184;  // корпус

  // Корпус, голова и руки живут в отдельной группе: её мы наклоняем при

  const handGeo = new THREE.BoxGeometry(0.19, 0.14, 0.19);

  // Левая рука — свободна, машет.

  const armRPivot = new THREE.Group(); armRPivot.position.set(0.35, 1.02, 0);
  armRPivot.rotation.x = Math.PI;
  const armR = new THREE.Mesh(armGeo, matDark); armR.position.y = -0.23;
  const handR = new THREE.Mesh(handGeo, matSkin); handR.position.y = -0.5;

  bodyGroup.add(armRPivot);

  const mPole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.0, 6), matDark);
  mPole.position.set(0.35, 1.72, 0);
  const mFlag = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.3, 0.02), minionFlagMat);

  // Ноги: пивот на бедре, внутри — голень и ботинок. Ботинок ставим так,

  const legGeo = new THREE.BoxGeometry(0.2, 0.5, 0.2);

const minion = {
  x: 3, z: 3,
  path: [],
  speed: 1.5,
  phase: 0,
  idleUntil: 0,
  facing: 0,
  lastTip: -1,
  mood: 'calm',        // 'calm' | 'panic'
  frozen: false,
  panicBoost: 0,
};

function setMinionFlagColor(color) {
  minionFlagMat.color.set(FLAG_COLORS_HEX[color] || FLAG_COLORS_HEX.red);
}

function cellFree(x, z) {
  if (x < -32 || x > 32 || z < -32 || z > 32) return false;
  if (x === 0 && z === 0) return false;
  return !blockedGround.has(x + ',' + z);
}

// BFS по клеткам земли. Карта 65×65, обход — доли миллисекунды.
function bfsPath(sx, sz, tx, tz) {
  if (!cellFree(tx, tz)) return null;
  const key = (x, z) => x + ',' + z;
  const queue = [[sx, sz]];
  const prev = new Map();
  prev.set(key(sx, sz), null);
  let head = 0;

  while (head < queue.length) {
    const [x, z] = queue[head++];
    if (x === tx && z === tz) {
      const path = [];
      let cur = key(x, z);
      while (cur !== null) {
        const [px, pz] = cur.split(',').map(Number);
        path.push([px, pz]);
        cur = prev.get(cur);
      }
      return path.reverse();
    }
    for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, nz = z + dz;
      const k = key(nx, nz);
      if (prev.has(k)) continue;
      if (!cellFree(nx, nz)) continue;
      prev.set(k, key(x, z));
      queue.push([nx, nz]);
    }
  }
  return null;
}

function resetMinionPath() { minion.path = []; }

function pickMinionTarget() {
  const panic = minion.mood === 'panic';
  const rMin = panic ? PANIC_RADIUS_MIN : MINION_RADIUS_MIN;
  const rMax = panic ? PANIC_RADIUS_MAX : MINION_RADIUS_MAX;

  for (let i = 0; i < 14; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = rMin + Math.random() * (rMax - rMin);
    const tx = Math.round(Math.cos(angle) * r);
    const tz = Math.round(Math.sin(angle) * r);
    if (!cellFree(tx, tz)) continue;
    if (tx === minion.x && tz === minion.z) continue;
    const path = bfsPath(minion.x, minion.z, tx, tz);
    if (path && path.length > 1) { minion.path = path.slice(1); return; }
  }
}

function placeMinionInitial() {
  for (let r = 2; r <= 10; r++) {
    for (let a = 0; a < 16; a++) {
      const ang = (a / 16) * Math.PI * 2;
      const x = Math.round(Math.cos(ang) * r);
      const z = Math.round(Math.sin(ang) * r);
      if (cellFree(x, z)) {
        minion.x = x; minion.z = z;
        minionGroup.position.set(x + 0.5, 0, z + 0.5);
        resetMinionPath();
        return;
      }
    }
  }
  minionGroup.position.set(2.5, 0, 2.5);
}

// Общая «затухающая» интерполяция: значение идёт к цели с частотой k.
function approach(current, target, dt, k) {
  return current + (target - current) * Math.min(1, dt * k);
}

function idleMinion(now, dt, panic) {
  const breath = Math.sin(now * 1.7);

  minionParts.legLPivot.rotation.x = approach(minionParts.legLPivot.rotation.x, 0, dt, 8);
  minionParts.legRPivot.rotation.x = approach(minionParts.legRPivot.rotation.x, 0, dt, 8);
  minionParts.bodyGroup.rotation.x = approach(minionParts.bodyGroup.rotation.x, 0, dt, 6);
  minionGroup.position.y = approach(minionGroup.position.y, 0, dt, 10);
  minionParts.armRPivot.rotation.x = Math.PI;

  if (panic) {
    // Стоять на месте в панике он не умеет: руки вверх, голова трясётся.
    minionParts.armLPivot.rotation.x = Math.PI * 0.85 + Math.sin(now * 8) * 0.35;
    minionParts.head.rotation.z = Math.sin(now * 9) * 0.1;
    minionParts.head.rotation.y = Math.sin(now * 7) * 0.12;
    minionParts.bodyGroup.position.y = Math.abs(Math.sin(now * 6)) * 0.03;
  } else {
    minionParts.armLPivot.rotation.x = breath * 0.06;
    minionParts.head.rotation.z = Math.sin(now * 0.7) * 0.05;
    minionParts.head.rotation.y = Math.sin(now * 0.45) * 0.16;   // осматривается
    minionParts.bodyGroup.position.y = breath * 0.015;            // дышит
  }
}

function updateMinion(dt) {
  const now = performance.now() / 1000;

  // Если игрок построил блок прямо на Буе — вытаскиваем его на свободную клетку.
  if (!minion.frozen && !cellFree(minion.x, minion.z)) placeMinionInitial();

  // 1. Заморожен: игрок читает совет. Буй стоит и машет.
  if (minion.frozen) {
    minionParts.armLPivot.rotation.x = Math.PI * 0.7 + Math.sin(now * 5) * 0.28;
    minionParts.armRPivot.rotation.x = Math.PI;
    minionParts.legLPivot.rotation.x = approach(minionParts.legLPivot.rotation.x, 0, dt, 8);
    minionParts.legRPivot.rotation.x = approach(minionParts.legRPivot.rotation.x, 0, dt, 8);
    minionParts.bodyGroup.rotation.x = approach(minionParts.bodyGroup.rotation.x, 0, dt, 6);
    minionParts.head.rotation.z = Math.sin(now * 1.4) * 0.09;
    minionParts.head.rotation.y = approach(minionParts.head.rotation.y, 0, dt, 6);
    minionParts.bodyGroup.position.y = Math.sin(now * 2.2) * 0.02;
    minionGroup.position.y = approach(minionGroup.position.y, 0, dt, 10);
    return;
  }

  const panic = minion.mood === 'panic';
  // Паника после разрушенного куба затухает примерно за 5 секунд.
  minion.panicBoost = Math.max(0, minion.panicBoost - dt * 0.6);

  // 2. Пауза между переходами.
  if (minion.path.length === 0) {
    if (now < minion.idleUntil) { idleMinion(now, dt, panic); return; }
    pickMinionTarget();
    if (minion.path.length === 0) { minion.idleUntil = now + 1.0; return; }
    minion.idleUntil = now + (panic ? 0.1 + Math.random() * 0.3 : 0.9 + Math.random() * 2.6);
  }

  // 3. Идём к следующей клетке.
  const [nx, nz] = minion.path[0];
  const tx = nx + 0.5, tz = nz + 0.5;
  const px = minionGroup.position.x, pz = minionGroup.position.z;
  const dx = tx - px, dz = tz - pz;
  const dist = Math.hypot(dx, dz);
  const speed = panic ? (3.0 + minion.panicBoost * 0.8) : 1.5;
  const step = speed * dt;

  if (dist <= step) {
    minionGroup.position.x = tx; minionGroup.position.z = tz;
    minion.x = nx; minion.z = nz;
    minion.path.shift();
  } else {
    minionGroup.position.x += (dx / dist) * step;
    minionGroup.position.z += (dz / dist) * step;
  }

  // 4. Плавный поворот. Сглаживаем угловую разницу, иначе на развороте
  //    на 180° персонаж «щёлкает».
  const targetAngle = Math.atan2(dx, dz);
  let diff = targetAngle - minion.facing;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  minion.facing += diff * Math.min(1, dt * (panic ? 12 : 7));
  minionGroup.rotation.y = minion.facing;

  // 5. Ходьба.
  const freq = panic ? 13 + minion.panicBoost * 2 : 6.5;
  minion.phase += dt * freq;
  const s = Math.sin(minion.phase);

  if (panic) {
    minionParts.legLPivot.rotation.x = s * 0.95;
    minionParts.legRPivot.rotation.x = -s * 0.95;
    minionParts.armLPivot.rotation.x = Math.PI * 0.85 + Math.sin(minion.phase * 1.6) * 0.45;
    minionParts.armRPivot.rotation.x = Math.PI + Math.sin(minion.phase * 1.9 + 1) * 0.2;
    minionParts.head.rotation.z = Math.sin(minion.phase * 0.7) * 0.13;
    minionParts.head.rotation.y = approach(minionParts.head.rotation.y, 0, dt, 8);
    minionParts.bodyGroup.rotation.x = 0.18;
    minionParts.bodyGroup.position.y = 0;
    minionGroup.position.y = Math.abs(s) * 0.13;
  } else {
    minionParts.legLPivot.rotation.x = s * 0.62;
    minionParts.legRPivot.rotation.x = -s * 0.62;
    minionParts.armLPivot.rotation.x = -s * 0.5;
    minionParts.armRPivot.rotation.x = Math.PI;
    minionParts.head.rotation.z = s * 0.04;
    minionParts.head.rotation.y = approach(minionParts.head.rotation.y, 0, dt, 5);
    minionParts.bodyGroup.rotation.x = 0.06;
    minionParts.bodyGroup.position.y = 0;
    minionGroup.position.y = Math.abs(s) * 0.05;
  }
}

  onDone: null,
};
const savedCam = { pos: new THREE.Vector3(), tgt: new THREE.Vector3() };

function animateCamera(toPos, toTgt, dur, onDone) {
  camAnim.active = true;
  camAnim.t = 0;
  camAnim.dur = Math.max(0.01, dur);
  camAnim.fromPos.copy(camera.position);
  camAnim.fromTgt.copy(controls.target);
  camAnim.toPos.copy(toPos);
  camAnim.toTgt.copy(toTgt);
  camAnim.onDone = onDone || null;
  controls.enabled = false;
}

function updateCameraAnim(dt) {
  if (!camAnim.active) return false;
  camAnim.t += dt;
  const k = Math.min(1, camAnim.t / camAnim.dur);
  // easeInOutQuad: мягкий разгон и мягкое торможение
  const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

  camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
  controls.target.lerpVectors(camAnim.fromTgt, camAnim.toTgt, e);

  if (k >= 1) {
    camAnim.active = false;
    const cb = camAnim.onDone;
    camAnim.onDone = null;
    if (cb) cb();
  }
  return true;
}

function openTip() {
  const tips = I18N[lang].tips;
  let idx = Math.floor(Math.random() * tips.length);
  if (idx === minion.lastTip) idx = (idx + 1) % tips.length;
  minion.lastTip = idx;

  minion.frozen = true;
  minion.path = [];

  // Буй поворачивается лицом к камере — «обращается к тебе».
  const mp = minionGroup.position;
  const toCam = new THREE.Vector3().subVectors(camera.position, mp).setY(0);
  if (toCam.lengthSq() < 0.001) toCam.set(1, 0, 1);
  toCam.normalize();
  minion.facing = Math.atan2(toCam.x, toCam.z);
  minionGroup.rotation.y = minion.facing;

  // Запоминаем позицию камеры, чтобы вернуться после «Ок».
  savedCam.pos.copy(camera.position);
  savedCam.tgt.copy(controls.target);

  // Камера подлетает чуть сбоку и сверху, смотрит на уровень груди Буя.
  const camPos = new THREE.Vector3(mp.x + toCam.x * 4.2, mp.y + 2.3, mp.z + toCam.z * 4.2);
  const camTgt = new THREE.Vector3(mp.x, mp.y + 0.85, mp.z);
  animateCamera(camPos, camTgt, 0.55);

  $('tip-text').textContent = tips[idx];
  showScreen('tip-screen');
}

function closeTip() {
  hideScreens();
  minion.frozen = false;
  animateCamera(savedCam.pos, savedCam.tgt, 0.45, () => {
    controls.enabled = true;
  });
}

function effFootprint() {
  const s = selectedSize;
  return rotated ? { sx: s.sz, sz: s.sx } : { sx: s.sx, sz: s.sz };
}

function canRotate() { return selectedSize.sx !== selectedSize.sz; }

function updateGhostGeometry() {
  const { sx, sz } = effFootprint();
  const sy = selectedSize.sy;
  ghost.geometry.dispose();
  ghost.geometry = new THREE.BoxGeometry(sx, sy, sz);

const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const hitPoint = new THREE.Vector3();
const normalMatrix = new THREE.Matrix3();
const projVec = new THREE.Vector3();

const isTouch = window.matchMedia('(pointer: coarse)').matches;
const aimPoint = { x: 0, y: 0 };

window.addEventListener('pointermove', (ev) => {
  if (isTouch) return;
  aimPoint.x = (ev.clientX / innerWidth) * 2 - 1;
  aimPoint.y = -(ev.clientY / innerHeight) * 2 + 1;
});

function computePlacement(ndcX, ndcY) {
  const { sx, sz } = effFootprint();
  const sy = selectedSize.sy;

  raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
  const cubeHits = raycaster.intersectObjects([...cubeMeshes.values()], false);
  let x, y, z;

  if (cubeHits.length) {
    const h = cubeHits[0];
    const base = h.object.userData.cube;
    const bsx = base.size_x||1, bsy = base.size_y||1, bsz = base.size_z||1;
    const bc = cubeCenter({ ...base, size_x:bsx, size_y:bsy, size_z:bsz });

    normalMatrix.getNormalMatrix(h.object.matrixWorld);
    const n = h.face.normal.clone().applyMatrix3(normalMatrix).normalize();
    const ax = Math.round(n.x), ay = Math.round(n.y), az = Math.round(n.z);

    if (ay !== 0) {
      y = ay > 0 ? base.y + bsy : base.y - sy;
      x = Math.round(bc.x - sx/2);
      z = Math.round(bc.z - sz/2);
    } else if (ax !== 0) {
      x = ax > 0 ? base.x + bsx : base.x - sx;
      y = base.y + Math.round((bsy - sy)/2);
      z = Math.round(bc.z - sz/2);
    } else {
      z = az > 0 ? base.z + bsz : base.z - sz;
      y = base.y + Math.round((bsy - sy)/2);
      x = Math.round(bc.x - sx/2);
    }
  } else {
    if (!raycaster.ray.intersectPlane(plane, hitPoint)) return null;
    x = Math.round(hitPoint.x - sx/2); y = 0; z = Math.round(hitPoint.z - sz/2);
  }

  const price = WOOD_BASE_COST * sx * sy * sz;

  if (x < -32 || x + sx - 1 > 32 || z < -32 || z + sz - 1 > 32 || y < 0 || y + sy - 1 > 32) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('outOfBounds'), price };
  }
  if (x <= 0 && 0 <= x+sx-1 && y <= 0 && 0 <= y+sy-1 && z <= 0 && 0 <= z+sz-1) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('flagReserved'), price };
  }
  for (const m of cubeMeshes.values()) {
    const c = m.userData.cube;
    const csx = c.size_x||1, csy = c.size_y||1, csz = c.size_z||1;
    if (x < c.x+csx && x+sx > c.x && y < c.y+csy && y+sy > c.y && z < c.z+csz && z+sz > c.z) {
      return { x, y, z, sx, sy, sz, valid:false, reason: t('occupied'), price };
    }
  }
  if (y > 0) {
    for (let dx = 0; dx < sx; dx++) {
      for (let dz = 0; dz < sz; dz++) {
        const cx = x + dx, cz = z + dz;
        let supported = false;
        for (const m of cubeMeshes.values()) {
          const c = m.userData.cube;
          const csx = c.size_x||1, csy = c.size_y||1, csz = c.size_z||1;
          if (c.y <= y-1 && c.y + csy - 1 >= y-1 &&
              c.x <= cx && c.x + csx - 1 >= cx &&
              c.z <= cz && c.z + csz - 1 >= cz) { supported = true; break; }
        }
        if (!supported) {
          return { x, y, z, sx, sy, sz, valid:false, reason: t('noSupport'), price };
        }
      }
    }
  }
  if (econ.ether_balance < price) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('noEther'), price };
  }
  return { x, y, z, sx, sy, sz, valid:true, reason:'', price };
}

function updateGhost() {
  if (!buildMode || mode !== 'own' || demolishMode) {
    ghost.visible = false; priceEl.classList.add('hidden'); return;
  }
  const p = computePlacement(aimPoint.x, aimPoint.y);
  if (!p) { ghost.visible = false; priceEl.classList.add('hidden'); return; }

  const cc = cubeCenter(p);
  ghost.position.set(cc.x, cc.y, cc.z);
  ghostMat.color.set(p.valid ? 0x22c55e : 0xef4444);
  ghost.visible = true;

  priceEl.textContent = p.price + '⚡';
  priceEl.classList.toggle('bad', !p.valid);

  projVec.set(cc.x, cc.y + p.sy/2 + 0.35, cc.z).project(camera);
  if (projVec.z > 1) { priceEl.classList.add('hidden'); return; }
  const px = (projVec.x * 0.5 + 0.5) * innerWidth;
  const py = (-projVec.y * 0.5 + 0.5) * innerHeight;
  priceEl.style.transform = `translate(${px}px, ${py}px) translate(-50%, -100%)`;
  priceEl.classList.remove('hidden');
}

  const grid = $('palette-grid'); grid.innerHTML = '';
  for (const [key, hex] of Object.entries(FLAG_COLORS_CSS)) {

function buildBlockPalette() {
  const grid = $('block-palette-grid'); grid.innerHTML = '';
  for (const [key, hex] of Object.entries(BLOCK_COLORS_CSS)) {
    const dot = document.createElement('button');
    dot.className = 'color-dot' + (key === selectedBlockColor ? ' selected' : '');

    grid.appendChild(dot);
  }
}

function sizePrice(s) { return WOOD_BASE_COST * s.sx * s.sy * s.sz; }

function buildSizePalette() {
  const grid = $('size-grid'); grid.innerHTML = '';
  for (const s of BLOCK_SIZES) {
    const btn = document.createElement('button');
    btn.className = 'size-btn' + (s.key === selectedSize.key ? ' selected' : '');

  if (id === 'palette') buildFlagPalette();

function updateFlagButton() {
  const btn = $('btn-flag'); const safe = countSafeCubes();
  if (safe > 0) { btn.textContent = `🔒 ${safe}`; btn.classList.add('locked'); }
  else { btn.textContent = '⚔️'; btn.classList.remove('locked'); }

function raidGone(e) {
  if (e.code === 'RAID_NOT_FOUND' || e.code === 'RAID_ALREADY_FINISHED') {
    toast(t('raidFinished')); raidId = null; setTimeout(returnHome, 1200); return true;
  }
  return false;
}

async function attackCube(cube) {
  if (!raidId || attacking) return;
  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-cube`, {
      method:'POST', headers:{ 'Idempotency-Key': uid() },
      body: JSON.stringify({ cube_id: cube.id, charge: selectedCharge }),
    });
    $('ether').textContent = res.ether_balance; econ.ether_balance = res.ether_balance;
    if (res.cube.destroyed) {
      removeCube(res.cube.id);
      // Разрушенный куб — сильный стресс для Буя: паника вспыхивает заново.
      minion.panicBoost = 3;
      minion.path = [];
    } else updateCubeHp(res.cube.id, res.cube.hp);
    for (const c of res.collapsed) removeCube(c.id);
    refreshCounters(); updateFlagButton();
  } catch (e) { if (!raidGone(e)) toast(e.message, true); }
  finally { attacking = false; }
}

async function attackFlag() {
  if (!raidId || attacking) return;
  const safe = countSafeCubes();
  if (safe > 0) { toast(t('flagProtected', { n:safe }), true); return; }
  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-flag`, {
      method:'POST', headers:{ 'Idempotency-Key': uid() },
    });
    $('ether').textContent = res.ether_balance; econ.ether_balance = res.ether_balance;
    setFlagVisual(res.flag_hp, res.flag_max_hp);
    if (res.flag_destroyed && res.loot) {
      raidId = null;
      $('loot-stolen').textContent = res.loot.stolen_ether;
      $('loot-balance').textContent = res.loot.attacker_balance;
      showScreen('loot-screen');
    } else toast('−' + res.damage + ' ' + t('dmgyou'));
  } catch (e) { if (!raidGone(e)) toast(e.message, true); }
  finally { attacking = false; }
}

async function leaveRaid() {
  if (raidId) { try { await api(`/api/v1/raids/${raidId}/finish`, { method:'POST' }); } catch (e) {} }
  await returnHome();
}

// ---------- ТАПЫ ----------
let pointerStart = null;
const TAP_MAX_MOVE = 8, TAP_MAX_TIME = 400;

renderer.domElement.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  pointerStart = { x:ev.clientX, y:ev.clientY, t:performance.now(), id:ev.pointerId };
});

renderer.domElement.addEventListener('pointercancel', () => { pointerStart = null; });

renderer.domElement.addEventListener('pointerup', async (ev) => {
  if (!pointerStart || ev.pointerId !== pointerStart.id) return;
  const moved = Math.hypot(ev.clientX - pointerStart.x, ev.clientY - pointerStart.y);
  const elapsed = performance.now() - pointerStart.t;
  pointerStart = null;
  if (moved > TAP_MAX_MOVE || elapsed > TAP_MAX_TIME) return;
  if (loading) return;
  if (camAnim.active) return;                                            // камера летит — не мешаем
  if (!$('tip-screen').classList.contains('hidden')) return;             // открыт совет — ждём «Ок»

  const ndcX = (ev.clientX / innerWidth) * 2 - 1;
  const ndcY = -(ev.clientY / innerHeight) * 2 + 1;

  // Буй — первым приоритетом: он маленький и стоит на земле, случайно
  // «построить в него» игрок не должен.
  raycaster.setFromCamera({ x:ndcX, y:ndcY }, camera);
  const minionHits = raycaster.intersectObjects(minionHitMeshes, false);
  if (minionHits.length) {
    if (minion.mood === 'panic') { toast(t('minionPanic'), true); return; }
    openTip();
    return;
  }

  if (mode === 'own' && demolishMode) return handleDemolishTap(ndcX, ndcY);
  if (mode === 'own' && buildMode) return handleBuildTap();
  if (mode === 'raid') return handleRaidTap(ndcX, ndcY);
});

async function handleBuildTap() {
  const p = computePlacement(aimPoint.x, aimPoint.y);
  if (!p) return;
  if (!p.valid) { toast(p.reason, true); return; }

  try {
    const res = await api('/api/v1/build/cube', {
      method:'POST',
      body: JSON.stringify({
        x:p.x, y:p.y, z:p.z,
        size_x:p.sx, size_y:p.sy, size_z:p.sz,
        cube_type:'wood', color: selectedBlockColor,
      }),
    });
    addCube(res.cube);
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    $('cubes').textContent = res.island_cube_count;
  } catch (e) { toast(e.message, true); }
}

async function handleDemolishTap(ndcX, ndcY) {
  raycaster.setFromCamera({ x:ndcX, y:ndcY }, camera);
  const hits = raycaster.intersectObjects([...cubeMeshes.values()], false);
  if (!hits.length) return;
  const cube = hits[0].object.userData.cube;
  try {
    const res = await api(`/api/v1/build/cube/${cube.id}`, { method:'DELETE' });
    for (const c of res.removed) removeCube(c.id);
    refreshCounters();
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    toast('+' + res.ether_refunded + ' ' + t('refund'));
  } catch (e) { toast(e.message, true); }
}

async function handleRaidTap(ndcX, ndcY) {
  raycaster.setFromCamera({ x:ndcX, y:ndcY }, camera);
  const targets = [...cubeMeshes.values(), ...flagGroup.children];
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return;
  const obj = hits[0].object;
  if (flagGroup.children.includes(obj)) { await attackFlag(); return; }
  await attackCube(obj.userData.cube);
}

// ---------- ЦИКЛ ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastFrame = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;

  // Камера либо едет по анимации, либо подчиняется жестам. Совмещать нельзя:
  // OrbitControls в своём update() перезапишет позицию, которую мы задаём.
  if (updateCameraAnim(dt)) {
    camera.lookAt(controls.target);
  } else {
    controls.update();
  }

  flagGroup.rotation.y += 0.005;

  updateMinion(dt);   // Буй есть всегда: свой спокойный, чужой паникует в рейде
  updateGhost();

  renderer.render(scene, camera);
}

animate();

    await auth();
    fail(t('loading'));
    await loadMe();
    await loadOwnIsland();
    await loadEconomy();
    setMode('own');
    buildMode = true;
    updatePanel();
    ok();
    if (!localStorage.getItem('adrift_onboarded')) showScreen('onboard-screen');
  } catch (e) { fail(t('error') + ': ' + e.message); }
})();
</script>
