<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ADRIFT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1020; font-family:system-ui,-apple-system,sans-serif; color:#fff; }
  #app { position:fixed; inset:0; }

  .bar { position:fixed; left:0; right:0; padding:10px 12px; display:flex; gap:8px; align-items:center; z-index:10; pointer-events:none; flex-wrap:wrap; justify-content:center; }
  .bar * { pointer-events:auto; }
  #top { top:0; justify-content:flex-start; background:linear-gradient(180deg,rgba(11,16,32,.9),rgba(11,16,32,0)); }
  #bottom, #bottom-visit, #bottom-raid {
    bottom:0; background:linear-gradient(0deg,rgba(11,16,32,.92),rgba(11,16,32,0));
    padding-bottom:14px;
  }

  .bar.reveal { animation: barSlide .28s cubic-bezier(.2,.7,.3,1); }
  @keyframes barSlide {
    from { opacity:0; transform: translateY(18px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .pill { background:rgba(255,255,255,.08); backdrop-filter:blur(8px); padding:6px 12px; border-radius:20px; font-size:14px; font-variant-numeric:tabular-nums; color:#fff; border:1px solid rgba(255,255,255,.1); font-family:inherit; }
  .pill b { color:#7dd3fc; }
  .pill-btn { display:flex; gap:8px; align-items:center; cursor:pointer; transition:background .15s; }
  .pill-btn:active { background:rgba(255,255,255,.22); }
  .pill-btn.ready { background:#16a34a; border-color:#22c55e; }
  .pill-btn.ready b { color:#fff; }
  #claim-hint { font-size:12px; opacity:.8; }
  #target-pill b { color:#fca5a5; }

  button {
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.16);
    color:#fff; padding:11px 14px; border-radius:12px;
    font-size:14px; font-weight:500; font-family:inherit; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    transition:transform .1s ease, background .15s ease, box-shadow .15s ease;
  }
  button:active { transform:scale(.94); background:rgba(255,255,255,.22); }
  button.on { background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#60a5fa; }
  button.locked { opacity:.5; }
  button:disabled { opacity:.45; }
  button.danger { background:linear-gradient(180deg,#dc2626,#b91c1c); border-color:#ef4444; }
  button.go { background:linear-gradient(180deg,#22c55e,#15803d); border-color:#4ade80; }
  button.demolish-on { background:linear-gradient(180deg,#dc2626,#7f1d1d); border-color:#ef4444; }
  button.primary { background:linear-gradient(180deg,#3b82f6,#1d4ed8); border-color:#60a5fa; font-weight:600; }
  button.icon { padding:10px 12px; }
  button.rot-on { background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#60a5fa; }
  button.big { padding:13px 20px; font-size:15px; display:flex; align-items:center; gap:9px; }
  button.big .ico { font-size:19px; line-height:1; }

  .swatch {
    display:block; width:22px; height:22px; border-radius:6px;
    border:2px solid rgba(255,255,255,.5);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
    transition: background .15s ease;
  }

  #toast {
    position:fixed; top:64px; left:50%; transform:translateX(-50%) translateY(-8px);
    background:rgba(30,41,59,.96); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); border-radius:14px;
    padding:12px 20px; font-size:14px; font-weight:500;
    max-width:88vw; text-align:center; pointer-events:none; z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0; transition:opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.error { background:rgba(127,29,29,.96); border-color:rgba(239,68,68,.5); }
  #toast.tip { background:rgba(21,128,61,.96); border-color:rgba(74,222,128,.5); }
  #toast.warn { background:rgba(120,53,15,.96); border-color:rgba(245,158,11,.55); }

  #price-tag {
    position:fixed; top:0; left:0;
    background:rgba(17,26,51,.94); backdrop-filter:blur(6px);
    padding:4px 10px; border-radius:10px;
    font-size:13px; font-weight:600; color:#fde68a;
    border:1px solid rgba(255,255,255,.18);
    pointer-events:none; z-index:9; white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  #price-tag.bad { color:#fca5a5; }

  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:#0b1020; z-index:100; font-size:16px; line-height:1.5; }
  #status.hidden { display:none; }
  #err { color:#fca5a5; font-size:13px; }

  .screen { position:fixed; inset:0; background:#0b1020; z-index:50; display:flex; flex-direction:column; padding:14px; overflow-y:auto; animation:fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .screen-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .screen-title { font-size:20px; font-weight:700; }
  .island-row { display:flex; flex-direction:column; gap:4px; width:100%; text-align:left; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:13px 15px; margin-bottom:8px; }
  .island-row:active { background:rgba(255,255,255,.16); }
  .island-row.locked { opacity:.55; }
  .island-name { font-size:16px; font-weight:600; }
  .island-meta { font-size:13px; color:rgba(255,255,255,.7); }
  .island-badge { font-size:12px; color:#fca5a5; }
  .screen-note { text-align:center; color:rgba(255,255,255,.5); padding:32px 16px; }

  #loot-screen { align-items:center; justify-content:center; }
  .loot-card { background:#111a33; border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:28px 24px; text-align:center; max-width:340px; width:100%; }
  .loot-emoji { font-size:48px; margin-bottom:8px; }
  .loot-title { font-size:20px; font-weight:700; margin-bottom:16px; }
  .loot-row { font-size:15px; color:rgba(255,255,255,.8); margin-bottom:8px; }
  .loot-row b { color:#7dd3fc; font-size:18px; }
  .loot-card button { width:100%; margin-top:16px; }

  #onboard-screen { align-items:center; justify-content:center; }
  .onboard-card {
    background:#111a33; border:1px solid rgba(255,255,255,.15);
    border-radius:18px; padding:24px 22px; max-width:360px; width:100%;
    transition: transform .28s cubic-bezier(.3,.8,.4,1), opacity .28s ease;
  }
  #onboard-screen.closing .onboard-card {
    transform: scale(.94) translateY(6px);
    opacity: 0;
  }
  #onboard-screen.closing { background: transparent; }
  .onboard-emoji { font-size:44px; text-align:center; margin-bottom:6px; }
  .onboard-title { font-size:19px; font-weight:700; text-align:center; margin-bottom:18px; }
  .onboard-step { font-size:14px; line-height:1.5; color:rgba(255,255,255,.85); margin-bottom:12px; }
  .onboard-step b { color:#7dd3fc; }
  .onboard-card button { width:100%; margin-top:6px; }

  #tip-screen {
    background:linear-gradient(0deg, rgba(11,16,32,.95) 0%, rgba(11,16,32,.55) 45%, rgba(11,16,32,0) 100%);
    justify-content:flex-end;
    align-items:center;
    padding-bottom:36px;
  }
  .tip-card {
    background:rgba(17,26,51,.97);
    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;
    padding:18px 20px 16px;
    width:100%; max-width:440px;
    box-shadow:0 14px 44px rgba(0,0,0,.6);
  }
  .tip-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .tip-dot { width:10px; height:10px; border-radius:50%; background:#7dd3fc; box-shadow:0 0 10px #7dd3fc; animation: tipPulse 1.6s ease-in-out infinite; }
  @keyframes tipPulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.35); opacity:.6; } }
  .tip-title { font-size:15px; font-weight:700; color:#7dd3fc; letter-spacing:.3px; }
  .tip-text { font-size:15px; line-height:1.5; color:rgba(255,255,255,.94); margin-bottom:16px; min-height:44px; }
  .tip-word { display:inline-block; white-space:nowrap; }
  .tip-char { display:inline-block; opacity:0; animation: tipChar .32s ease-out forwards; }
  @keyframes tipChar { from { opacity:0; transform: translateY(7px) scale(.9); } to { opacity:1; transform: none; } }
  .tip-card button { width:100%; }

  #palette, #block-palette, #size-palette {
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:rgba(17,26,51,.98); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15); border-radius:16px;
    padding:14px; z-index:60; box-shadow:0 12px 40px rgba(0,0,0,.6);
    animation:popIn .18s ease-out;
  }
  @keyframes popIn { from { opacity:0; transform:translateX(-50%) scale(.92); } to { opacity:1; transform:translateX(-50%) scale(1); } }
  .palette-title { font-size:12px; color:rgba(255,255,255,.65); margin-bottom:10px; text-align:center; letter-spacing:.5px; text-transform:uppercase; }
  .palette-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .color-dot { width:46px; height:46px; border-radius:12px; border:2px solid rgba(255,255,255,.2); cursor:pointer; padding:0; }
  .color-dot:active { transform:scale(.86); }
  .color-dot.selected { border-color:#fff; border-width:3px; }

  .size-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .size-btn { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:100px; padding:12px 10px; }
  .size-btn .glyph { font-family:ui-monospace,monospace; font-size:15px; font-weight:700; }
  .size-btn .price { font-size:11px; opacity:.75; }
  .size-btn.selected { background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#60a5fa; }

  /* ---------- Магазин ---------- */
  .shop-section { margin-bottom:18px; }
  .shop-label {
    font-size:12px; color:rgba(255,255,255,.55);
    text-transform:uppercase; letter-spacing:.9px; margin-bottom:10px;
  }
  .shop-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .shop-card {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:rgba(255,255,255,.05);
    border:2px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:12px 10px 10px;
    cursor:pointer; font-family:inherit; color:#fff;
    transition: transform .12s ease, border-color .15s, background .15s;
  }
  .shop-card:active { transform: scale(.96); }
  .shop-card.selected { border-color:#3b82f6; background:rgba(59,130,246,.15); }
  .card-preview {
    width:72px; height:72px;
    display:flex; align-items:center; justify-content:center;
    animation: cardFloat 3.6s ease-in-out infinite;
  }
  .card-preview svg { width:100%; height:100%; filter: drop-shadow(0 4px 8px rgba(0,0,0,.45)); }
  @keyframes cardFloat {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%     { transform: translateY(-5px) rotate(2deg); }
  }
  .card-name { font-size:14px; font-weight:600; }
  .card-info { font-size:11px; color:rgba(255,255,255,.6); text-align:center; line-height:1.3; min-height:28px; }
  .card-price { font-size:12px; color:#fde68a; font-weight:600; }

  .shop-summary {
    text-align:center; font-size:15px; padding:12px;
    background:rgba(255,255,255,.05); border-radius:12px;
    margin-bottom:12px; color:rgba(255,255,255,.85);
  }
  .shop-summary b { color:#fde68a; }

  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app"></div>

<div class="bar" id="top">
  <button class="pill pill-btn" id="claim-btn" title="Claim">
    ⚡ <b id="ether">—</b>
    <span id="claim-hint">…</span>
  </button>
  <div class="pill">🧱 <b id="cubes">—</b></div>
  <div class="pill">🚩 <b id="flag">—</b></div>
  <div class="pill hidden" id="target-pill">👁 <b id="target-name">—</b></div>
</div>

<div id="price-tag" class="hidden">10⚡</div>

<div class="bar" id="bottom">
  <button id="btn-build" class="primary icon" title="Build">🔨</button>
  <button id="btn-size" class="hidden">📐 <span id="size-label">1×1</span></button>
  <button id="btn-rotate" class="hidden icon" title="Rotate H">↔️</button>
  <button id="btn-vertical" class="hidden icon" title="Rotate V">↕️</button>
  <button id="btn-block-color" class="hidden icon" title="Block color"><span class="swatch" id="swatch-block"></span></button>
  <button id="btn-palette" class="hidden icon" title="Flag color">🎨</button>
  <button id="btn-demolish" class="hidden icon" title="Demolish">🗑</button>
  <button id="btn-shop" class="hidden icon" title="Shop">🛒</button>
  <button id="btn-world" class="icon" title="World">🌍</button>
  <button id="reload" class="icon" title="Reload">↻</button>
</div>

<div class="bar hidden" id="bottom-visit">
  <button id="btn-back" class="big"><span class="ico">↩</span><span data-i18n="back">Назад</span></button>
  <button id="btn-raid" class="danger big"><span class="ico">⚔️</span><span data-i18n="raid">Рейд</span></button>
</div>

<div class="bar hidden" id="bottom-raid">
  <button id="btn-flag" class="danger big">
    <span id="btn-flag-ico" class="ico">🚩</span>
    <span id="btn-flag-label" data-i18n="flag">Флаг</span>
  </button>
  <button id="btn-leave" class="big">
    <span class="ico">🏳</span>
    <span data-i18n="leave">Выйти</span>
  </button>
</div>

<div id="palette" class="hidden">
  <div class="palette-title" data-i18n="flagColor">Цвет флага</div>
  <div class="palette-grid" id="palette-grid"></div>
</div>

<div id="block-palette" class="hidden">
  <div class="palette-title" data-i18n="blockColor">Цвет блока</div>
  <div class="palette-grid" id="block-palette-grid"></div>
</div>

<div id="size-palette" class="hidden">
  <div class="palette-title" data-i18n="sizeTitle">Размер блока</div>
  <div class="size-grid" id="size-grid"></div>
</div>

<div class="screen hidden" id="world-screen">
  <div class="screen-head">
    <div class="screen-title" data-i18n="worldTitle">🌍 Мир</div>
    <button id="world-close">✕</button>
  </div>
  <div id="world-list"></div>
</div>

<div class="screen hidden" id="loot-screen">
  <div class="loot-card">
    <div class="loot-emoji">🏆</div>
    <div class="loot-title" data-i18n="lootTitle">Флаг разрушен!</div>
    <div class="loot-row"><span data-i18n="lootStolen">Украдено:</span> <b id="loot-stolen">0</b></div>
    <div class="loot-row"><span data-i18n="lootBalance">Баланс:</span> <b id="loot-balance">0</b></div>
    <button id="loot-ok" class="go" data-i18n="returnHome">Вернуться</button>
  </div>
</div>

<div class="screen hidden" id="tip-screen">
  <div class="tip-card">
    <div class="tip-head">
      <div class="tip-dot"></div>
      <div class="tip-title" id="tip-title" data-i18n="tipTitle">Буй говорит</div>
    </div>
    <div class="tip-text" id="tip-text"></div>
    <button id="tip-ok" class="go" data-i18n="tipOk">Ок</button>
  </div>
</div>

<div class="screen hidden" id="onboard-screen">
  <div class="onboard-card">
    <div class="onboard-emoji">🏝️</div>
    <div class="onboard-title" data-i18n="onboardTitle">Добро пожаловать в ADRIFT</div>
    <div class="onboard-step" data-i18n-html="onboard1"></div>
    <div class="onboard-step" data-i18n-html="onboard2"></div>
    <div class="onboard-step" data-i18n-html="onboard3"></div>
    <div class="onboard-step" data-i18n-html="onboard4"></div>
    <button id="onboard-ok" class="go" data-i18n="onboardOk">Понятно, играем</button>
  </div>
</div>

<div class="screen hidden" id="shop-screen">
  <div class="screen-head">
    <div class="screen-title" data-i18n="shopTitle">🛒 Магазин</div>
    <button id="shop-close">✕</button>
  </div>

  <div class="shop-section">
    <div class="shop-label" data-i18n="shopShape">1. Форма</div>
    <div class="shop-grid" id="shop-shapes"></div>
  </div>

  <div class="shop-section">
    <div class="shop-label" data-i18n="shopMaterial">2. Материал</div>
    <div class="shop-grid" id="shop-materials"></div>
  </div>

  <div class="shop-summary" id="shop-summary"></div>
  <button class="go big" id="shop-confirm" style="width:100%;justify-content:center;">
    <span class="ico">🔨</span>
    <span data-i18n="shopBuild">Строить</span>
  </button>
</div>

<div id="toast" class="hidden"></div>
<div id="status">Loading...<br><span id="err"></span></div>

const lang = (navigator.language || 'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en';

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.ru[key] || key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace('{' + k + '}', v);
  return s;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.documentElement.lang = lang;
}

let toastTimer = null;
function toast(msg, kind = 'info') {
  toastEl.textContent = msg;
  toastEl.classList.toggle('error', kind === 'error');
  toastEl.classList.toggle('tip', kind === 'tip');
  toastEl.classList.toggle('warn', kind === 'warn');
  toastEl.classList.remove('hidden');
  requestAnimationFrame(() => toastEl.classList.add('show'));
  clearTimeout(toastTimer);
  const dur = kind === 'error' ? 2600 : (kind === 'warn' ? 3200 : (kind === 'tip' ? 3000 : 1600));
  toastTimer = setTimeout(() => {
    toastEl.classList.remove('show');
    setTimeout(() => toastEl.classList.add('hidden'), 220);
  }, dur);
}

const fmtTime = (s) => {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + ':' + String(sec).padStart(2, '0');
  return '0:' + String(sec).padStart(2, '0');
};

async function signIn() {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}` },
    body: '{}',
  });
  if (!res.ok) throw new Error('Auth: ' + res.status);
  const data = await res.json();
  token = data.access_token; myId = data.user.id;
  localStorage.setItem('adrift_token', token);
  localStorage.setItem('adrift_id', myId);
}
function clearSession() { token = null; myId = null; localStorage.removeItem('adrift_token'); localStorage.removeItem('adrift_id'); }

async function api(path, options = {}) {
  const res = await fetch(API_URL + path, {
    ...options,
    headers: { 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json', ...(options.headers||{}) },
  });
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const err = new Error(body?.error?.message || res.statusText);
    err.code = body?.error?.code || ('HTTP_' + res.status);
    err.details = body?.error?.details;
    throw err;
  }
  return body;
}
const AUTH_ERRORS = ['TOKEN_EXPIRED','TOKEN_INVALID','TOKEN_MISSING','UNAUTHORIZED'];

async function auth() {
  const saved = localStorage.getItem('adrift_token');
  const savedId = localStorage.getItem('adrift_id');
  if (saved && savedId) {
    token = saved; myId = savedId;
    try { await api('/api/v1/build/catalog'); return; }
    catch (e) { if (!AUTH_ERRORS.includes(e.code)) throw e; clearSession(); }
  }
  fail(t('login')); await signIn();
}

function makeWoodTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
  for (let i = 0; i < 22; i++) {
    const y = Math.random() * size;
    ctx.strokeStyle = `rgba(0,0,0,${0.04 + Math.random()*0.06})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath(); ctx.moveTo(0, y);
    for (let x = 0; x <= size; x += 8) ctx.lineTo(x, y + Math.sin(x/14+i)*2.5);
    ctx.stroke();
  }
  for (let i = 0; i < 2; i++) {
    const cx = Math.random()*size, cy = Math.random()*size;
    for (let r = 2; r < 8; r += 2) {
      ctx.strokeStyle = `rgba(0,0,0,${0.08 - r*0.008})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(cx, cy, r*1.6, r, 0, 0, Math.PI*2); ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const WOOD_TEXTURE = makeWoodTexture();

// ---------- ГЕОМЕТРИЯ ПО ФОРМЕ ----------
function shapeGeometry(shape, sx, sy, sz) {
  if (shape === 'triangle') {
    const r = Math.min(sx, sz) * 0.62;
    const g = new THREE.CylinderGeometry(r, r, sy, 3, 1);
    g.rotateY(Math.PI / 6);
    return g;
  }
  if (shape === 'circle') {
    const r = Math.min(sx, sz) * 0.5;
    return new THREE.CylinderGeometry(r, r, sy, 16, 1);
  }
  if (shape === 'half') {
    return new THREE.BoxGeometry(sx, sy * 0.5, sz);
  }
  return new THREE.BoxGeometry(sx, sy, sz);
}

// ---------- КУБЫ ----------
const cubeMeshes = new Map();
let blockedGround = new Set();

function makeCubeMaterial(color) {
  return new THREE.MeshLambertMaterial({
    map: WOOD_TEXTURE,
    color: new THREE.Color(BLOCK_COLORS_HEX[color] || BLOCK_COLORS_HEX.wood),
  });
}
// Центр блока. Полублок прижат к нижней грани клетки — центр смещён вниз.
function cubeCenter(c) {
  const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
  const isHalf = (c.shape === 'half');
  return {
    x: c.x + sx/2,
    y: c.y + (isHalf ? sy * 0.25 : sy/2),
    z: c.z + sz/2,
  };
}
function rebuildBlockedGround() {
  blockedGround = new Set();
  for (const m of cubeMeshes.values()) {
    const c = m.userData.cube;
    const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
    if (c.y <= 0 && c.y + sy - 1 >= 0) {
      for (let dx = 0; dx < sx; dx++)
        for (let dz = 0; dz < sz; dz++)
          blockedGround.add((c.x+dx) + ',' + (c.z+dz));
    }
  }
}
function addCube(c) {
  if (cubeMeshes.has(c.id)) return;
  const color = c.color || 'wood';
  const shape = c.shape || 'block';
  const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
  const geo = shapeGeometry(shape, sx, sy, sz);
  const mesh = new THREE.Mesh(geo, makeCubeMaterial(color));
  const cc = cubeCenter({ ...c, shape, size_x:sx, size_y:sy, size_z:sz });
  mesh.position.set(cc.x, cc.y, cc.z);
  mesh.userData.cube = { ...c, color, shape, size_x:sx, size_y:sy, size_z:sz };
  scene.add(mesh); cubeMeshes.set(c.id, mesh);
  paintCube(mesh);
  rebuildBlockedGround();
  resetMinionPath();
}
function paintCube(mesh) {
  const c = mesh.userData.cube;
  const ratio = c.max_hp > 0 ? Math.max(0, Math.min(1, c.hp/c.max_hp)) : 0;
  const base = new THREE.Color(BLOCK_COLORS_HEX[c.color] || BLOCK_COLORS_HEX.wood);
  const hurt = new THREE.Color(0x7f1d1d);
  mesh.material.color.copy(base).lerp(hurt, 1 - ratio);
}
function updateCubeHp(id, hp) {
  const mesh = cubeMeshes.get(id); if (!mesh) return;
  mesh.userData.cube.hp = hp; paintCube(mesh);
}
function removeCube(id) {
  const mesh = cubeMeshes.get(id); if (!mesh) return;
  scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); cubeMeshes.delete(id);
  rebuildBlockedGround(); resetMinionPath();
}
function resetCubes() { for (const id of [...cubeMeshes.keys()]) removeCube(id); rebuildBlockedGround(); }
function refreshCounters() { $('cubes').textContent = cubeMeshes.size; }
function setFlagVisual(hp, maxHp, color) {
  currentFlagHp = hp; currentFlagMax = maxHp;
  if (color) displayFlagColor = color;
  const ratio = maxHp > 0 ? Math.max(0, Math.min(1, hp/maxHp)) : 0;
  const base = new THREE.Color(FLAG_COLORS_HEX[displayFlagColor] || FLAG_COLORS_HEX.red);
  banner.material.color.copy(base).lerp(new THREE.Color(0x7f1d1d), 1 - ratio);
  $('flag').textContent = Math.max(0, hp) + ' / ' + maxHp;
  setMinionFlagColor(displayFlagColor);
}

  const px = 96;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = px;
  const ctx = canvas.getContext('2d');
  ctx.font = `${Math.floor(px * 0.76)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(char, px/2, px/2 + px*0.04);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  emojiTexCache.set(char, tex);
  return tex;
}
function makeSprite(char, size) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: emojiTexture(char), transparent: true, depthWrite: false, opacity: 0,
  }));
  sp.scale.set(size, size, 1); sp.userData.char = char;
  return sp;
}
function setSpriteChar(sp, char, size) {
  if (sp.userData.char !== char) {
    sp.material.map = emojiTexture(char);
    sp.userData.char = char;
    sp.material.needsUpdate = true;
  }
  sp.scale.set(size, size, 1);
}

const minion = {
  x: 3, z: 3,
  path: [],
  phase: 0,
  idleUntil: 0,
  facing: 0,
  lastTip: -1,
  lastTipText: null,
  mood: 'calm',
  frozen: false,
  thinking: false,
  thinkUntil: 0,
  panicBoost: 0,
  nextTalk: 0,
  talkUntil: 0,
  bubbleChar: '💬',
  nextIdleAct: 0,
  idleAct: null,
  idleActUntil: 0,
  pendingTip: null,
};

function setMinionFlagColor(color) {
  minionFlagMat.color.set(FLAG_COLORS_HEX[color] || FLAG_COLORS_HEX.red);
}

function refreshMinionMood() {
  if (minion.frozen || minion.thinking) return;
  if (mode === 'raid') minion.mood = 'panic';
  else if (mode === 'own' && myRaidAlert) minion.mood = 'alert';
  else minion.mood = 'calm';
}

function cellFree(x, z) {
  if (x < -32 || x > 32 || z < -32 || z > 32) return false;
  if (x === 0 && z === 0) return false;
  return !blockedGround.has(x + ',' + z);
}
function bfsPath(sx, sz, tx, tz) {
  if (!cellFree(tx, tz)) return null;
  const key = (x, z) => x + ',' + z;
  const queue = [[sx, sz]];
  const prev = new Map();
  prev.set(key(sx, sz), null);
  let head = 0;
  while (head < queue.length) {
    const [x, z] = queue[head++];
    if (x === tx && z === tz) {
      const path = [];
      let cur = key(x, z);
      while (cur !== null) {
        const [px, pz] = cur.split(',').map(Number);
        path.push([px, pz]);
        cur = prev.get(cur);
      }
      return path.reverse();
    }
    for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, nz = z + dz;
      const k = key(nx, nz);
      if (prev.has(k)) continue;
      if (!cellFree(nx, nz)) continue;
      prev.set(k, key(x, z));
      queue.push([nx, nz]);
    }
  }
  return null;
}
function resetMinionPath() { minion.path = []; }

function pickMinionTarget() {
  const panic = minion.mood === 'panic';
  const rMin = panic ? PANIC_RADIUS_MIN : MINION_RADIUS_MIN;
  const rMax = panic ? PANIC_RADIUS_MAX : MINION_RADIUS_MAX;
  for (let i = 0; i < 14; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = rMin + Math.random() * (rMax - rMin);
    const tx = Math.round(Math.cos(angle) * r);
    const tz = Math.round(Math.sin(angle) * r);
    if (!cellFree(tx, tz)) continue;
    if (tx === minion.x && tz === minion.z) continue;
    const path = bfsPath(minion.x, minion.z, tx, tz);
    if (path && path.length > 1) { minion.path = path.slice(1); return; }
  }
}
function placeMinionInitial() {
  for (let r = 2; r <= 10; r++) {
    for (let a = 0; a < 16; a++) {
      const ang = (a / 16) * Math.PI * 2;
      const x = Math.round(Math.cos(ang) * r);
      const z = Math.round(Math.sin(ang) * r);
      if (cellFree(x, z)) {
        minion.x = x; minion.z = z;
        minionGroup.position.set(x + 0.5, 0, z + 0.5);
        resetMinionPath();
        return;
      }
    }
  }
  minionGroup.position.set(2.5, 0, 2.5);
}

function approach(current, target, dt, k) {
  return current + (target - current) * Math.min(1, dt * k);
}

function pickIdleAct(now) {
  minion.idleAct = IDLE_ACTS[Math.floor(Math.random() * IDLE_ACTS.length)];
  minion.idleActUntil = now + 1.8;
}

function updateBubbles(now, dt) {
  let char = null;
  let size = 1.1;

  if (minion.thinking) { char = '🤔'; size = 1.15; }
  else if (minion.frozen) { char = '👋'; size = 1.15; }
  else if (minion.mood === 'panic') { char = '💦'; size = 0.95; }
  else if (minion.mood === 'alert') { char = '⚠️'; size = 1.0; }
  else if (now < minion.talkUntil) { char = minion.bubbleChar || '💬'; size = 1.0; }

  if (char) {
    setSpriteChar(bubbleSprite, char, size);
    const pulse = char === '⚠️'
      ? 1 + Math.sin(now * 5) * 0.1
      : 1 + Math.sin(now * 2.4) * 0.04;
    bubbleSprite.scale.set(size * pulse, size * pulse, 1);
    bubbleSprite.position.y = 2.55 + Math.sin(now * 2.1) * 0.07;
    bubbleSprite.material.opacity = 1;
  } else {
    bubbleSprite.material.opacity = 0;
  }

  for (const d of droplets) {
    if (minion.mood !== 'panic') { d.material.opacity = 0; continue; }
    const t = ((now * 0.75 + d.userData.phase) % 1);
    const ang = d.userData.phase * Math.PI * 2 + now * 2.2;
    d.position.set(Math.cos(ang) * 0.42, 1.15 + t * 1.1, Math.sin(ang) * 0.32);
    d.material.opacity = Math.sin(t * Math.PI) * 0.95;
    d.scale.setScalar(0.45 + t * 0.25);
  }
}

function idleMinion(now, dt) {
  const panic = minion.mood === 'panic';
  const alert = minion.mood === 'alert';
  const breath = Math.sin(now * 1.7);

  let legLx = 0, legRx = 0;
  let armLx = breath * 0.06, armRx = Math.PI;
  let headZ = Math.sin(now * 0.7) * 0.05;
  let headY = Math.sin(now * 0.45) * 0.16;
  let rootY = breath * 0.015;
  let bodyY = 0;

  if (panic) {
    armLx = Math.PI * 0.85 + Math.sin(now * 8) * 0.35;
    armRx = Math.PI;
    headZ = Math.sin(now * 9) * 0.1;
    headY = Math.sin(now * 7) * 0.12;
    bodyY = Math.abs(Math.sin(now * 6)) * 0.03;
  } else if (alert) {
    armLx = 0.5 + Math.sin(now * 3) * 0.12;
    armRx = Math.PI;
    headZ = Math.sin(now * 2.2) * 0.05;
    headY = Math.sin(now * 1.1) * 0.28;
    bodyY = breath * 0.012;
  } else if (minion.idleAct && now < minion.idleActUntil) {
    const t = now - (minion.idleActUntil - 1.8);
    switch (minion.idleAct) {
      case 'stretch':
        armLx = -2.4; armRx = Math.PI - 0.4;
        headZ = -0.1;
        rootY = Math.sin(t * 2.5) * 0.03;
        break;
      case 'tapFoot':
        armLx = 0.3; legLx = -0.1;
        rootY = Math.abs(Math.sin(t * 9)) * 0.02;
        break;
      case 'scratchHead':
        armLx = -2.55; headZ = 0.1;
        headY = Math.sin(t * 1.2) * 0.1;
        break;
      case 'lookAround':
        headY = Math.sin(t * 2.5) * 0.5;
        break;
      case 'dance':
        armLx = -2.2 + Math.sin(t * 6) * 0.3;
        armRx = Math.PI - 0.5 + Math.cos(t * 6) * 0.3;
        headZ = Math.sin(t * 6) * 0.15;
        rootY = Math.abs(Math.sin(t * 6)) * 0.06;
        break;
      case 'kick':
        legLx = -0.8;
        armLx = -0.4; armRx = Math.PI + 0.3;
        break;
      case 'whistle':
        armLx = -1.9; headZ = 0.06;
        headY = Math.sin(t * 3) * 0.05;
        break;
      case 'think':
        armLx = -1.7; headZ = 0.08; headY = 0.1;
        break;
    }
  }

  minionParts.legLPivot.rotation.x = approach(minionParts.legLPivot.rotation.x, legLx, dt, 8);
  minionParts.legRPivot.rotation.x = approach(minionParts.legRPivot.rotation.x, legRx, dt, 8);
  minionParts.armLPivot.rotation.x = approach(minionParts.armLPivot.rotation.x, armLx, dt, 9);
  minionParts.armRPivot.rotation.x = approach(minionParts.armRPivot.rotation.x, armRx, dt, 9);
  minionParts.head.rotation.z = approach(minionParts.head.rotation.z, headZ, dt, 8);
  minionParts.head.rotation.y = approach(minionParts.head.rotation.y, headY, dt, 6);
  minionParts.bodyGroup.rotation.x = approach(minionParts.bodyGroup.rotation.x, 0, dt, 6);
  minionParts.bodyGroup.position.y = bodyY;
  minionGroup.position.y = approach(minionGroup.position.y, rootY, dt, 10);
}

function updateMinion(dt) {
  const now = performance.now() / 1000;

  if (!minion.frozen && !cellFree(minion.x, minion.z)) placeMinionInitial();

  if (minion.idleAct && now >= minion.idleActUntil) minion.idleAct = null;

  if (minion.thinking) {
    minionParts.armLPivot.rotation.x = approach(minionParts.armLPivot.rotation.x, -1.9, dt, 7);
    minionParts.armRPivot.rotation.x = Math.PI;
    minionParts.head.rotation.x = approach(minionParts.head.rotation.x, -0.22, dt, 6);
    minionParts.head.rotation.z = approach(minionParts.head.rotation.z, 0.06, dt, 6);
    minionParts.legLPivot.rotation.x = approach(minionParts.legLPivot.rotation.x, 0, dt, 8);
    minionParts.legRPivot.rotation.x = approach(minionParts.legRPivot.rotation.x, 0, dt, 8);
    minionParts.bodyGroup.rotation.x = approach(minionParts.bodyGroup.rotation.x, 0, dt, 6);
    minionGroup.position.y = approach(minionGroup.position.y, 0, dt, 10);
    return;
  }

  if (minion.frozen) {
    minionParts.armLPivot.rotation.x = Math.PI * 0.7 + Math.sin(now * 5) * 0.3;
    minionParts.armRPivot.rotation.x = Math.PI;
    minionParts.legLPivot.rotation.x = approach(minionParts.legLPivot.rotation.x, 0, dt, 8);
    minionParts.legRPivot.rotation.x = approach(minionParts.legRPivot.rotation.x, 0, dt, 8);
    minionParts.bodyGroup.rotation.x = approach(minionParts.bodyGroup.rotation.x, 0, dt, 6);
    minionParts.head.rotation.x = approach(minionParts.head.rotation.x, 0, dt, 6);
    minionParts.head.rotation.z = Math.sin(now * 1.4) * 0.09;
    minionParts.head.rotation.y = approach(minionParts.head.rotation.y, 0, dt, 6);
    minionParts.bodyGroup.position.y = Math.sin(now * 2.2) * 0.02;
    minionGroup.position.y = approach(minionGroup.position.y, 0, dt, 10);
    return;
  }

  const panic = minion.mood === 'panic';
  const alert = minion.mood === 'alert';
  minion.panicBoost = Math.max(0, minion.panicBoost - dt * 0.6);

  if (minion.path.length === 0) {
    if (now < minion.idleUntil) {
      idleMinion(now, dt);
      if (now > minion.nextIdleAct) {
        minion.nextIdleAct = now + 5 + Math.random() * 8;
        if (Math.random() < 0.7) pickIdleAct(now);
      }
      return;
    }
    pickMinionTarget();
    if (minion.path.length === 0) { minion.idleUntil = now + 1.0; return; }
    const basePause = panic ? 0.1 + Math.random() * 0.3
                    : (alert ? 0.5 + Math.random() * 1.2
                             : 0.9 + Math.random() * 2.6);
    minion.idleUntil = now + basePause;
  }

  const [nx, nz] = minion.path[0];
  const tx = nx + 0.5, tz = nz + 0.5;
  const px = minionGroup.position.x, pz = minionGroup.position.z;
  const dx = tx - px, dz = tz - pz;
  const dist = Math.hypot(dx, dz);
  const speed = panic ? (3.0 + minion.panicBoost * 0.8) : (alert ? 2.0 : 1.5);
  const step = speed * dt;

  if (dist <= step) {
    minionGroup.position.x = tx; minionGroup.position.z = tz;
    minion.x = nx; minion.z = nz;
    minion.path.shift();
  } else {
    minionGroup.position.x += (dx / dist) * step;
    minionGroup.position.z += (dz / dist) * step;
  }

  const targetAngle = Math.atan2(dx, dz);
  let diff = targetAngle - minion.facing;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  minion.facing += diff * Math.min(1, dt * (panic ? 12 : 7));
  minionGroup.rotation.y = minion.facing;

  const freq = panic ? 13 + minion.panicBoost * 2 : (alert ? 8 : 6.5);
  minion.phase += dt * freq;
  const s = Math.sin(minion.phase);

  minionParts.head.rotation.x = approach(minionParts.head.rotation.x, 0, dt, 5);

  if (panic) {
    minionParts.legLPivot.rotation.x = s * 0.95;
    minionParts.legRPivot.rotation.x = -s * 0.95;
    minionParts.armLPivot.rotation.x = Math.PI * 0.85 + Math.sin(minion.phase * 1.6) * 0.45;
    minionParts.armRPivot.rotation.x = Math.PI + Math.sin(minion.phase * 1.9 + 1) * 0.2;
    minionParts.head.rotation.z = Math.sin(minion.phase * 0.7) * 0.13;
    minionParts.head.rotation.y = approach(minionParts.head.rotation.y, 0, dt, 8);
    minionParts.bodyGroup.rotation.x = 0.18;
    minionParts.bodyGroup.position.y = 0;
    minionGroup.position.y = Math.abs(s) * 0.13;
  } else if (alert) {
    minionParts.legLPivot.rotation.x = s * 0.75;
    minionParts.legRPivot.rotation.x = -s * 0.75;
    minionParts.armLPivot.rotation.x = 0.45 - s * 0.35;
    minionParts.armRPivot.rotation.x = Math.PI;
    minionParts.head.rotation.z = s * 0.05;
    minionParts.head.rotation.y = Math.sin(performance.now() / 420) * 0.24;
    minionParts.bodyGroup.rotation.x = 0.1;
    minionParts.bodyGroup.position.y = 0;
    minionGroup.position.y = Math.abs(s) * 0.06;
  } else {
    minionParts.legLPivot.rotation.x = s * 0.62;
    minionParts.legRPivot.rotation.x = -s * 0.62;
    minionParts.armLPivot.rotation.x = -s * 0.5;
    minionParts.armRPivot.rotation.x = Math.PI;
    minionParts.head.rotation.z = s * 0.04;
    minionParts.head.rotation.y = approach(minionParts.head.rotation.y, 0, dt, 5);
    minionParts.bodyGroup.rotation.x = 0.06;
    minionParts.bodyGroup.position.y = 0;
    minionGroup.position.y = Math.abs(s) * 0.05;
  }

  if (!panic && !alert && now > minion.nextTalk && now > minion.talkUntil) {
    minion.talkUntil = now + 2.0;
    minion.nextTalk = now + 6 + Math.random() * 8;
    minion.bubbleChar = MINION_BUBBLES[Math.floor(Math.random() * MINION_BUBBLES.length)];
  }
}

// ---------- КАМЕРА: АНИМАЦИЯ ФОКУСА ----------
const camAnim = {
  active: false, t: 0, dur: 1,
  fromPos: new THREE.Vector3(), toPos: new THREE.Vector3(),
  fromTgt: new THREE.Vector3(), toTgt: new THREE.Vector3(),
  onDone: null,
};
const savedCam = { pos: new THREE.Vector3(), tgt: new THREE.Vector3() };

function animateCamera(toPos, toTgt, dur, onDone) {
  camAnim.active = true; camAnim.t = 0; camAnim.dur = Math.max(0.01, dur);
  camAnim.fromPos.copy(camera.position);
  camAnim.fromTgt.copy(controls.target);
  camAnim.toPos.copy(toPos);
  camAnim.toTgt.copy(toTgt);
  camAnim.onDone = onDone || null;
  controls.enabled = false;
}
function updateCameraAnim(dt) {
  if (!camAnim.active) return false;
  camAnim.t += dt;
  const k = Math.min(1, camAnim.t / camAnim.dur);
  const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
  controls.target.lerpVectors(camAnim.fromTgt, camAnim.toTgt, e);
  if (k >= 1) {
    camAnim.active = false;
    const cb = camAnim.onDone; camAnim.onDone = null;
    if (cb) cb();
  }
  return true;
}

// ---------- СОВЕТ БУЯ ----------
function pickTip() {
  const bundle = I18N[lang];

  if (mode === 'visit') {
    const pool = bundle.foreignTips || [];
    if (!pool.length) return t('flagProtected');
    let idx = Math.floor(Math.random() * pool.length);
    if (pool[idx] === minion.lastTipText) idx = (idx + 1) % pool.length;
    minion.lastTipText = pool[idx];
    return pool[idx];
  }

  const alertTips = bundle.alertTips || [];
  const tips = bundle.tips;
  if (minion.mood === 'alert' && alertTips.length && Math.random() < 0.6) {
    const choice = alertTips[Math.floor(Math.random() * alertTips.length)];
    minion.lastTipText = choice.text;
    return choice.text;
  }

  const hasCubes = cubeMeshes.size > 0;
  const filtered = tips.filter(tip => {
    if (tip.cond === 'hasCubes') return hasCubes;
    if (tip.cond === 'noCubes') return !hasCubes;
    return true;
  });
  let idx = Math.floor(Math.random() * filtered.length);
  if (filtered[idx].text === minion.lastTipText) idx = (idx + 1) % filtered.length;
  minion.lastTipText = filtered[idx].text;
  return filtered[idx].text;
}

function animateTipText(text) {
  const el = $('tip-text');
  el.innerHTML = '';
  let i = 0;
  for (const word of text.split(' ')) {
    const w = document.createElement('span');
    w.className = 'tip-word';
    for (const ch of word) {
      const s = document.createElement('span');
      s.className = 'tip-char';
      s.textContent = ch;
      s.style.animationDelay = (i * 26) + 'ms';
      w.appendChild(s); i++;
    }
    el.appendChild(w);
    el.appendChild(document.createTextNode(' '));
    i++;
  }
  return i * 26 + 340;
}

const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const hitPoint = new THREE.Vector3();
const normalMatrix = new THREE.Matrix3();
const projVec = new THREE.Vector3();
const isTouch = window.matchMedia('(pointer: coarse)').matches;
const aimPoint = { x: 0, y: 0 };
window.addEventListener('pointermove', (ev) => {
  if (isTouch) return;
  aimPoint.x = (ev.clientX / innerWidth) * 2 - 1;
  aimPoint.y = -(ev.clientY / innerHeight) * 2 + 1;
});

function computePlacement(ndcX, ndcY) {
  const { sx, sy, sz } = effFootprint();
  raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
  const cubeHits = raycaster.intersectObjects([...cubeMeshes.values()], false);
  let x, y, z;
  if (cubeHits.length) {
    const h = cubeHits[0];
    const base = h.object.userData.cube;
    const bsx = base.size_x||1, bsy = base.size_y||1, bsz = base.size_z||1;
    const bc = cubeCenter({ ...base, size_x:bsx, size_y:bsy, size_z:bsz });
    normalMatrix.getNormalMatrix(h.object.matrixWorld);
    const n = h.face.normal.clone().applyMatrix3(normalMatrix).normalize();
    const ax = Math.round(n.x), ay = Math.round(n.y), az = Math.round(n.z);
    if (ay !== 0) {
      y = ay > 0 ? base.y + bsy : base.y - sy;
      x = Math.round(bc.x - sx/2); z = Math.round(bc.z - sz/2);
    } else if (ax !== 0) {
      x = ax > 0 ? base.x + bsx : base.x - sx;
      y = base.y + Math.round((bsy - sy)/2);
      z = Math.round(bc.z - sz/2);
    } else {
      z = az > 0 ? base.z + bsz : base.z - sz;
      y = base.y + Math.round((bsy - sy)/2);
      x = Math.round(bc.x - sx/2);
    }
  } else {
    if (!raycaster.ray.intersectPlane(plane, hitPoint)) return null;
    x = Math.round(hitPoint.x - sx/2); y = 0; z = Math.round(hitPoint.z - sz/2);
  }
  const baseCost = cubeTypeInfo(selectedMaterial, selectedShape).cost;
  const price = baseCost * sx * sy * sz;

  if (x < -32 || x + sx - 1 > 32 || z < -32 || z + sz - 1 > 32 || y < 0 || y + sy - 1 > 32) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('outOfBounds'), price };
  }

  const R = FLAG_CLEAR_RADIUS;
  if (
    x <= R && x + sx - 1 >= -R &&
    z <= R && z + sz - 1 >= -R
  ) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('flagReserved'), price };
  }

  for (const m of cubeMeshes.values()) {
    const c = m.userData.cube;
    const csx = c.size_x||1, csy = c.size_y||1, csz = c.size_z||1;
    if (x < c.x+csx && x+sx > c.x && y < c.y+csy && y+sy > c.y && z < c.z+csz && z+sz > c.z) {
      return { x, y, z, sx, sy, sz, valid:false, reason: t('occupied'), price };
    }
  }
  if (y > 0) {
    for (let dx = 0; dx < sx; dx++) {
      for (let dz = 0; dz < sz; dz++) {
        const cx = x + dx, cz = z + dz;
        let supported = false;
        for (const m of cubeMeshes.values()) {
          const c = m.userData.cube;
          const csx = c.size_x||1, csy = c.size_y||1, csz = c.size_z||1;
          if (c.y <= y-1 && c.y + csy - 1 >= y-1 &&
              c.x <= cx && c.x + csx - 1 >= cx &&
              c.z <= cz && c.z + csz - 1 >= cz) { supported = true; break; }
        }
        if (!supported) return { x, y, z, sx, sy, sz, valid:false, reason: t('noSupport'), price };
      }
    }
  }
  if (econ.ether_balance < price) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('noEther'), price };
  }
  return { x, y, z, sx, sy, sz, valid:true, reason:'', price };
}

function updateGhost() {
  if (!buildMode || mode !== 'own' || demolishMode) {
    ghost.visible = false; priceEl.classList.add('hidden');
    noBuildRing.visible = false;
    return;
  }
  noBuildRing.visible = true;

  const p = computePlacement(aimPoint.x, aimPoint.y);
  if (!p) { ghost.visible = false; priceEl.classList.add('hidden'); return; }

  const cy = (selectedShape === 'half') ? p.y + p.sy * 0.25 : p.y + p.sy / 2;
  ghost.position.set(p.x + p.sx / 2, cy, p.z + p.sz / 2);
  ghostMat.color.set(p.valid ? 0x22c55e : 0xef4444);
  ghost.visible = true;

  priceEl.textContent = p.price + '⚡';
  priceEl.classList.toggle('bad', !p.valid);
  projVec.set(p.x + p.sx / 2, p.y + p.sy + 0.35, p.z + p.sz / 2).project(camera);
  if (projVec.z > 1) { priceEl.classList.add('hidden'); return; }
  const px = (projVec.x * 0.5 + 0.5) * innerWidth;
  const py = (-projVec.y * 0.5 + 0.5) * innerHeight;
  priceEl.style.transform = `translate(${px}px, ${py}px) translate(-50%, -100%)`;
  priceEl.classList.remove('hidden');
}

function flagLockedMessage(st) {

  raidFlagState = st;
  if (!st) { updateFlagButton(); return; }

  if (st.can_attack && !flagWasOpen) {
    flagWasOpen = true;
    toast(t('flagOpened'), 'tip');
  }

function updateFlagButton() {
  const btn = $('btn-flag');
  const label = $('btn-flag-label');

    if (label) label.textContent = t('flag');
    if (ico) ico.textContent = '🚩';
    btn.classList.add('locked');
    return;
  }

  if (raidFlagState.can_attack) {
    if (label) label.textContent = t('flag');
    if (ico) ico.textContent = '🚩';
    btn.classList.remove('locked');
    return;
  }

  btn.classList.add('locked');

    if (ico) ico.textContent = '🔒';
    if (label) label.textContent = raidFlagState.percent + '%';
  } else {
    if (ico) ico.textContent = '🚧';
    if (label) label.textContent = t('flag');
  }
}

function cubeTypeInfo(material, shape) {
  const key = `${material}_${shape}`;
  const fromServer = catalog[key];
  if (fromServer) return { cost: fromServer.cost, max_hp: fromServer.max_hp };
  const fb = FALLBACK_PRICES[key];
  if (fb) return { cost: fb.cost, max_hp: fb.hp };
  return { cost: 10, max_hp: 100 };
}

async function loadCatalog() {
  try {
    const data = await api('/api/v1/build/catalog');
    catalog = {};
    for (const c of (data.cubes || [])) {
      catalog[c.type] = { cost: c.cost, max_hp: c.max_hp };
    }
  } catch (e) {
    // Тихо падаем на FALLBACK_PRICES: игра не должна блокироваться из-за каталога
  }
}

function svgIsometric(shape, palette) {
  const { light, mid, dark } = palette;
  if (shape === 'half') {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 30 L92 52 L50 74 L8 52 Z" fill="${light}"/>
      <path d="M8 52 L50 74 L50 94 L8 72 Z" fill="${dark}"/>
      <path d="M92 52 L50 74 L50 94 L92 72 Z" fill="${mid}"/>
    </svg>`;
  }
  if (shape === 'triangle') {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 10 L88 82 L12 82 Z" fill="${light}"/>
      <path d="M50 10 L88 82 L88 92 L50 20 Z" fill="${mid}"/>
      <path d="M12 82 L50 10 L50 20 L12 92 Z" fill="${dark}"/>
    </svg>`;
  }
  if (shape === 'circle') {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M 14 26 L 14 74 C 14 81.7 30.1 88 50 88 C 69.9 88 86 81.7 86 74 L 86 26 Z" fill="${mid}"/>
      <ellipse cx="50" cy="74" rx="36" ry="14" fill="${dark}"/>
      <ellipse cx="50" cy="26" rx="36" ry="14" fill="${light}"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M50 8 L92 30 L50 52 L8 30 Z" fill="${light}"/>
    <path d="M8 30 L50 52 L50 94 L8 72 Z" fill="${dark}"/>
    <path d="M92 30 L50 52 L50 94 L92 72 Z" fill="${mid}"/>
  </svg>`;
}

  if (!isl.can_raid) {
    const badge = document.createElement('div'); badge.className = 'island-badge'; badge.textContent = blockLabel(isl);
    row.appendChild(badge);
  }
  row.addEventListener('click', () => visitIsland(isl.user_id, isl.username));
  return row;
}
async function openWorld() {
  closeAllPalettes(); showScreen('world-screen');
  const list = $('world-list'); list.innerHTML = '';
  const note = document.createElement('div'); note.className = 'screen-note'; note.textContent = t('loading');
  list.appendChild(note);
  try {
    const data = await api('/api/v1/islands?limit=50');
    list.innerHTML = '';
    if (!data.islands.length) {
      const empty = document.createElement('div'); empty.className = 'screen-note'; empty.textContent = t('noone');
      list.appendChild(empty); return;
    }
    for (const isl of data.islands) list.appendChild(makeIslandRow(isl));
  } catch (e) {
    list.innerHTML = '';
    const err = document.createElement('div'); err.className = 'screen-note'; err.textContent = t('error') + ': ' + e.message;
    list.appendChild(err);
  }
}
async function visitIsland(userId, username) {
  hideScreens(); fail(t('islandLoading') + ' ' + username + '...');
  try {
    const detail = await api(`/api/v1/islands/${userId}`);
    targetUser = { user_id:userId, username };
    resetCubes(); detail.cubes.forEach(addCube); refreshCounters();
    setFlagVisual(detail.flag.hp, detail.flag.max_hp, detail.flag.color);
    placeMinionInitial();
    $('target-name').textContent = username;
    setMode('visit'); ok();
  } catch (e) { ok(); toast(e.message, 'error'); }
}

// ---------- РЕЙД ----------
function pickCharge(cube) {
  const hp = Math.max(0, cube.hp | 0);
  const bal = econ.ether_balance | 0;
  let want = 1;
  if (hp > 25) want = 2;
  if (hp > 75) want = 3;
  while (want > 1 && bal < CHARGE_COST[want]) want--;
  return want;
}

async function startRaid() {
  if (!targetUser) return;
  fail(t('raidStart'));
  try {
    const res = await api(`/api/v1/raids/${targetUser.user_id}/start`, { method:'POST' });
    raidId = res.raid_id;
    flagWasOpen = false;
    applyFlagState(res.flag_state);
    $('ether').textContent = res.ether_balance; econ.ether_balance = res.ether_balance;
    const detail = await api(`/api/v1/islands/${targetUser.user_id}`);
    resetCubes(); detail.cubes.forEach(addCube); refreshCounters();
    setFlagVisual(detail.flag.hp, detail.flag.max_hp, detail.flag.color);
    placeMinionInitial();
    setMode('raid'); updateFlagButton(); ok(); toast(t('raidStartOk'), 'tip');
  } catch (e) { ok(); toast(e.message, 'error'); }
}
function raidGone(e) {
  if (e.code === 'RAID_NOT_FOUND' || e.code === 'RAID_ALREADY_FINISHED') {
    toast(t('raidFinished'), 'warn'); raidId = null; setTimeout(returnHome, 1200); return true;
  }
  return false;
}
async function attackCube(cube) {
  if (!raidId || attacking) return;
  const charge = pickCharge(cube);
  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-cube`, {
      method:'POST', headers:{ 'Idempotency-Key': uid() },
      body: JSON.stringify({ cube_id: cube.id, charge }),
    });
    $('ether').textContent = res.ether_balance; econ.ether_balance = res.ether_balance;
    if (res.cube.destroyed) {
      removeCube(res.cube.id);
      minion.panicBoost = 3;
      minion.path = [];
    } else updateCubeHp(res.cube.id, res.cube.hp);
    for (const c of res.collapsed) removeCube(c.id);
    refreshCounters();
    if (res.flag_state) applyFlagState(res.flag_state);
  } catch (e) { if (!raidGone(e)) toast(e.message, 'error'); }
  finally { attacking = false; }
}
async function attackFlag() {
  if (!raidId || attacking) return;

  if (raidFlagState && !raidFlagState.can_attack) {
    toast(flagLockedMessage(raidFlagState), 'error');
    return;
  }

  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-flag`, {
      method:'POST', headers:{ 'Idempotency-Key': uid() },
    });
    $('ether').textContent = res.ether_balance; econ.ether_balance = res.ether_balance;
    setFlagVisual(res.flag_hp, res.flag_max_hp);
    if (res.flag_state) applyFlagState(res.flag_state);
    if (res.flag_destroyed && res.loot) {
      raidId = null;
      $('loot-stolen').textContent = res.loot.stolen_ether;
      $('loot-balance').textContent = res.loot.attacker_balance;
      showScreen('loot-screen');
    } else toast('−' + res.damage + ' ' + t('dmgyou'), 'tip');
  } catch (e) {
    if (!raidGone(e)) {
      if (e.code === 'FLAG_PROTECTED' && e.details) applyFlagState(e.details);
      toast(e.code === 'FLAG_PROTECTED' ? flagLockedMessage(e.details) : e.message, 'error');
    }
  }
  finally { attacking = false; }
}
async function leaveRaid() {
  if (raidId) { try { await api(`/api/v1/raids/${raidId}/finish`, { method:'POST' }); } catch (e) {} }
  await returnHome();
}

// ---------- ТАПЫ ----------
let pointerStart = null;
const TAP_MAX_MOVE = 8, TAP_MAX_TIME = 400;
renderer.domElement.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  pointerStart = { x:ev.clientX, y:ev.clientY, t:performance.now(), id:ev.pointerId };
});
renderer.domElement.addEventListener('pointercancel', () => { pointerStart = null; });
renderer.domElement.addEventListener('pointerup', async (ev) => {
  if (!pointerStart || ev.pointerId !== pointerStart.id) return;
  const moved = Math.hypot(ev.clientX - pointerStart.x, ev.clientY - pointerStart.y);
  const elapsed = performance.now() - pointerStart.t;
  pointerStart = null;
  if (moved > TAP_MAX_MOVE || elapsed > TAP_MAX_TIME) return;
  if (loading) return;
  if (camAnim.active) return;
  if (!$('tip-screen').classList.contains('hidden')) return;

  const ndcX = (ev.clientX / innerWidth) * 2 - 1;
  const ndcY = -(ev.clientY / innerHeight) * 2 + 1;

  raycaster.setFromCamera({ x:ndcX, y:ndcY }, camera);
  const minionHits = raycaster.intersectObjects(minionHitMeshes, false);
  if (minionHits.length) {
    if (minion.mood === 'panic') { toast(t('minionPanic'), 'warn'); return; }
    openTip();
    return;
  }

  if (mode === 'own' && demolishMode) return handleDemolishTap(ndcX, ndcY);
  if (mode === 'own' && buildMode) return handleBuildTap();
  if (mode === 'raid') return handleRaidTap(ndcX, ndcY);
});

async function handleBuildTap() {
  const p = computePlacement(aimPoint.x, aimPoint.y);
  if (!p) return;
  if (!p.valid) { toast(p.reason, 'error'); return; }
  try {
    const res = await api('/api/v1/build/cube', {
      method:'POST',
      body: JSON.stringify({
        x:p.x, y:p.y, z:p.z,
        size_x:p.sx, size_y:p.sy, size_z:p.sz,
        material: selectedMaterial,
        shape: selectedShape,
        color: selectedBlockColor,
      }),
    });
    addCube(res.cube);
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    $('cubes').textContent = res.island_cube_count;
  } catch (e) { toast(e.message, 'error'); }
}
async function handleDemolishTap(ndcX, ndcY) {
  raycaster.setFromCamera({ x:ndcX, y:ndcY }, camera);
  const hits = raycaster.intersectObjects([...cubeMeshes.values()], false);
  if (!hits.length) return;
  const cube = hits[0].object.userData.cube;
  try {
    const res = await api(`/api/v1/build/cube/${cube.id}`, { method:'DELETE' });
    for (const c of res.removed) removeCube(c.id);
    refreshCounters();
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    toast('+' + res.ether_refunded + ' ' + t('refund'), 'tip');
  } catch (e) { toast(e.message, 'error'); }
}
async function handleRaidTap(ndcX, ndcY) {
  raycaster.setFromCamera({ x:ndcX, y:ndcY }, camera);
  const targets = [...cubeMeshes.values(), ...flagGroup.children];
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return;
  const obj = hits[0].object;
  if (flagGroup.children.includes(obj)) { await attackFlag(); return; }
  await attackCube(obj.userData.cube);
}

// ---------- КНОПКИ ----------
$('claim-btn').addEventListener('click', claimEther);
$('reload').addEventListener('click', () => loadOwnIsland().catch(e => toast(e.message, 'error')));
$('btn-build').addEventListener('click', () => setBuildMode(!buildMode));
$('btn-demolish').addEventListener('click', () => setDemolish(!demolishMode));
$('btn-size').addEventListener('click', () => togglePalette('size-palette'));
$('btn-rotate').addEventListener('click', () => {
  if (!canRotate()) return;
  rotated = !rotated;
  if (rotated) vertical = false;
  updateGhostGeometry();
  updateRotateButton();
});
$('btn-vertical').addEventListener('click', () => {
  if (!canVertical()) return;
  vertical = !vertical;
  if (vertical) rotated = false;
  updateGhostGeometry();
  updateRotateButton();
});
$('btn-block-color').addEventListener('click', () => togglePalette('block-palette'));
$('btn-palette').addEventListener('click', () => togglePalette('palette'));
$('btn-shop').addEventListener('click', openShop);
$('shop-close').addEventListener('click', hideScreens);
$('shop-confirm').addEventListener('click', hideScreens);
$('btn-world').addEventListener('click', openWorld);
$('world-close').addEventListener('click', hideScreens);
$('btn-back').addEventListener('click', returnHome);
$('btn-raid').addEventListener('click', startRaid);
$('btn-flag').addEventListener('click', attackFlag);
$('btn-leave').addEventListener('click', leaveRaid);
$('loot-ok').addEventListener('click', returnHome);
$('tip-ok').addEventListener('click', closeTip);
$('onboard-ok').addEventListener('click', () => {
  localStorage.setItem('adrift_onboarded', '1');
  closeOnboard();
});

// ---------- ЦИКЛ ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastFrame = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  const nowSec = now / 1000;

  if (updateCameraAnim(dt)) {
    camera.lookAt(controls.target);
  } else {
    controls.update();
  }
  flagGroup.rotation.y += 0.005;

  if (minion.thinking && nowSec >= minion.thinkUntil) finishThinking();

  updateMinion(dt);
  updateBubbles(nowSec, dt);
  updateGhost();

  renderer.render(scene, camera);
}
animate();

// ---------- СТАРТ ----------
(async () => {
  try {
    applyI18n();
    updateSizeLabel();
    updateGhostGeometry();
    updateRotateButton();
    updateBlockSwatch();
    await auth();
    fail(t('loading'));
    await loadCatalog();
    await loadMe();
    await loadOwnIsland();
    await loadEconomy();
    setMode('own');
    buildMode = true;
    updatePanel();
    ok();
    pollRaidAlert();
    if (!localStorage.getItem('adrift_onboarded')) showScreen('onboard-screen');
  } catch (e) { fail(t('error') + ': ' + e.message); }
})();
</script>
