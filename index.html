<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ADRIFT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1020; font-family:system-ui,-apple-system,sans-serif; color:#fff; }
  #app { position:fixed; inset:0; }
  .bar { position:fixed; left:0; right:0; padding:10px 14px; display:flex; gap:12px; align-items:center; z-index:10; pointer-events:none; }
  .bar * { pointer-events:auto; }
  #top { top:0; background:linear-gradient(180deg,rgba(11,16,32,.95),rgba(11,16,32,0)); }
  #bottom { bottom:0; background:linear-gradient(0deg,rgba(11,16,32,.95),rgba(11,16,32,0)); justify-content:center; flex-wrap:wrap; }
  .pill { background:rgba(255,255,255,.1); padding:6px 12px; border-radius:20px; font-size:14px; font-variant-numeric:tabular-nums; color:#fff; border:none; font-family:inherit; }
  .pill b { color:#7dd3fc; }
  .pill-btn { display:flex; gap:8px; align-items:center; cursor:pointer; transition:background .15s; }
  .pill-btn:active { background:rgba(255,255,255,.25); }
  .pill-btn.ready { background:#16a34a; }
  .pill-btn.ready b { color:#fff; }
  .pill-btn.ready:active { background:#15803d; }
  #claim-hint { font-size:12px; opacity:.75; }
  .pill-btn.ready #claim-hint { opacity:1; font-weight:600; }
  button { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff; padding:10px 14px; border-radius:10px; font-size:14px; cursor:pointer; }
  button:active { background:rgba(255,255,255,.25); }
  button.on { background:#2563eb; border-color:#3b82f6; }
  #hint { position:fixed; left:0; right:0; bottom:70px; text-align:center; font-size:12px; color:rgba(255,255,255,.5); pointer-events:none; z-index:9; }
  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:#0b1020; z-index:100; font-size:16px; line-height:1.5; }
  #status.hidden { display:none; }
  #err { color:#fca5a5; font-size:13px; }
</style>
</head>
<body>
<div id="app"></div>

<div class="bar" id="top">
  <button class="pill pill-btn" id="claim-btn" title="Забрать накопленный Эфир">
    ⚡ <b id="ether">—</b>
    <span id="claim-hint">…</span>
  </button>
  <div class="pill">🧱 <b id="cubes">—</b></div>
  <div class="pill">🚩 <b id="flag">—</b></div>
</div>

<div id="hint">Тап по клетке — поставить куб · Свайп — повернуть камеру</div>

<div class="bar" id="bottom">
  <button data-type="floor">Пол · 10</button>
  <button data-type="wall" class="on">Стена · 25</button>
  <button data-type="tower">Башня · 80</button>
  <button id="reload">↻</button>
</div>

<div id="status">Загрузка...<br><span id="err"></span></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============ НАСТРОЙКИ ============
const SUPABASE_URL = 'https://suaitzmqulcziefyryvf.supabase.co';
const SUPABASE_ANON_KEY = 'ВСТАВЬ_СЮДА_PUBLISHABLE_KEY';
const API_URL = 'https://ВСТАВЬ_СЮДА.onrender.com';
// ===================================

const $ = (id) => document.getElementById(id);
const statusEl = $('status'), errEl = $('err');
const fail = (msg) => { statusEl.classList.remove('hidden'); statusEl.firstChild.textContent = msg; };
const ok = () => statusEl.classList.add('hidden');

let token = null, myId = null;
let selectedType = 'wall';

// ---------- АВТОРИЗАЦИЯ ----------
async function signIn() {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: '{}',
  });
  if (!res.ok) throw new Error('Авторизация: ' + res.status + ' ' + (await res.text()));
  const data = await res.json();
  token = data.access_token;
  myId = data.user.id;
  localStorage.setItem('adrift_token', token);
  localStorage.setItem('adrift_id', myId);
}

function clearSession() {
  token = null;
  myId = null;
  localStorage.removeItem('adrift_token');
  localStorage.removeItem('adrift_id');
}

async function api(path, options = {}) {
  const res = await fetch(API_URL + path, {
    ...options,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const err = new Error(body?.error?.message || res.statusText);
    err.code = body?.error?.code || ('HTTP_' + res.status);
    throw err;
  }
  return body;
}

const AUTH_ERRORS = ['TOKEN_EXPIRED', 'TOKEN_INVALID', 'TOKEN_MISSING', 'UNAUTHORIZED'];

async function auth() {
  const saved = localStorage.getItem('adrift_token');
  const savedId = localStorage.getItem('adrift_id');

  // Токен живёт час. Если сохранённый протух — молча логинимся заново,
  // игрок не должен видеть «сессия истекла» и чистить браузер руками.
  if (saved && savedId) {
    token = saved;
    myId = savedId;
    try {
      await api('/api/v1/build/catalog');
      return;
    } catch (e) {
      if (!AUTH_ERRORS.includes(e.code)) throw e;
      clearSession();
    }
  }

  fail('Вход в игру...');
  await signIn();
}

// ---------- 3D СЦЕНА ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 60, 140);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(28, 32, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
$('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.2;
controls.minDistance = 10;
controls.maxDistance = 90;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(30, 50, 20);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.BoxGeometry(66, 1, 66),
  new THREE.MeshLambertMaterial({ color: 0x1e3a2f })
);
ground.position.y = -0.5;
scene.add(ground);

const grid = new THREE.GridHelper(64, 64, 0x3b82f6, 0x1e293b);
grid.position.y = 0.01;
scene.add(grid);

const flagGroup = new THREE.Group();
const pole = new THREE.Mesh(
  new THREE.CylinderGeometry(0.15, 0.15, 4, 8),
  new THREE.MeshLambertMaterial({ color: 0x94a3b8 })
);
pole.position.y = 2;
const banner = new THREE.Mesh(
  new THREE.BoxGeometry(1.6, 1, 0.1),
  new THREE.MeshLambertMaterial({ color: 0xef4444 })
);
banner.position.set(0.8, 3.3, 0);
flagGroup.add(pole, banner);
scene.add(flagGroup);

const cubeMeshes = new Map();
const CUBE_COLORS = { floor: 0x6b7280, wall: 0xa8a29e, tower: 0x78716c };

function addCube(c) {
  if (cubeMeshes.has(c.id)) return;
  const mat = new THREE.MeshLambertMaterial({
    color: CUBE_COLORS[c.cube_type] || 0x999999,
    emissive: c.is_safe_zone ? 0x1e3a8a : 0x000000,
  });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
  mesh.position.set(c.x, c.y + 0.5, c.z);
  mesh.userData.cube = c;
  scene.add(mesh);
  cubeMeshes.set(c.id, mesh);
}

function resetCubes() {
  for (const m of cubeMeshes.values()) scene.remove(m);
  cubeMeshes.clear();
}

// ---------- ВСПЛЫВАЮЩАЯ ПОДСКАЗКА ----------
let flashTimer = null;
function flash(msg) {
  errEl.textContent = msg;
  statusEl.firstChild.textContent = '';
  statusEl.classList.remove('hidden');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(ok, 1400);
}

// ---------- ЗАГРУЗКА ОСТРОВА ----------
async function loadIsland() {
  const data = await api(`/api/v1/islands/${myId}`);
  resetCubes();
  data.cubes.forEach(addCube);
  $('cubes').textContent = data.island.cube_count;
  $('flag').textContent = data.flag.hp + ' / ' + data.flag.max_hp;
  return data;
}

async function loadMe() {
  const me = await api('/api/v1/me');
  $('ether').textContent = me.ether_balance;
  return me;
}

// ---------- ЭКОНОМИКА: пассивный Эфир ----------
let econ = { accrued_now: 0, seconds_to_next: 0, ether_balance: 0 };

function renderEconomy() {
  const btn = $('claim-btn');
  const hint = $('claim-hint');

  if (econ.accrued_now >= 1) {
    btn.classList.add('ready');
    hint.textContent = '+' + econ.accrued_now;
  } else {
    btn.classList.remove('ready');
    const s = Math.max(0, econ.seconds_to_next);
    const m = Math.floor(s / 60);
    const sec = s % 60;
    hint.textContent = m + ':' + String(sec).padStart(2, '0');
  }
}

async function loadEconomy() {
  try {
    econ = await api('/api/v1/economy/rates');
    $('ether').textContent = econ.ether_balance;
    renderEconomy();
  } catch (e) {
    // Экономика не критична для отрисовки острова — молча ждём следующего тика
  }
}

async function claimEther() {
  if (econ.accrued_now < 1) return;   // не дёргаем сервер зря, пока нечего брать
  try {
    const res = await api('/api/v1/economy/claim', { method: 'POST' });
    $('ether').textContent = res.ether_balance;
    flash('+' + res.claimed + ' Эфира');
    await loadEconomy();
  } catch (e) {
    if (e.code === 'CLAIM_TOO_EARLY') { await loadEconomy(); return; }
    flash(e.message);
  }
}

// Локальный тик: секунды убывают без обращения к серверу, иначе на каждый
// кадр таймера улетал бы HTTP-запрос. Полный перезапрос — раз в 30 секунд.
setInterval(() => {
  if (econ.accrued_now >= 1) return;
  if (econ.seconds_to_next > 0) {
    econ.seconds_to_next -= 1;
    renderEconomy();
  } else {
    loadEconomy();
  }
}, 1000);

setInterval(loadEconomy, 30000);

// ---------- ПОСТРОЙКА ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hit = new THREE.Vector3();

// Тап отличается от свайпа: запоминаем точку касания на pointerdown и
// строим только на pointerup, если палец почти не сдвинулся. Без этого
// вращение камеры ставило кубы под пальцем — вся карта в мусоре.
let pointerStart = null;
const TAP_MAX_MOVE = 8;
const TAP_MAX_TIME = 400;

renderer.domElement.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  pointerStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), id: ev.pointerId };
});

renderer.domElement.addEventListener('pointercancel', () => { pointerStart = null; });

renderer.domElement.addEventListener('pointerup', async (ev) => {
  if (!pointerStart || ev.pointerId !== pointerStart.id) return;

  const moved = Math.hypot(ev.clientX - pointerStart.x, ev.clientY - pointerStart.y);
  const elapsed = performance.now() - pointerStart.t;
  pointerStart = null;

  // Это был свайп камеры, а не тап по клетке — молча выходим
  if (moved > TAP_MAX_MOVE || elapsed > TAP_MAX_TIME) return;

  pointer.x = (ev.clientX / innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  if (!raycaster.ray.intersectPlane(plane, hit)) return;

  const x = Math.round(hit.x), z = Math.round(hit.z);
  if (Math.abs(x) > 32 || Math.abs(z) > 32) return;
  if (x === 0 && z === 0) { flash('Клетка Флага зарезервирована'); return; }

  try {
    const res = await api('/api/v1/build/cube', {
      method: 'POST',
      body: JSON.stringify({ x, y: 0, z, cube_type: selectedType }),
    });
    addCube(res.cube);
    $('ether').textContent = res.ether_balance;
    $('cubes').textContent = res.island_cube_count;
    econ.ether_balance = res.ether_balance;
  } catch (e) {
    flash(e.message);
  }
});

document.querySelectorAll('#bottom button[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#bottom button[data-type]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    selectedType = btn.dataset.type;
  });
});

$('claim-btn').addEventListener('click', claimEther);
$('reload').addEventListener('click', () => loadIsland().catch(e => flash(e.message)));

// ---------- ЦИКЛ ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  flagGroup.rotation.y += 0.005;
  renderer.render(scene, camera);
}
animate();

// ---------- СТАРТ ----------
(async () => {
  try {
    await auth();
    fail('Загрузка острова...');
    await loadIsland();
    await loadMe();
    await loadEconomy();
    ok();
  } catch (e) {
    fail('Ошибка: ' + e.message);
  }
})();
</script>
</body>
</html>
