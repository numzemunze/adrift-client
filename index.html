<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ADRIFT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1020; font-family:system-ui,-apple-system,sans-serif; color:#fff; }
  #app { position:fixed; inset:0; }
  .bar { position:fixed; left:0; right:0; padding:10px 14px; display:flex; gap:8px; align-items:center; z-index:10; pointer-events:none; flex-wrap:wrap; }
  .bar * { pointer-events:auto; }
  #top { top:0; background:linear-gradient(180deg,rgba(11,16,32,.95),rgba(11,16,32,0)); }
  #bottom-own, #bottom-visit, #bottom-raid { bottom:0; background:linear-gradient(0deg,rgba(11,16,32,.95),rgba(11,16,32,0)); justify-content:center; }
  .pill { background:rgba(255,255,255,.1); padding:6px 12px; border-radius:20px; font-size:14px; font-variant-numeric:tabular-nums; color:#fff; border:none; font-family:inherit; }
  .pill b { color:#7dd3fc; }
  .pill-btn { display:flex; gap:8px; align-items:center; cursor:pointer; transition:background .15s; }
  .pill-btn:active { background:rgba(255,255,255,.25); }
  .pill-btn.ready { background:#16a34a; }
  .pill-btn.ready b { color:#fff; }
  #claim-hint { font-size:12px; opacity:.75; }
  #target-pill b { color:#fca5a5; }
  button { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff; padding:10px 14px; border-radius:10px; font-size:14px; cursor:pointer; font-family:inherit; }
  button:active { background:rgba(255,255,255,.25); }
  button.on { background:#2563eb; border-color:#3b82f6; }
  button.locked { opacity:.5; }
  button.danger { background:#b91c1c; border-color:#ef4444; }
  button.go { background:#15803d; border-color:#22c55e; }
  #hint { position:fixed; left:0; right:0; bottom:66px; text-align:center; font-size:12px; color:rgba(255,255,255,.5); pointer-events:none; z-index:9; padding:0 12px; }
  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:#0b1020; z-index:100; font-size:16px; line-height:1.5; }
  #status.hidden { display:none; }
  #err { color:#fca5a5; font-size:13px; }

  .screen { position:fixed; inset:0; background:#0b1020; z-index:50; display:flex; flex-direction:column; padding:14px; overflow-y:auto; }
  .screen-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .screen-title { font-size:20px; font-weight:700; }
  .island-row { display:flex; flex-direction:column; gap:4px; width:100%; text-align:left; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .island-row:active { background:rgba(255,255,255,.16); }
  .island-row.locked { opacity:.55; }
  .island-name { font-size:16px; font-weight:600; }
  .island-meta { font-size:13px; color:rgba(255,255,255,.7); }
  .island-badge { font-size:12px; color:#fca5a5; }
  .screen-note { text-align:center; color:rgba(255,255,255,.5); padding:32px 16px; }

  #loot-screen { align-items:center; justify-content:center; }
  .loot-card { background:#111a33; border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:28px 24px; text-align:center; max-width:340px; width:100%; }
  .loot-emoji { font-size:48px; margin-bottom:8px; }
  .loot-title { font-size:20px; font-weight:700; margin-bottom:16px; }
  .loot-row { font-size:15px; color:rgba(255,255,255,.8); margin-bottom:8px; }
  .loot-row b { color:#7dd3fc; font-size:18px; }
  .loot-card button { width:100%; margin-top:16px; }

  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app"></div>

<div class="bar" id="top">
  <button class="pill pill-btn" id="claim-btn" title="Забрать накопленный Эфир">
    ⚡ <b id="ether">—</b>
    <span id="claim-hint">…</span>
  </button>
  <div class="pill">🧱 <b id="cubes">—</b></div>
  <div class="pill">🚩 <b id="flag">—</b></div>
  <div class="pill hidden" id="target-pill">👁 <b id="target-name">—</b></div>
</div>

<div id="hint">Загрузка…</div>

<div class="bar" id="bottom-own">
  <button data-type="floor">Пол · 10</button>
  <button data-type="wall" class="on">Стена · 25</button>
  <button data-type="tower">Башня · 80</button>
  <button id="btn-world">🌍 Мир</button>
  <button id="reload">↻</button>
</div>

<div class="bar" id="bottom-visit">
  <button id="btn-back">↩ Назад</button>
  <button id="btn-raid" class="danger">⚔️ Рейд</button>
</div>

<div class="bar" id="bottom-raid">
  <button class="charge" data-charge="1">1 · 10⚡</button>
  <button class="charge on" data-charge="2">2 · 25⚡</button>
  <button class="charge" data-charge="3">3 · 60⚡</button>
  <button id="btn-flag" class="danger">⚔️ Флаг</button>
  <button id="btn-leave">🏳 Выйти</button>
</div>

<div class="screen hidden" id="world-screen">
  <div class="screen-head">
    <div class="screen-title">🌍 Мир</div>
    <button id="world-close">✕</button>
  </div>
  <div id="world-list"></div>
</div>

<div class="screen hidden" id="loot-screen">
  <div class="loot-card">
    <div class="loot-emoji">🏆</div>
    <div class="loot-title">Флаг разрушен!</div>
    <div class="loot-row">Украдено Эфира: <b id="loot-stolen">0</b></div>
    <div class="loot-row">Твой баланс: <b id="loot-balance">0</b></div>
    <button id="loot-ok" class="go">Вернуться на свой остров</button>
  </div>
</div>

<div id="status">Загрузка...<br><span id="err"></span></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============ НАСТРОЙКИ ============
const SUPABASE_URL = 'https://suaitzmqulcziefyryvf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_pT2H1bpnu_fcBbevfvfOoQ_AhzZLQjH';
const API_URL = 'https://adrift-backend-ys3i.onrender.com';
// ===================================

// Уровни заряда. Должны совпадать с CHARGE_LEVELS в raids.py — сервер считает
// урон сам, это лишь подсказка для интерфейса.
const CHARGE = { 1: { cost: 10, damage: 25 }, 2: { cost: 25, damage: 75 }, 3: { cost: 60, damage: 200 } };

const $ = (id) => document.getElementById(id);
const statusEl = $('status'), errEl = $('err');
const fail = (msg) => { statusEl.classList.remove('hidden'); statusEl.firstChild.textContent = msg; };
const ok = () => statusEl.classList.add('hidden');

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

const fmtTime = (s) => {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return h + 'ч ' + m + 'м';
  if (m > 0) return m + ':' + String(sec).padStart(2, '0');
  return '0:' + String(sec).padStart(2, '0');
};

// ---------- СОСТОЯНИЕ ----------
let token = null, myId = null;
let mode = 'own';              // 'own' | 'visit' | 'raid'
let selectedType = 'wall';
let selectedCharge = 2;
let raidId = null;
let targetUser = null;         // { user_id, username }
let targetFlag = null;         // { hp, max_hp } чужого Флага
let attacking = false;
let econ = { accrued_now: 0, seconds_to_next: 0, ether_balance: 0 };

// ---------- АВТОРИЗАЦИЯ ----------
async function signIn() {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: '{}',
  });
  if (!res.ok) throw new Error('Авторизация: ' + res.status + ' ' + (await res.text()));
  const data = await res.json();
  token = data.access_token;
  myId = data.user.id;
  localStorage.setItem('adrift_token', token);
  localStorage.setItem('adrift_id', myId);
}

function clearSession() {
  token = null; myId = null;
  localStorage.removeItem('adrift_token');
  localStorage.removeItem('adrift_id');
}

async function api(path, options = {}) {
  const res = await fetch(API_URL + path, {
    ...options,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const err = new Error(body?.error?.message || res.statusText);
    err.code = body?.error?.code || ('HTTP_' + res.status);
    err.details = body?.error?.details;
    throw err;
  }
  return body;
}

const AUTH_ERRORS = ['TOKEN_EXPIRED', 'TOKEN_INVALID', 'TOKEN_MISSING', 'UNAUTHORIZED'];

async function auth() {
  const saved = localStorage.getItem('adrift_token');
  const savedId = localStorage.getItem('adrift_id');
  if (saved && savedId) {
    token = saved; myId = savedId;
    try { await api('/api/v1/build/catalog'); return; }
    catch (e) { if (!AUTH_ERRORS.includes(e.code)) throw e; clearSession(); }
  }
  fail('Вход в игру...');
  await signIn();
}

// ---------- 3D СЦЕНА ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 60, 140);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(28, 32, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
$('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.2;
controls.minDistance = 10;
controls.maxDistance = 90;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(30, 50, 20);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.BoxGeometry(66, 1, 66),
  new THREE.MeshLambertMaterial({ color: 0x1e3a2f })
);
ground.position.y = -0.5;
scene.add(ground);

const grid = new THREE.GridHelper(64, 64, 0x3b82f6, 0x1e293b);
grid.position.y = 0.01;
scene.add(grid);

const flagGroup = new THREE.Group();
const pole = new THREE.Mesh(
  new THREE.CylinderGeometry(0.15, 0.15, 4, 8),
  new THREE.MeshLambertMaterial({ color: 0x94a3b8 })
);
pole.position.y = 2;
const banner = new THREE.Mesh(
  new THREE.BoxGeometry(1.6, 1, 0.1),
  new THREE.MeshLambertMaterial({ color: 0xef4444 })
);
banner.position.set(0.8, 3.3, 0);
flagGroup.add(pole, banner);
scene.add(flagGroup);

// ---------- КУБЫ ----------
const cubeMeshes = new Map();
const CUBE_COLORS = { floor: 0x6b7280, wall: 0xa8a29e, tower: 0x78716c };

function addCube(c) {
  if (cubeMeshes.has(c.id)) return;
  const mat = new THREE.MeshLambertMaterial({
    color: CUBE_COLORS[c.cube_type] || 0x999999,
    emissive: c.is_safe_zone ? 0x1e3a8a : 0x000000,
  });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
  mesh.position.set(c.x, c.y + 0.5, c.z);
  mesh.userData.cube = { ...c };
  scene.add(mesh);
  cubeMeshes.set(c.id, mesh);
  paintCube(mesh);
}

// Цвет куба отражает остаток HP: целый — базовый, разбитый — тёмно-красный.
function paintCube(mesh) {
  const c = mesh.userData.cube;
  const ratio = c.max_hp > 0 ? Math.max(0, Math.min(1, c.hp / c.max_hp)) : 0;
  const base = new THREE.Color(CUBE_COLORS[c.cube_type] || 0x999999);
  const hurt = new THREE.Color(0x7f1d1d);
  mesh.material.color.copy(base).lerp(hurt, 1 - ratio);
}

function updateCubeHp(id, hp) {
  const mesh = cubeMeshes.get(id);
  if (!mesh) return;
  mesh.userData.cube.hp = hp;
  paintCube(mesh);
}

function removeCube(id) {
  const mesh = cubeMeshes.get(id);
  if (!mesh) return;
  scene.remove(mesh);
  mesh.geometry.dispose();
  mesh.material.dispose();
  cubeMeshes.delete(id);
}

function resetCubes() {
  for (const id of [...cubeMeshes.keys()]) removeCube(id);
}

function countSafeCubes() {
  let n = 0;
  for (const m of cubeMeshes.values()) if (m.userData.cube.is_safe_zone) n++;
  return n;
}

function refreshCounters() {
  $('cubes').textContent = cubeMeshes.size;
}

function setFlagVisual(hp, maxHp) {
  const ratio = maxHp > 0 ? Math.max(0, Math.min(1, hp / maxHp)) : 0;
  banner.material.color.copy(new THREE.Color(0xef4444)).lerp(new THREE.Color(0x16a34a), ratio);
  $('flag').textContent = Math.max(0, hp) + ' / ' + maxHp;
}

// ---------- РЕЖИМЫ ----------
const HINTS = {
  own: 'Тап по клетке — поставить куб · Свайп — повернуть камеру',
  visit: 'Чужой остров. Свайп — повернуть камеру',
  raid: 'Тап по кубу — удар · ⚔️ Флаг или тап по флагу — удар по Флагу',
};

function setMode(next) {
  mode = next;
  $('bottom-own').classList.toggle('hidden', mode !== 'own');
  $('bottom-visit').classList.toggle('hidden', mode !== 'visit');
  $('bottom-raid').classList.toggle('hidden', mode !== 'raid');
  $('target-pill').classList.toggle('hidden', mode === 'own');
  $('hint').textContent = HINTS[mode];
}

function showScreen(id) { $(id).classList.remove('hidden'); }
function hideScreens() {
  $('world-screen').classList.add('hidden');
  $('loot-screen').classList.add('hidden');
}

// ---------- ВСПЛЫВАЮЩАЯ ПОДСКАЗКА ----------
let flashTimer = null;
function flash(msg) {
  errEl.textContent = msg;
  statusEl.firstChild.textContent = '';
  statusEl.classList.remove('hidden');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(ok, 1600);
}

// ---------- СВОЙ ОСТРОВ ----------
async function loadOwnIsland() {
  const data = await api(`/api/v1/islands/${myId}`);
  resetCubes();
  data.cubes.forEach(addCube);
  refreshCounters();
  setFlagVisual(data.flag.hp, data.flag.max_hp);
}

async function loadMe() {
  const me = await api('/api/v1/me');
  $('ether').textContent = me.ether_balance;
  econ.ether_balance = me.ether_balance;
}

async function returnHome() {
  targetUser = null; targetFlag = null; raidId = null;
  hideScreens();
  setMode('own');
  $('target-name').textContent = '—';
  fail('Возвращаемся...');
  try {
    await loadOwnIsland();
    await loadMe();
    await loadEconomy();
  } finally { ok(); }
}

// ---------- ЭКОНОМИКА ----------
function renderEconomy() {
  const btn = $('claim-btn'), hint = $('claim-hint');
  if (econ.accrued_now >= 1) {
    btn.classList.add('ready');
    hint.textContent = '+' + econ.accrued_now;
  } else {
    btn.classList.remove('ready');
    hint.textContent = fmtTime(econ.seconds_to_next);
  }
}

async function loadEconomy() {
  try {
    econ = await api('/api/v1/economy/rates');
    $('ether').textContent = econ.ether_balance;
    renderEconomy();
  } catch (e) { /* не критично для отрисовки */ }
}

async function claimEther() {
  if (econ.accrued_now < 1) return;
  try {
    const res = await api('/api/v1/economy/claim', { method: 'POST' });
    $('ether').textContent = res.ether_balance;
    flash('+' + res.claimed + ' Эфира');
    await loadEconomy();
  } catch (e) {
    if (e.code === 'CLAIM_TOO_EARLY') { await loadEconomy(); return; }
    flash(e.message);
  }
}

setInterval(() => {
  if (econ.accrued_now >= 1) return;
  if (econ.seconds_to_next > 0) { econ.seconds_to_next -= 1; renderEconomy(); }
  else loadEconomy();
}, 1000);
setInterval(loadEconomy, 30000);

// ---------- МИР: СПИСОК ОСТРОВОВ ----------
function blockLabel(isl) {
  switch (isl.raid_block_reason) {
    case 'TARGET_SHIELDED': return '🛡 щит ' + fmtTime(isl.shield_seconds_left);
    case 'COOLDOWN_ACTIVE': return '⏳ кулдаун ' + fmtTime(isl.cooldown_seconds_left);
    case 'TARGET_IS_SELF': return 'это твой остров';
    default: return isl.raid_block_reason || '';
  }
}

function makeIslandRow(isl) {
  const row = document.createElement('button');
  row.className = 'island-row' + (isl.can_raid ? '' : ' locked');

  const name = document.createElement('div');
  name.className = 'island-name';
  name.textContent = isl.username;

  const meta = document.createElement('div');
  meta.className = 'island-meta';
  meta.textContent = `🧱 ${isl.cube_count} · ⚡ ${isl.potential_loot} · 🚩 ${isl.flag_hp}`;

  row.append(name, meta);

  if (!isl.can_raid) {
    const badge = document.createElement('div');
    badge.className = 'island-badge';
    badge.textContent = blockLabel(isl);
    row.appendChild(badge);
  }

  row.addEventListener('click', () => visitIsland(isl.user_id, isl.username));
  return row;
}

async function openWorld() {
  showScreen('world-screen');
  const list = $('world-list');
  list.innerHTML = '';
  const note = document.createElement('div');
  note.className = 'screen-note';
  note.textContent = 'Загрузка...';
  list.appendChild(note);

  try {
    const data = await api('/api/v1/islands?limit=50');
    list.innerHTML = '';
    if (!data.islands.length) {
      const empty = document.createElement('div');
      empty.className = 'screen-note';
      empty.textContent = 'Пока никого нет в твоём регионе';
      list.appendChild(empty);
      return;
    }
    for (const isl of data.islands) list.appendChild(makeIslandRow(isl));
  } catch (e) {
    list.innerHTML = '';
    const err = document.createElement('div');
    err.className = 'screen-note';
    err.textContent = 'Ошибка: ' + e.message;
    list.appendChild(err);
  }
}

// ---------- ВИЗИТ НА ЧУЖОЙ ОСТРОВ ----------
async function visitIsland(userId, username) {
  hideScreens();
  fail('Загрузка острова ' + username + '...');
  try {
    const detail = await api(`/api/v1/islands/${userId}`);
    targetUser = { user_id: userId, username };
    targetFlag = { hp: detail.flag.hp, max_hp: detail.flag.max_hp };

    resetCubes();
    detail.cubes.forEach(addCube);
    refreshCounters();
    setFlagVisual(detail.flag.hp, detail.flag.max_hp);
    $('target-name').textContent = username;

    setMode('visit');
    ok();
  } catch (e) {
    ok();
    flash(e.message);
  }
}

// ---------- РЕЙД ----------
async function startRaid() {
  if (!targetUser) return;
  fail('Начинаем рейд...');
  try {
    const res = await api(`/api/v1/raids/${targetUser.user_id}/start`, { method: 'POST' });
    raidId = res.raid_id;
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;

    // Перечитываем остров: с момента визита он мог измениться
    const detail = await api(`/api/v1/islands/${targetUser.user_id}`);
    resetCubes();
    detail.cubes.forEach(addCube);
    refreshCounters();
    targetFlag = { hp: detail.flag.hp, max_hp: detail.flag.max_hp };
    setFlagVisual(detail.flag.hp, detail.flag.max_hp);

    setMode('raid');
    updateFlagButton();
    ok();
    flash('Рейд начался!');
  } catch (e) {
    ok();
    flash(e.message);
  }
}

function updateFlagButton() {
  const btn = $('btn-flag');
  const safe = countSafeCubes();
  if (safe > 0) {
    btn.textContent = `🔒 ${safe}`;
    btn.classList.add('locked');
  } else {
    btn.textContent = '⚔️ Флаг';
    btn.classList.remove('locked');
  }
}

function raidGone(e) {
  if (e.code === 'RAID_NOT_FOUND' || e.code === 'RAID_ALREADY_FINISHED') {
    flash('Рейд завершён');
    raidId = null;
    setTimeout(returnHome, 1200);
    return true;
  }
  return false;
}

async function attackCube(cube) {
  if (!raidId) return;
  // Проверка safe zone убрана: сервер разрешает бить кубы в зоне, но у них
  // ×3 прочности. Клиент не должен запрещать то, что разрешено бэкендом.
  if (attacking) return;
  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-cube`, {
      method: 'POST',
      headers: { 'Idempotency-Key': uid() },
      body: JSON.stringify({ cube_id: cube.id, charge: selectedCharge }),
    });

    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;

    if (res.cube.destroyed) removeCube(res.cube.id);
    else updateCubeHp(res.cube.id, res.cube.hp);

    for (const c of res.collapsed) removeCube(c.id);

    refreshCounters();
    updateFlagButton();
  } catch (e) {
    if (!raidGone(e)) flash(e.message);
  } finally {
    attacking = false;
  }
}

async function attackFlag() {
  if (!raidId) return;
  const safe = countSafeCubes();
  if (safe > 0) { flash(`Флаг защищён: в зоне ещё ${safe} кубов`); return; }
  if (attacking) return;
  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-flag`, {
      method: 'POST',
      headers: { 'Idempotency-Key': uid() },
    });

    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    setFlagVisual(res.flag_hp, res.flag_max_hp);

    if (res.flag_destroyed && res.loot) {
      raidId = null;
      $('loot-stolen').textContent = res.loot.stolen_ether;
      $('loot-balance').textContent = res.loot.attacker_balance;
      showScreen('loot-screen');
    } else {
      flash('−' + res.damage + ' Флагу');
    }
  } catch (e) {
    if (!raidGone(e)) flash(e.message);
  } finally {
    attacking = false;
  }
}

async function leaveRaid() {
  if (raidId) {
    try { await api(`/api/v1/raids/${raidId}/finish`, { method: 'POST' }); }
    catch (e) { /* рейд мог истечь сам — не мешаем выйти */ }
  }
  await returnHome();
}

// ---------- ТАПЫ ПО ЭКРАНУ ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hit = new THREE.Vector3();

// Тап отличается от свайпа: запоминаем точку касания на pointerdown и
// действуем только на pointerup, если палец почти не сдвинулся. Без этого
// вращение камеры ставило кубы под пальцем — вся карта в мусоре.
let pointerStart = null;
const TAP_MAX_MOVE = 8;
const TAP_MAX_TIME = 400;

renderer.domElement.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  pointerStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), id: ev.pointerId };
});

renderer.domElement.addEventListener('pointercancel', () => { pointerStart = null; });

renderer.domElement.addEventListener('pointerup', async (ev) => {
  if (!pointerStart || ev.pointerId !== pointerStart.id) return;

  const moved = Math.hypot(ev.clientX - pointerStart.x, ev.clientY - pointerStart.y);
  const elapsed = performance.now() - pointerStart.t;
  pointerStart = null;

  if (moved > TAP_MAX_MOVE || elapsed > TAP_MAX_TIME) return;
  if (statusEl.classList.contains('hidden') === false) return;   // идёт загрузка/ошибка

  pointer.x = (ev.clientX / innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  if (mode === 'own') return handleOwnTap();
  if (mode === 'raid') return handleRaidTap();
});

async function handleOwnTap() {
  if (!raycaster.ray.intersectPlane(plane, hit)) return;
  const x = Math.round(hit.x), z = Math.round(hit.z);
  if (Math.abs(x) > 32 || Math.abs(z) > 32) return;
  if (x === 0 && z === 0) { flash('Клетка Флага зарезервирована'); return; }

  try {
    const res = await api('/api/v1/build/cube', {
      method: 'POST',
      body: JSON.stringify({ x, y: 0, z, cube_type: selectedType }),
    });
    addCube(res.cube);
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    $('cubes').textContent = res.island_cube_count;
  } catch (e) {
    flash(e.message);
  }
}

async function handleRaidTap() {
  // Пробуем попасть и по кубам, и по самому Флагу. Если ближайшая цель —
  // элемент флага, вызываем attackFlag(): тап по 3D-флагу должен работать
  // так же, как кнопка «⚔️ Флаг» внизу экрана.
  const targets = [...cubeMeshes.values(), ...flagGroup.children];
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return;

  const obj = hits[0].object;
  if (flagGroup.children.includes(obj)) { await attackFlag(); return; }
  await attackCube(obj.userData.cube);
}

});

  requestAnimationFrame(animate);
  controls.update();
  flagGroup.rotation.y += 0.005;
  renderer.render(scene, camera);
}
animate();
