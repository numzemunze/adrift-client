let lang = detectLang();

function detectLang() {
  const saved = localStorage.getItem('adrift_lang');
  if (saved === 'ru' || saved === 'en') return saved;
  const nav = (navigator.language || 'ru').toLowerCase();
  return nav.startsWith('ru') ? 'ru' : 'en';
}

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.ru[key] || key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace('{' + k + '}', v);
  return s;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
  document.documentElement.lang = lang;
}

function setLang(next) {
  lang = next;
  localStorage.setItem('adrift_lang', next);

}

  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;

// ---------- АВТОРИЗАЦИЯ ----------
async function signIn() {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: '{}',
  });
  if (!res.ok) throw new Error('Auth: ' + res.status + ' ' + (await res.text()));
  const data = await res.json();
  token = data.access_token;
  myId = data.user.id;
  localStorage.setItem('adrift_token', token);
  localStorage.setItem('adrift_id', myId);
}

function clearSession() {
  token = null; myId = null;
  localStorage.removeItem('adrift_token');
  localStorage.removeItem('adrift_id');
}

async function api(path, options = {}) {
  const res = await fetch(API_URL + path, {
    ...options,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const err = new Error(body?.error?.message || res.statusText);
    err.code = body?.error?.code || ('HTTP_' + res.status);
    err.details = body?.error?.details;
    throw err;
  }
  return body;
}

const AUTH_ERRORS = ['TOKEN_EXPIRED', 'TOKEN_INVALID', 'TOKEN_MISSING', 'UNAUTHORIZED'];

async function auth() {
  const saved = localStorage.getItem('adrift_token');
  const savedId = localStorage.getItem('adrift_id');
  if (saved && savedId) {
    token = saved; myId = savedId;
    try { await api('/api/v1/build/catalog'); return; }
    catch (e) { if (!AUTH_ERRORS.includes(e.code)) throw e; clearSession(); }
  }
  fail(t('login'));
  await signIn();
}

// ---------- ТЕКСТУРА ДЕРЕВА ----------
// Рисуем процедурно на canvas: ни одного внешнего файла, работает офлайн,
// и один и тот же паттерн даёт узнаваемое «дерево» на всех блоках.
function makeWoodTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  // База БЕЛАЯ. Тон задаёт material.color, а текстура только затемняет
  // отдельные волокна. Раньше база была коричневой, и она перемножалась
  // с выбранным цветом — красный блок получался грязно-бурым.
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);

  // Горизонтальные волокна: серый с низкой альфой. На любом цвете это даёт
  // тень нужной плотности, не меняя оттенок.
  for (let i = 0; i < 22; i++) {
    const y = Math.random() * size;
    ctx.strokeStyle = `rgba(0, 0, 0, ${0.04 + Math.random() * 0.06})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= size; x += 8) {
      ctx.lineTo(x, y + Math.sin(x / 14 + i) * 2.5);
    }
    ctx.stroke();
  }

  // Пара «сучков» — чуть плотнее волокон
  for (let i = 0; i < 2; i++) {
    const cx = Math.random() * size, cy = Math.random() * size;
    for (let r = 2; r < 8; r += 2) {
      ctx.strokeStyle = `rgba(0, 0, 0, ${0.08 - r * 0.008})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 1.6, r, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Рамку по краю НЕ рисуем. Текстура повторяется на каждой грани куба,
  // и рамка превращалась в «обводку» вокруг каждого блока.

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const WOOD_TEXTURE = makeWoodTexture();

// ---------- КУБЫ ----------
const cubeMeshes = new Map();

function makeCubeMaterial(color, inSafeZone) {
  const mat = new THREE.MeshLambertMaterial({
    map: WOOD_TEXTURE,
    color: new THREE.Color(BLOCK_COLORS_HEX[color] || BLOCK_COLORS_HEX.wood),
  });
  // Кубы в safe zone подсвечиваем ИХ ЖЕ цветом. Раньше был синий emissive —
  // он подмешивался к любому оттенку и красил красное в фиолетовое.
  if (inSafeZone) {
    mat.emissive.copy(mat.color).multiplyScalar(0.18);
  }
  return mat;
}

function addCube(c) {
  if (cubeMeshes.has(c.id)) return;
  const color = c.color || 'wood';
  const mat = makeCubeMaterial(color, !!c.is_safe_zone);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
  mesh.position.set(c.x, c.y + 0.5, c.z);
  // Нормализуем поле: paintCube() читает c.color и не должен гадать про undefined
  mesh.userData.cube = { ...c, color };
  scene.add(mesh);
  cubeMeshes.set(c.id, mesh);
  paintCube(mesh);
}

function paintCube(mesh) {
  const c = mesh.userData.cube;
  const ratio = c.max_hp > 0 ? Math.max(0, Math.min(1, c.hp / c.max_hp)) : 0;
  const base = new THREE.Color(BLOCK_COLORS_HEX[c.color] || BLOCK_COLORS_HEX.wood);
  const hurt = new THREE.Color(0x7f1d1d);
  mesh.material.color.copy(base).lerp(hurt, 1 - ratio);
}

function updateCubeHp(id, hp) {
  const mesh = cubeMeshes.get(id);
  if (!mesh) return;
  mesh.userData.cube.hp = hp;
  paintCube(mesh);
}

function removeCube(id) {
  const mesh = cubeMeshes.get(id);
  if (!mesh) return;
  scene.remove(mesh);
  mesh.geometry.dispose();
  mesh.material.dispose();
  cubeMeshes.delete(id);
}

function resetCubes() { for (const id of [...cubeMeshes.keys()]) removeCube(id); }

function countSafeCubes() {
  let n = 0;
  for (const m of cubeMeshes.values()) if (m.userData.cube.is_safe_zone) n++;
  return n;
}

function refreshCounters() { $('cubes').textContent = cubeMeshes.size; }

function setFlagVisual(hp, maxHp, color) {
  currentFlagHp = hp;
  currentFlagMax = maxHp;
  if (color) displayFlagColor = color;

  const ratio = maxHp > 0 ? Math.max(0, Math.min(1, hp / maxHp)) : 0;
  const base = new THREE.Color(FLAG_COLORS_HEX[displayFlagColor] || FLAG_COLORS_HEX.red);
  const damaged = new THREE.Color(0x7f1d1d);
  banner.material.color.copy(base).lerp(damaged, 1 - ratio);

  $('flag').textContent = Math.max(0, hp) + ' / ' + maxHp;
}

// ---------- РЕЖИМЫ ----------
function updateBottom() {
  ['bottom-idle','bottom-build','bottom-visit','bottom-raid']
    .forEach(id => $(id).classList.add('hidden'));

  if (mode === 'own') {
    $(buildMode ? 'bottom-build' : 'bottom-idle').classList.remove('hidden');
  } else if (mode === 'visit') {
    $('bottom-visit').classList.remove('hidden');
  } else if (mode === 'raid') {
    $('bottom-raid').classList.remove('hidden');
  }

  $('target-pill').classList.toggle('hidden', mode === 'own');
}

function setMode(next) {
  mode = next;
  if (next !== 'own') buildMode = false;
  updateBottom();
}

function setBuildMode(on) {
  buildMode = on;
  if (on) setDemolish(false);
  if (!on) { closePalette(); closeBlockPalette(); }
  updateBottom();
}

function setDemolish(on) {
  demolishMode = on;
  $('btn-demolish').classList.toggle('demolish-on', on);
}

function showScreen(id) { $(id).classList.remove('hidden'); }
function hideScreens() {
  ['world-screen','loot-screen','onboard-screen'].forEach(id => $(id).classList.add('hidden'));
  closePalette(); closeBlockPalette();
}

// ---------- СВОЙ ОСТРОВ ----------
async function loadOwnIsland() {
  const data = await api(`/api/v1/islands/${myId}`);
  resetCubes();
  data.cubes.forEach(addCube);
  refreshCounters();
  setFlagVisual(data.flag.hp, data.flag.max_hp, myFlagColor);
}

async function loadMe() {
  const me = await api('/api/v1/me');
  $('ether').textContent = me.ether_balance;
  econ.ether_balance = me.ether_balance;
  myFlagColor = me.flag_color || 'red';
  displayFlagColor = myFlagColor;
}

async function returnHome() {
  targetUser = null; raidId = null;
  hideScreens();
  setBuildMode(false);
  setMode('own');
  $('target-name').textContent = '—';
  fail(t('returning'));
  try {
    await loadOwnIsland();
    await loadMe();
    await loadEconomy();
  } finally { ok(); }
}

// ---------- ЭКОНОМИКА ----------
function renderEconomy() {
  const btn = $('claim-btn'), hint = $('claim-hint');
  if (econ.accrued_now >= 1) {
    btn.classList.add('ready');
    hint.textContent = '+' + econ.accrued_now;
  } else {
    btn.classList.remove('ready');
    hint.textContent = fmtTime(econ.seconds_to_next);
  }
}

async function loadEconomy() {
  try {
    econ = await api('/api/v1/economy/rates');
    $('ether').textContent = econ.ether_balance;
    renderEconomy();
  } catch (e) { /* не критично */ }
}

async function claimEther() {
  if (econ.accrued_now < 1) return;
  try {
    const res = await api('/api/v1/economy/claim', { method: 'POST' });
    $('ether').textContent = res.ether_balance;
    toast('+' + res.claimed + ' ' + t('ether'));
    await loadEconomy();
  } catch (e) {
    if (e.code === 'CLAIM_TOO_EARLY') { await loadEconomy(); return; }
    toast(e.message, true);
  }
}

setInterval(() => {
  if (econ.accrued_now >= 1) return;
  if (econ.seconds_to_next > 0) { econ.seconds_to_next -= 1; renderEconomy(); }
  else loadEconomy();
}, 1000);
setInterval(loadEconomy, 30000);

// ---------- ПАЛИТРА ЦВЕТА ФЛАГА ----------
function buildPalette() {
  const grid = $('palette-grid');
  grid.innerHTML = '';
  for (const [key, hex] of Object.entries(FLAG_COLORS_CSS)) {
    const dot = document.createElement('button');
    dot.className = 'color-dot' + (key === myFlagColor ? ' selected' : '');
    dot.style.background = hex;
    dot.addEventListener('click', () => pickColor(key));
    grid.appendChild(dot);
  }
}

function openPalette() { closeBlockPalette(); buildPalette(); $('palette').classList.remove('hidden'); }
function closePalette() { $('palette').classList.add('hidden'); }
function togglePalette() {
  $('palette').classList.contains('hidden') ? openPalette() : closePalette();
}

async function pickColor(key) {
  try {
    const res = await api('/api/v1/me/flag-color', {
      method: 'POST',
      body: JSON.stringify({ color: key }),
    });
    myFlagColor = res.flag_color;
    if (mode === 'own') setFlagVisual(currentFlagHp, currentFlagMax, myFlagColor);
    closePalette();
    toast(t('flagColorChanged'));
  } catch (e) {
    toast(e.message, true);
  }
}

// ---------- ПАЛИТРА ЦВЕТА БЛОКА ----------
function buildBlockPalette() {
  const grid = $('block-palette-grid');
  grid.innerHTML = '';
  for (const [key, hex] of Object.entries(BLOCK_COLORS_CSS)) {
    const dot = document.createElement('button');
    dot.className = 'color-dot' + (key === selectedBlockColor ? ' selected' : '');
    dot.style.background = hex;
    dot.addEventListener('click', () => {
      selectedBlockColor = key;
      closeBlockPalette();
      toast(t('blockColor') + ': ' + key);
    });
    grid.appendChild(dot);
  }
}

function openBlockPalette() { closePalette(); buildBlockPalette(); $('block-palette').classList.remove('hidden'); }
function closeBlockPalette() { $('block-palette').classList.add('hidden'); }

// ---------- МИР ----------
function blockLabel(isl) {
  switch (isl.raid_block_reason) {
    case 'TARGET_SHIELDED': return '🛡 ' + t('shield') + ' ' + fmtTime(isl.shield_seconds_left);
    case 'COOLDOWN_ACTIVE': return '⏳ ' + t('cooldown') + ' ' + fmtTime(isl.cooldown_seconds_left);
    case 'TARGET_IS_SELF': return t('yourIsland');
    default: return isl.raid_block_reason || '';
  }
}

function makeIslandRow(isl) {
  const row = document.createElement('button');
  row.className = 'island-row' + (isl.can_raid ? '' : ' locked');

  const name = document.createElement('div');
  name.className = 'island-name';
  name.textContent = isl.username;

  const meta = document.createElement('div');
  meta.className = 'island-meta';
  meta.textContent = `🧱 ${isl.cube_count} · ⚡ ${isl.potential_loot} · 🚩 ${isl.flag_hp}`;

  row.append(name, meta);

  if (!isl.can_raid) {
    const badge = document.createElement('div');
    badge.className = 'island-badge';
    badge.textContent = blockLabel(isl);
    row.appendChild(badge);
  }

  row.addEventListener('click', () => visitIsland(isl.user_id, isl.username));
  return row;
}

async function openWorld() {
  closePalette(); closeBlockPalette();
  showScreen('world-screen');
  const list = $('world-list');
  list.innerHTML = '';
  const note = document.createElement('div');
  note.className = 'screen-note';
  note.textContent = t('loading');
  list.appendChild(note);

  try {
    const data = await api('/api/v1/islands?limit=50');
    list.innerHTML = '';
    if (!data.islands.length) {
      const empty = document.createElement('div');
      empty.className = 'screen-note';
      empty.textContent = t('noone');
      list.appendChild(empty);
      return;
    }
    for (const isl of data.islands) list.appendChild(makeIslandRow(isl));
  } catch (e) {
    list.innerHTML = '';
    const err = document.createElement('div');
    err.className = 'screen-note';
    err.textContent = t('error') + ': ' + e.message;
    list.appendChild(err);
  }
}

// ---------- ВИЗИТ ----------
async function visitIsland(userId, username) {
  hideScreens();
  fail(t('islandLoading') + ' ' + username + '...');
  try {
    const detail = await api(`/api/v1/islands/${userId}`);
    targetUser = { user_id: userId, username };

    resetCubes();
    detail.cubes.forEach(addCube);
    refreshCounters();
    setFlagVisual(detail.flag.hp, detail.flag.max_hp, detail.flag.color);
    $('target-name').textContent = username;

    setMode('visit');
    ok();
  } catch (e) {
    ok();
    toast(e.message, true);
  }
}

// ---------- РЕЙД ----------
async function startRaid() {
  if (!targetUser) return;
  fail(t('raidStart'));
  try {
    const res = await api(`/api/v1/raids/${targetUser.user_id}/start`, { method: 'POST' });
    raidId = res.raid_id;
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;

    const detail = await api(`/api/v1/islands/${targetUser.user_id}`);
    resetCubes();
    detail.cubes.forEach(addCube);
    refreshCounters();
    setFlagVisual(detail.flag.hp, detail.flag.max_hp, detail.flag.color);

    setMode('raid');
    updateFlagButton();
    ok();
    toast(t('raidStartOk'));
  } catch (e) {
    ok();
    toast(e.message, true);
  }
}

function updateFlagButton() {
  const btn = $('btn-flag');
  const safe = countSafeCubes();
  if (safe > 0) {
    btn.textContent = `🔒 ${safe}`;
    btn.classList.add('locked');
  } else {
    btn.innerHTML = '⚔️ <span data-i18n="flag">' + t('flag') + '</span>';
    btn.classList.remove('locked');
  }
}

function raidGone(e) {
  if (e.code === 'RAID_NOT_FOUND' || e.code === 'RAID_ALREADY_FINISHED') {
    toast(t('raidFinished'));
    raidId = null;
    setTimeout(returnHome, 1200);
    return true;
  }
  return false;
}

async function attackCube(cube) {
  if (!raidId || attacking) return;
  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-cube`, {
      method: 'POST',
      headers: { 'Idempotency-Key': uid() },
      body: JSON.stringify({ cube_id: cube.id, charge: selectedCharge }),
    });

    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;

    if (res.cube.destroyed) removeCube(res.cube.id);
    else updateCubeHp(res.cube.id, res.cube.hp);
    for (const c of res.collapsed) removeCube(c.id);

    refreshCounters();
    updateFlagButton();
  } catch (e) {
    if (!raidGone(e)) toast(e.message, true);
  } finally {
    attacking = false;
  }
}

async function attackFlag() {
  if (!raidId || attacking) return;
  const safe = countSafeCubes();
  if (safe > 0) { toast(t('flagProtected', { n: safe }), true); return; }
  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-flag`, {
      method: 'POST',
      headers: { 'Idempotency-Key': uid() },
    });

    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    setFlagVisual(res.flag_hp, res.flag_max_hp);

    if (res.flag_destroyed && res.loot) {
      raidId = null;
      $('loot-stolen').textContent = res.loot.stolen_ether;
      $('loot-balance').textContent = res.loot.attacker_balance;
      showScreen('loot-screen');
    } else {
      toast('−' + res.damage + ' ' + t('dmgyou'));
    }
  } catch (e) {
    if (!raidGone(e)) toast(e.message, true);
  } finally {
    attacking = false;
  }
}

async function leaveRaid() {
  if (raidId) {
    try { await api(`/api/v1/raids/${raidId}/finish`, { method: 'POST' }); }
    catch (e) { /* рейд мог истечь сам */ }
  }
  await returnHome();
}

// ---------- ТАПЫ ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPoint = new THREE.Vector3();
const normalMatrix = new THREE.Matrix3();

let pointerStart = null;
const TAP_MAX_MOVE = 8;
const TAP_MAX_TIME = 400;

renderer.domElement.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  pointerStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), id: ev.pointerId };
});

renderer.domElement.addEventListener('pointercancel', () => { pointerStart = null; });

renderer.domElement.addEventListener('pointerup', async (ev) => {
  if (!pointerStart || ev.pointerId !== pointerStart.id) return;

  const moved = Math.hypot(ev.clientX - pointerStart.x, ev.clientY - pointerStart.y);
  const elapsed = performance.now() - pointerStart.t;
  pointerStart = null;

  if (moved > TAP_MAX_MOVE || elapsed > TAP_MAX_TIME) return;
  if (loading) return;

  pointer.x = (ev.clientX / innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  if (mode === 'own' && buildMode) return demolishMode ? handleDemolishTap() : handleBuildTap();
  if (mode === 'raid') return handleRaidTap();
});

// Тап по кубу ставит НА него (по нормали грани), тап по земле — на y = 0.
// Это даёт стекинг без слайдеров высоты.
async function handleBuildTap() {
  const cubeTargets = [...cubeMeshes.values()];
  const cubeHits = raycaster.intersectObjects(cubeTargets, false);

  let x, y, z;

  if (cubeHits.length) {
    const h = cubeHits[0];
    const c = h.object.userData.cube;
    normalMatrix.getNormalMatrix(h.object.matrixWorld);
    const n = h.face.normal.clone().applyMatrix3(normalMatrix).normalize();

    // Сдвигаемся от центра куба к его грани по нормали. Округление гасит
    // накопленную ошибку float: иначе сосед оказывался бы на 0.999 от центра.
    x = Math.round(c.x + n.x);
    y = Math.round(c.y + n.y);
    z = Math.round(c.z + n.z);
  } else {
    if (!raycaster.ray.intersectPlane(plane, hitPoint)) return;
    x = Math.round(hitPoint.x);
    y = 0;
    z = Math.round(hitPoint.z);
  }

  if (Math.abs(x) > 32 || Math.abs(z) > 32) return;
  if (y < 0 || y > 32) return;
  if (x === 0 && y === 0 && z === 0) { toast(t('flagReserved')); return; }

  try {
    const res = await api('/api/v1/build/cube', {
      method: 'POST',
      body: JSON.stringify({ x, y, z, cube_type: 'wood', color: selectedBlockColor }),
    });
    addCube(res.cube);
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    $('cubes').textContent = res.island_cube_count;
  } catch (e) {
    toast(e.message, true);
  }
}

async function handleDemolishTap() {
  const targets = [...cubeMeshes.values()];
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return;

  const cube = hits[0].object.userData.cube;
  try {
    const res = await api(`/api/v1/build/cube/${cube.id}`, { method: 'DELETE' });
    for (const c of res.removed) removeCube(c.id);
    refreshCounters();
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    toast('+' + res.ether_refunded + ' ' + t('refund'));
  } catch (e) {
    toast(e.message, true);
  }
}

async function handleRaidTap() {
  const targets = [...cubeMeshes.values(), ...flagGroup.children];
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return;

  const obj = hits[0].object;
  if (flagGroup.children.includes(obj)) { await attackFlag(); return; }
  await attackCube(obj.userData.cube);
}

$('btn-flag').addEventListener('click', attackFlag);
$('btn-leave').addEventListener('click', leaveRaid);
$('loot-ok').addEventListener('click', returnHome);
$('onboard-ok').addEventListener('click', () => {
  localStorage.setItem('adrift_onboarded', '1');
  hideScreens();
});

// ---------- ЦИКЛ ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  flagGroup.rotation.y += 0.005;
  renderer.render(scene, camera);
}
animate();

// ---------- СТАРТ ----------
(async () => {
  try {
    applyI18n();
    await auth();
    fail(t('loading'));
    await loadMe();
    await loadOwnIsland();
    await loadEconomy();
    setMode('own');
    ok();

    if (!localStorage.getItem('adrift_onboarded')) showScreen('onboard-screen');
  } catch (e) {
    fail(t('error') + ': ' + e.message);
  }
})();
</script>
</body>
 </html>
