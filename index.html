let lang = detectLang();

function detectLang() {
  const saved = localStorage.getItem('adrift_lang');
  if (saved === 'ru' || saved === 'en') return saved;
  return (navigator.language || 'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en';
}

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.ru[key] || key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replace('{' + k + '}', v);
  return s;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.documentElement.lang = lang;
}

}

const fmtTime = (s) => {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + ':' + String(sec).padStart(2, '0');

// ---------- АВТОРИЗАЦИЯ ----------
async function signIn() {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}` },
    body: '{}',
  });
  if (!res.ok) throw new Error('Auth: ' + res.status);
  const data = await res.json();
  token = data.access_token; myId = data.user.id;
  localStorage.setItem('adrift_token', token);
  localStorage.setItem('adrift_id', myId);
}

function clearSession() {
  token = null; myId = null;
  localStorage.removeItem('adrift_token'); localStorage.removeItem('adrift_id');
}

async function api(path, options = {}) {
  const res = await fetch(API_URL + path, {
    ...options,
    headers: { 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json', ...(options.headers||{}) },
  });
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const err = new Error(body?.error?.message || res.statusText);
    err.code = body?.error?.code || ('HTTP_' + res.status);
    throw err;
  }
  return body;
}

const AUTH_ERRORS = ['TOKEN_EXPIRED','TOKEN_INVALID','TOKEN_MISSING','UNAUTHORIZED'];

async function auth() {
  const saved = localStorage.getItem('adrift_token');
  const savedId = localStorage.getItem('adrift_id');
  if (saved && savedId) {
    token = saved; myId = savedId;
    try { await api('/api/v1/build/catalog'); return; }
    catch (e) { if (!AUTH_ERRORS.includes(e.code)) throw e; clearSession(); }
  }
  fail(t('login')); await signIn();
}

// ---------- ТЕКСТУРА ДЕРЕВА ----------
function makeWoodTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);

  for (let i = 0; i < 22; i++) {
    const y = Math.random() * size;
    ctx.strokeStyle = `rgba(0,0,0,${0.04 + Math.random()*0.06})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath(); ctx.moveTo(0, y);
    for (let x = 0; x <= size; x += 8) ctx.lineTo(x, y + Math.sin(x/14+i)*2.5);
    ctx.stroke();
  }
  for (let i = 0; i < 2; i++) {
    const cx = Math.random()*size, cy = Math.random()*size;
    for (let r = 2; r < 8; r += 2) {
      ctx.strokeStyle = `rgba(0,0,0,${0.08 - r*0.008})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(cx, cy, r*1.6, r, 0, 0, Math.PI*2); ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const WOOD_TEXTURE = makeWoodTexture();

// ---------- КУБЫ ----------
const cubeMeshes = new Map();

function makeCubeMaterial(color) {
  return new THREE.MeshLambertMaterial({
    map: WOOD_TEXTURE,
    color: new THREE.Color(BLOCK_COLORS_HEX[color] || BLOCK_COLORS_HEX.wood),
  });
}

function cubeCenter(c) {
  const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
  return { x: c.x + sx/2, y: c.y + sy/2, z: c.z + sz/2 };
}

function addCube(c) {
  if (cubeMeshes.has(c.id)) return;
  const color = c.color || 'wood';
  const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), makeCubeMaterial(color));
  const cc = cubeCenter({ ...c, size_x:sx, size_y:sy, size_z:sz });
  mesh.position.set(cc.x, cc.y, cc.z);
  mesh.userData.cube = { ...c, color, size_x:sx, size_y:sy, size_z:sz };
  scene.add(mesh); cubeMeshes.set(c.id, mesh);
  paintCube(mesh);
}

function paintCube(mesh) {
  const c = mesh.userData.cube;
  const ratio = c.max_hp > 0 ? Math.max(0, Math.min(1, c.hp/c.max_hp)) : 0;
  const base = new THREE.Color(BLOCK_COLORS_HEX[c.color] || BLOCK_COLORS_HEX.wood);
  const hurt = new THREE.Color(0x7f1d1d);
  mesh.material.color.copy(base).lerp(hurt, 1 - ratio);
}

function updateCubeHp(id, hp) {
  const mesh = cubeMeshes.get(id); if (!mesh) return;
  mesh.userData.cube.hp = hp; paintCube(mesh);
}

function removeCube(id) {
  const mesh = cubeMeshes.get(id); if (!mesh) return;
  scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); cubeMeshes.delete(id);
}

function resetCubes() { for (const id of [...cubeMeshes.keys()]) removeCube(id); }

function countSafeCubes() { let n = 0; for (const m of cubeMeshes.values()) if (m.userData.cube.is_safe_zone) n++; return n; }
function refreshCounters() { $('cubes').textContent = cubeMeshes.size; }

function setFlagVisual(hp, maxHp, color) {
  currentFlagHp = hp; currentFlagMax = maxHp;
  if (color) displayFlagColor = color;
  const ratio = maxHp > 0 ? Math.max(0, Math.min(1, hp/maxHp)) : 0;
  const base = new THREE.Color(FLAG_COLORS_HEX[displayFlagColor] || FLAG_COLORS_HEX.red);
  banner.material.color.copy(base).lerp(new THREE.Color(0x7f1d1d), 1 - ratio);
  $('flag').textContent = Math.max(0, hp) + ' / ' + maxHp;
}

// ---------- ПРИЗРАК БЛОКА ----------
// Полупрозрачный куб на экране показывает, куда встанет постройка.
// Считаем его позицию и валидность каждый кадр — 60 raycast'ов в секунду
// по ≤256 мешам, для телефона это дёшево (three.js отсекает по bounding sphere).
const ghostMat = new THREE.MeshBasicMaterial({
  color: 0x22c55e, transparent: true, opacity: 0.4, depthWrite: false,
});
const ghost = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), ghostMat);
ghost.visible = false;
scene.add(ghost);

function updateGhostGeometry() {
  ghost.geometry.dispose();
  ghost.geometry = new THREE.BoxGeometry(selectedSize.sx, selectedSize.sy, selectedSize.sz);
}

const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const hitPoint = new THREE.Vector3();
const normalMatrix = new THREE.Matrix3();
const projVec = new THREE.Vector3();

// Куда встанет блок, если тапнуть в точку с экранными координатами NDC.
// Возвращает {x,y,z,sx,sy,sz,valid,reason,price} или null.
function computePlacement(ndcX, ndcY) {
  const sx = selectedSize.sx, sy = selectedSize.sy, sz = selectedSize.sz;
  raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);

  const cubeHits = raycaster.intersectObjects([...cubeMeshes.values()], false);
  let x, y, z;

  if (cubeHits.length) {
    const h = cubeHits[0];
    const base = h.object.userData.cube;
    const bsx = base.size_x||1, bsy = base.size_y||1, bsz = base.size_z||1;
    const bc = cubeCenter({ ...base, size_x:bsx, size_y:bsy, size_z:bsz });

    normalMatrix.getNormalMatrix(h.object.matrixWorld);
    const n = h.face.normal.clone().applyMatrix3(normalMatrix).normalize();
    const ax = Math.round(n.x), ay = Math.round(n.y), az = Math.round(n.z);

    if (ay !== 0) {
      y = ay > 0 ? base.y + bsy : base.y - sy;
      x = Math.round(bc.x - sx/2);
      z = Math.round(bc.z - sz/2);
    } else if (ax !== 0) {
      x = ax > 0 ? base.x + bsx : base.x - sx;
      y = base.y + Math.round((bsy - sy)/2);
      z = Math.round(bc.z - sz/2);
    } else {
      z = az > 0 ? base.z + bsz : base.z - sz;
      y = base.y + Math.round((bsy - sy)/2);
      x = Math.round(bc.x - sx/2);
    }
  } else {
    if (!raycaster.ray.intersectPlane(plane, hitPoint)) return null;
    x = Math.round(hitPoint.x - sx/2); y = 0; z = Math.round(hitPoint.z - sz/2);
  }

  const price = WOOD_BASE_COST * sx * sy * sz;

  // Локальная валидация — дублирует серверную, но нужна для мгновенной
  // реакции призрака. Сервер всё равно перепроверит и отклонит, если что.
  if (x < -32 || x + sx - 1 > 32 || z < -32 || z + sz - 1 > 32 || y < 0 || y + sy - 1 > 32) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('outOfBounds'), price };
  }
  if (x <= 0 && 0 <= x+sx-1 && y <= 0 && 0 <= y+sy-1 && z <= 0 && 0 <= z+sz-1) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('flagReserved'), price };
  }
  // Пересечение AABB с любым существующим кубом
  for (const m of cubeMeshes.values()) {
    const c = m.userData.cube;
    const csx = c.size_x||1, csy = c.size_y||1, csz = c.size_z||1;
    if (x < c.x+csx && x+sx > c.x && y < c.y+csy && y+sy > c.y && z < c.z+csz && z+sz > c.z) {
      return { x, y, z, sx, sy, sz, valid:false, reason: t('occupied'), price };
    }
  }
  // Опора: каждая клетка под блоком должна быть чем-то накрыта
  if (y > 0) {
    for (let dx = 0; dx < sx; dx++) {
      for (let dz = 0; dz < sz; dz++) {
        const cx = x + dx, cz = z + dz;
        let supported = false;
        for (const m of cubeMeshes.values()) {
          const c = m.userData.cube;
          const csx = c.size_x||1, csy = c.size_y||1, csz = c.size_z||1;
          if (c.y <= y-1 && c.y + csy - 1 >= y-1 &&
              c.x <= cx && c.x + csx - 1 >= cx &&
              c.z <= cz && c.z + csz - 1 >= cz) { supported = true; break; }
        }
        if (!supported) {
          return { x, y, z, sx, sy, sz, valid:false, reason: t('noSupport'), price };
        }
      }
    }
  }
  if (econ.ether_balance < price) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('noEther'), price };
  }
  return { x, y, z, sx, sy, sz, valid:true, reason:'', price };
}

// Куда смотрит «прицел»: на телефоне — центр экрана (камеру наводишь
// поворотом), на мышке — последняя позиция курсора.
const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
const aimPoint = { x: 0, y: 0 };

window.addEventListener('pointermove', (ev) => {
  if (isCoarsePointer) return;
  aimPoint.x = (ev.clientX / innerWidth) * 2 - 1;
  aimPoint.y = -(ev.clientY / innerHeight) * 2 + 1;
});

function updateGhost() {
  if (!buildMode || mode !== 'own' || demolishMode) {
    ghost.visible = false; priceEl.classList.add('hidden'); return;
  }
  const p = computePlacement(aimPoint.x, aimPoint.y);
  if (!p) { ghost.visible = false; priceEl.classList.add('hidden'); return; }

  const cc = cubeCenter(p);
  ghost.position.set(cc.x, cc.y, cc.z);
  ghostMat.color.set(p.valid ? 0x22c55e : 0xef4444);
  ghost.visible = true;

  priceEl.textContent = p.price + '⚡';
  priceEl.classList.toggle('bad', !p.valid);

  projVec.set(cc.x, cc.y + p.sy/2 + 0.35, cc.z).project(camera);
  if (projVec.z > 1) { priceEl.classList.add('hidden'); return; }
  const px = (projVec.x * 0.5 + 0.5) * innerWidth;
  const py = (-projVec.y * 0.5 + 0.5) * innerHeight;
  priceEl.style.transform = `translate(-50%,-100%) translate(${px}px, ${py}px)`;
  priceEl.classList.remove('hidden');
}

// ---------- РЕЖИМЫ / ПАНЕЛЬ ----------
function updatePanel() {
  const on = buildMode && mode === 'own';
  $('btn-build').classList.toggle('primary', on);
  $('btn-build').classList.toggle('on', on);
  $('btn-size').classList.toggle('hidden', !on);
  $('btn-block-color').classList.toggle('hidden', !on);
  $('btn-demolish').classList.toggle('hidden', !on);
  $('target-pill').classList.toggle('hidden', mode === 'own');
}

function setMode(next) {
  mode = next;
  if (next !== 'own') buildMode = false;
  closeAllPalettes();
  updatePanel();
}

function setBuildMode(on) {
  buildMode = on;
  if (on) setDemolish(false);
  closeAllPalettes();
  updatePanel();
}

function setDemolish(on) {
  demolishMode = on;
  $('btn-demolish').classList.toggle('demolish-on', on);
  if (on) buildMode = false;
  updatePanel();
}

function showScreen(id) { $(id).classList.remove('hidden'); }
function hideScreens() {
  ['world-screen','loot-screen','onboard-screen'].forEach(id => $(id).classList.add('hidden'));
  closeAllPalettes();
}

// ---------- ОСТРОВ ----------
async function loadOwnIsland() {
  const data = await api(`/api/v1/islands/${myId}`);
  resetCubes(); data.cubes.forEach(addCube); refreshCounters();
  setFlagVisual(data.flag.hp, data.flag.max_hp, myFlagColor);
}

async function loadMe() {
  const me = await api('/api/v1/me');
  $('ether').textContent = me.ether_balance;
  econ.ether_balance = me.ether_balance;
  myFlagColor = me.flag_color || 'red'; displayFlagColor = myFlagColor;
}

async function returnHome() {
  targetUser = null; raidId = null; hideScreens();
  setDemolish(false); setMode('own'); buildMode = true; updatePanel();
  $('target-name').textContent = '—';
  fail(t('returning'));
  try { await loadOwnIsland(); await loadMe(); await loadEconomy(); } finally { ok(); }
}

// ---------- ЭКОНОМИКА ----------
function renderEconomy() {
  const btn = $('claim-btn'), hint = $('claim-hint');
  if (econ.accrued_now >= 1) { btn.classList.add('ready'); hint.textContent = '+' + econ.accrued_now; }
  else { btn.classList.remove('ready'); hint.textContent = fmtTime(econ.seconds_to_next); }
}

async function loadEconomy() {
  try {
    econ = await api('/api/v1/economy/rates');
    $('ether').textContent = econ.ether_balance;
    renderEconomy();
  } catch (e) {}
}

async function claimEther() {
  if (econ.accrued_now < 1) return;
  try {
    const res = await api('/api/v1/economy/claim', { method: 'POST' });
    $('ether').textContent = res.ether_balance;
    toast('+' + res.claimed + ' ' + t('ether'));
    await loadEconomy();
  } catch (e) {
    if (e.code === 'CLAIM_TOO_EARLY') { await loadEconomy(); return; }
    toast(e.message, true);
  }
}

setInterval(() => {
  if (econ.accrued_now >= 1) return;
  if (econ.seconds_to_next > 0) { econ.seconds_to_next -= 1; renderEconomy(); }
  else loadEconomy();
}, 1000);
setInterval(loadEconomy, 30000);

// ---------- ПАЛИТРЫ ----------
function closeAllPalettes() { ['palette','block-palette','size-palette'].forEach(id => $(id).classList.add('hidden')); }

function buildFlagPalette() {
  const grid = $('palette-grid'); grid.innerHTML = '';
  for (const [key, hex] of Object.entries(FLAG_COLORS_CSS)) {
    const dot = document.createElement('button');
    dot.className = 'color-dot' + (key === myFlagColor ? ' selected' : '');
    dot.style.background = hex;
    dot.addEventListener('click', () => pickFlagColor(key));
    grid.appendChild(dot);
  }
}

function buildBlockPalette() {
  const grid = $('block-palette-grid'); grid.innerHTML = '';
  for (const [key, hex] of Object.entries(BLOCK_COLORS_CSS)) {
    const dot = document.createElement('button');
    dot.className = 'color-dot' + (key === selectedBlockColor ? ' selected' : '');
    dot.style.background = hex;
    dot.addEventListener('click', () => { selectedBlockColor = key; closeAllPalettes(); });
    grid.appendChild(dot);
  }
}

function sizePrice(s) { return WOOD_BASE_COST * s.sx * s.sy * s.sz; }

function buildSizePalette() {
  const grid = $('size-grid'); grid.innerHTML = '';
  for (const s of BLOCK_SIZES) {
    const btn = document.createElement('button');
    btn.className = 'size-btn' + (s.key === selectedSize.key ? ' selected' : '');
    const glyph = document.createElement('span'); glyph.className = 'glyph'; glyph.textContent = s.label;
    const price = document.createElement('span'); price.className = 'price'; price.textContent = sizePrice(s) + '⚡';
    btn.append(glyph, price);
    btn.addEventListener('click', () => {
      selectedSize = s; updateSizeLabel(); updateGhostGeometry(); closeAllPalettes();
    });
    grid.appendChild(btn);
  }
}

function updateSizeLabel() { $('size-label').textContent = selectedSize.label; }

function togglePalette(id) {
  const hidden = $(id).classList.contains('hidden');
  closeAllPalettes();
  if (!hidden) return;
  if (id === 'palette') buildFlagPalette();
  if (id === 'block-palette') buildBlockPalette();
  if (id === 'size-palette') buildSizePalette();
  $(id).classList.remove('hidden');
}

async function pickFlagColor(key) {
  try {
    const res = await api('/api/v1/me/flag-color', { method:'POST', body: JSON.stringify({ color:key }) });
    myFlagColor = res.flag_color;
    if (mode === 'own') setFlagVisual(currentFlagHp, currentFlagMax, myFlagColor);
    closeAllPalettes(); toast(t('flagColorChanged'));
  } catch (e) { toast(e.message, true); }
}

// ---------- МИР ----------
function blockLabel(isl) {
  switch (isl.raid_block_reason) {
    case 'TARGET_SHIELDED': return '🛡 ' + fmtTime(isl.shield_seconds_left);
    case 'COOLDOWN_ACTIVE': return '⏳ ' + fmtTime(isl.cooldown_seconds_left);
    case 'TARGET_IS_SELF': return t('yourIsland');
    default: return isl.raid_block_reason || '';
  }
}

function makeIslandRow(isl) {
  const row = document.createElement('button');
  row.className = 'island-row' + (isl.can_raid ? '' : ' locked');
  const name = document.createElement('div'); name.className = 'island-name'; name.textContent = isl.username;
  const meta = document.createElement('div'); meta.className = 'island-meta';
  meta.textContent = `🧱 ${isl.cube_count} · ⚡ ${isl.potential_loot} · 🚩 ${isl.flag_hp}`;
  row.append(name, meta);
  if (!isl.can_raid) {
    const badge = document.createElement('div'); badge.className = 'island-badge'; badge.textContent = blockLabel(isl);
    row.appendChild(badge);
  }
  row.addEventListener('click', () => visitIsland(isl.user_id, isl.username));
  return row;
}

async function openWorld() {
  closeAllPalettes(); showScreen('world-screen');
  const list = $('world-list'); list.innerHTML = '';
  const note = document.createElement('div'); note.className = 'screen-note'; note.textContent = t('loading');
  list.appendChild(note);
  try {
    const data = await api('/api/v1/islands?limit=50');
    list.innerHTML = '';
    if (!data.islands.length) {
      const empty = document.createElement('div'); empty.className = 'screen-note'; empty.textContent = t('noone');
      list.appendChild(empty); return;
    }
    for (const isl of data.islands) list.appendChild(makeIslandRow(isl));
  } catch (e) {
    list.innerHTML = '';
    const err = document.createElement('div'); err.className = 'screen-note'; err.textContent = t('error') + ': ' + e.message;
    list.appendChild(err);
  }
}

async function visitIsland(userId, username) {
  hideScreens(); fail(t('islandLoading') + ' ' + username + '...');
  try {
    const detail = await api(`/api/v1/islands/${userId}`);
    targetUser = { user_id:userId, username };
    resetCubes(); detail.cubes.forEach(addCube); refreshCounters();
    setFlagVisual(detail.flag.hp, detail.flag.max_hp, detail.flag.color);
    $('target-name').textContent = username;
    setMode('visit'); ok();
  } catch (e) { ok(); toast(e.message, true); }
}

// ---------- РЕЙД ----------
async function startRaid() {
  if (!targetUser) return;
  fail(t('raidStart'));
  try {
    const res = await api(`/api/v1/raids/${targetUser.user_id}/start`, { method:'POST' });
    raidId = res.raid_id;
    $('ether').textContent = res.ether_balance; econ.ether_balance = res.ether_balance;
    const detail = await api(`/api/v1/islands/${targetUser.user_id}`);
    resetCubes(); detail.cubes.forEach(addCube); refreshCounters();
    setFlagVisual(detail.flag.hp, detail.flag.max_hp, detail.flag.color);
    setMode('raid'); updateFlagButton(); ok(); toast(t('raidStartOk'));
  } catch (e) { ok(); toast(e.message, true); }
}

function updateFlagButton() {
  const btn = $('btn-flag'); const safe = countSafeCubes();
  if (safe > 0) { btn.textContent = `🔒 ${safe}`; btn.classList.add('locked'); }
  else { btn.textContent = '⚔️'; btn.classList.remove('locked'); }
}

function raidGone(e) {
  if (e.code === 'RAID_NOT_FOUND' || e.code === 'RAID_ALREADY_FINISHED') {
    toast(t('raidFinished')); raidId = null; setTimeout(returnHome, 1200); return true;
  }
  return false;
}

async function attackCube(cube) {
  if (!raidId || attacking) return;
  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-cube`, {
      method:'POST', headers:{ 'Idempotency-Key': uid() },
      body: JSON.stringify({ cube_id: cube.id, charge: selectedCharge }),
    });
    $('ether').textContent = res.ether_balance; econ.ether_balance = res.ether_balance;
    if (res.cube.destroyed) removeCube(res.cube.id); else updateCubeHp(res.cube.id, res.cube.hp);
    for (const c of res.collapsed) removeCube(c.id);
    refreshCounters(); updateFlagButton();
  } catch (e) { if (!raidGone(e)) toast(e.message, true); }
  finally { attacking = false; }
}

async function attackFlag() {
  if (!raidId || attacking) return;
  const safe = countSafeCubes();
  if (safe > 0) { toast(t('flagProtected', { n:safe }), true); return; }
  attacking = true;
  try {
    const res = await api(`/api/v1/raids/${raidId}/attack-flag`, {
      method:'POST', headers:{ 'Idempotency-Key': uid() },
    });
    $('ether').textContent = res.ether_balance; econ.ether_balance = res.ether_balance;
    setFlagVisual(res.flag_hp, res.flag_max_hp);
    if (res.flag_destroyed && res.loot) {
      raidId = null;
      $('loot-stolen').textContent = res.loot.stolen_ether;
      $('loot-balance').textContent = res.loot.attacker_balance;
      showScreen('loot-screen');
    } else toast('−' + res.damage + ' ' + t('dmgyou'));
  } catch (e) { if (!raidGone(e)) toast(e.message, true); }
  finally { attacking = false; }
}

async function leaveRaid() {
  if (raidId) { try { await api(`/api/v1/raids/${raidId}/finish`, { method:'POST' }); } catch (e) {} }
  await returnHome();
}

// ---------- ТАПЫ ----------
let pointerStart = null;
const TAP_MAX_MOVE = 8, TAP_MAX_TIME = 400;

renderer.domElement.addEventListener('pointerdown', (ev) => {
  if (ev.button !== 0) return;
  pointerStart = { x:ev.clientX, y:ev.clientY, t:performance.now(), id:ev.pointerId };
});

renderer.domElement.addEventListener('pointercancel', () => { pointerStart = null; });

renderer.domElement.addEventListener('pointerup', async (ev) => {
  if (!pointerStart || ev.pointerId !== pointerStart.id) return;
  const moved = Math.hypot(ev.clientX - pointerStart.x, ev.clientY - pointerStart.y);
  const elapsed = performance.now() - pointerStart.t;
  pointerStart = null;
  if (moved > TAP_MAX_MOVE || elapsed > TAP_MAX_TIME) return;
  if (loading) return;

  // Куда тапнули — там и точка прицела. На тач-устройстве это перекрывает
  // центр экрана, что интуитивнее: блок встанет туда, где палец.
  const ndcX = (ev.clientX / innerWidth) * 2 - 1;
  const ndcY = -(ev.clientY / innerHeight) * 2 + 1;

  if (mode === 'own' && demolishMode) return handleDemolishTap(ndcX, ndcY);
  if (mode === 'own' && buildMode) return handleBuildTap(ndcX, ndcY);
  if (mode === 'raid') return handleRaidTap(ndcX, ndcY);
});

async function handleBuildTap(ndcX, ndcY) {
  const p = computePlacement(ndcX, ndcY);
  if (!p) return;
  if (!p.valid) { toast(p.reason, true); return; }

  try {
    const res = await api('/api/v1/build/cube', {
      method:'POST',
      body: JSON.stringify({
        x:p.x, y:p.y, z:p.z,
        size_x:p.sx, size_y:p.sy, size_z:p.sz,
        cube_type:'wood', color: selectedBlockColor,
      }),
    });
    addCube(res.cube);
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    $('cubes').textContent = res.island_cube_count;
  } catch (e) { toast(e.message, true); }
}

async function handleDemolishTap(ndcX, ndcY) {
  raycaster.setFromCamera({ x:ndcX, y:ndcY }, camera);
  const hits = raycaster.intersectObjects([...cubeMeshes.values()], false);
  if (!hits.length) return;
  const cube = hits[0].object.userData.cube;
  try {
    const res = await api(`/api/v1/build/cube/${cube.id}`, { method:'DELETE' });
    for (const c of res.removed) removeCube(c.id);
    refreshCounters();
    $('ether').textContent = res.ether_balance;
    econ.ether_balance = res.ether_balance;
    toast('+' + res.ether_refunded + ' ' + t('refund'));
  } catch (e) { toast(e.message, true); }
}

async function handleRaidTap(ndcX, ndcY) {
  raycaster.setFromCamera({ x:ndcX, y:ndcY }, camera);
  const targets = [...cubeMeshes.values(), ...flagGroup.children];
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return;
  const obj = hits[0].object;
  if (flagGroup.children.includes(obj)) { await attackFlag(); return; }
  await attackCube(obj.userData.cube);
}

// ---------- КНОПКИ ----------
document.querySelectorAll('#bottom-raid .charge').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#bottom-raid .charge').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    selectedCharge = parseInt(btn.dataset.charge, 10);
  });
});

$('claim-btn').addEventListener('click', claimEther);
$('reload').addEventListener('click', () => loadOwnIsland().catch(e => toast(e.message, true)));
$('btn-build').addEventListener('click', () => setBuildMode(!buildMode));
$('btn-demolish').addEventListener('click', () => setDemolish(!demolishMode));
$('btn-size').addEventListener('click', () => togglePalette('size-palette'));
$('btn-block-color').addEventListener('click', () => togglePalette('block-palette'));
$('btn-palette').addEventListener('click', () => togglePalette('palette'));
$('btn-world').addEventListener('click', openWorld);
$('btn-lang').addEventListener('click', () => setLang(lang === 'ru' ? 'en' : 'ru'));
$('world-close').addEventListener('click', hideScreens);
$('btn-back').addEventListener('click', returnHome);
$('btn-raid').addEventListener('click', startRaid);
$('btn-flag').addEventListener('click', attackFlag);
$('btn-leave').addEventListener('click', leaveRaid);
$('loot-ok').addEventListener('click', returnHome);
$('onboard-ok').addEventListener('click', () => {
  localStorage.setItem('adrift_onboarded', '1');
  hideScreens();
});

// Долгий тап по 🎨 (если когда-нибудь вернём кнопку) — не нужен.
// Цвет флага теперь доступен только через... его нет в панели.
// Флаг перекрашивается программно: тап по самому флагу.
renderer.domElement.addEventListener('dblclick', (ev) => {
  if (mode !== 'own') return;
  const ndcX = (ev.clientX / innerWidth) * 2 - 1;
  const ndcY = -(ev.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera({ x:ndcX, y:ndcY }, camera);
  const hits = raycaster.intersectObjects(flagGroup.children, false);
  if (hits.length && buildMode) togglePalette('palette');
});

// ---------- ЦИКЛ ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  flagGroup.rotation.y += 0.005;
  updateGhost();
  renderer.render(scene, camera);
}
animate();

// ---------- СТАРТ ----------
(async () => {
  try {
    applyI18n();
    updateSizeLabel();
    updateGhostGeometry();
    await auth();
    fail(t('loading'));
    await loadMe();
    await loadOwnIsland();
    await loadEconomy();
    setMode('own');
    buildMode = true;
    updatePanel();
    ok();
    if (!localStorage.getItem('adrift_onboarded')) showScreen('onboard-screen');
  } catch (e) { fail(t('error') + ': ' + e.message); }
})();
</script>
