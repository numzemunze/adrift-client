<!DOCTYPE html>
<html lang="en">
<head>

<title>Testroum</title>
<style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ---------------------------------------------------------------
// Scene setup
// ---------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050507);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 5000);
camera.position.set(0, 0, 1200);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: 'high-performance',
  precision: 'mediump'
});
renderer.setPixelRatio(1.0);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Post-processing with bloom
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1.0);
composer.setSize(innerWidth, innerHeight);

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.20,
  0.35,
  0.75
);
composer.addPass(bloomPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.8;
controls.minDistance = 150;
controls.maxDistance = 3000;

// ---------------------------------------------------------------
// Circle texture shared by main points and glow
// ---------------------------------------------------------------
function makeCircleTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.55, 'rgba(255,255,255,0.9)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
}

const circleTexture = makeCircleTexture();

// ---------------------------------------------------------------
// Load fly head model — EdgesGeometry outline (sharp ridges only)
// ---------------------------------------------------------------
function loadFlyModel() {
  const loader = new GLTFLoader();
  const url = 'head.glb';

  loader.load(url, (gltf) => {
    console.log('[fly] gltf loaded');
    const model = gltf.scene;

    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);

    console.log('[fly] size', size.x.toFixed(1), size.y.toFixed(1), size.z.toFixed(1));

    const targetSize = 950;
    const maxDim = Math.max(size.x, size.y, size.z);
    flyScale = targetSize / maxDim;

    // Inner group: center + rotate
    const inner = new THREE.Group();
    model.position.sub(center);
    inner.add(model);
    inner.rotation.set(0, Math.PI, 0);

    // Wrapper: scale + position offset
    const wrapper = new THREE.Group();
    wrapper.add(inner);
    wrapper.scale.setScalar(flyScale);
    // Head sits above brain after centering; pull it back down.
    // Tweak this value if it is still off.
    wrapper.position.set(0, -60, 0);

    // Replace each mesh with an EdgesGeometry outline
    let lineCount = 0;
    const meshes = [];
    model.traverse((node) => {
      if (node.isMesh) meshes.push(node);
    });

    for (const node of meshes) {
      // High threshold = only sharp ridges survive
      const edges = new THREE.EdgesGeometry(node.geometry, 38);
      const line = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({
          color: 0x6fb7d9,
          transparent: true,
          opacity: 0.55,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        })
      );
      line.position.copy(node.position);
      line.rotation.copy(node.rotation);
      line.scale.copy(node.scale);
      inner.add(line);
      lineCount++;

      // Hide the original solid mesh
      node.visible = false;
    }

    flyModel = wrapper;
    scene.add(wrapper);
    console.log('[fly] added, outlines:', lineCount);
  }, (progress) => {
    if (progress.total) {
      loadpct.textContent = 'Model ' + Math.round((progress.loaded / progress.total) * 100) + '%';
    }
  }, (error) => {
    console.error('[fly] load failed:', error);
  });
}

// ---------------------------------------------------------------
// Type colors
// ---------------------------------------------------------------
function hashStringToHue(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return (Math.abs(h) % 360) / 360;
}

const typeColorCache = new Map();
function colorForType(type) {
  if (typeColorCache.has(type)) return typeColorCache.get(type);
  const hue = hashStringToHue(type);
  const color = new THREE.Color().setHSL(hue, 0.65, 0.6);
  typeColorCache.set(type, color);
  return color;
}

// ---------------------------------------------------------------
// State
// ---------------------------------------------------------------
let neurons = null;
let points = null;
let colorAttr = null;
let adjacency = null;
let reverseAdjacency = null;
let baseColors = null;
let currentEdgeMesh = null;
let highlightedIdx = -1;
let activeStim = null;
let flyModel = null;
let flyScale = 1;

// LIF simulation state
let v = null;
let threshold = null;
let decay = null;
let outWeight = null;
let refractory = null;
let spiked = null;
let adjStart = null;
let adjTarget = null;
let adjWeight = null;

// Realistic LIF additions: inhibition + axonal delay
let inhibitory = null;
let axonDelay = null;
let spikeBuffer = null;
let bufferHead = 0;
const BUFFER_SIZE = 6;

const SIM_STEP_MS = 33;
const REFRACTORY_STEPS = 5;
const WEIGHT_SCALE = 0.55;
const SPONTANEOUS_PER_STEP = 4;
let simAccum = 0;
let lastSimTime = 0;

// Aggressive fatigue + hard cap on spikes
let globalFatigue = 0;
const FATIGUE_PER_SPIKE = 0.015;
const FATIGUE_DECAY = 0.82;
const FATIGUE_MAX = 8.0;
const MAX_SPIKES_PER_STEP = 60;

let settleSteps = 0;

// ---------------------------------------------------------------
// Load brain.json
// ---------------------------------------------------------------
const loadbar = document.getElementById('loadbar');
const loadpct = document.getElementById('loadpct');
const loadingEl = document.getElementById('loading');

async function loadBrain() {
  const response = await fetch('brain.json');
  if (!response.ok) throw new Error('Failed to fetch brain.json: ' + response.status);

  const reader = response.body.getReader();
  const chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    loadpct.textContent = (received / 1024 / 1024).toFixed(1) + ' MB';
    loadbar.style.width = Math.min(100, received / 250000) + '%';
  }

  const blob = new Blob(chunks);
  const text = await blob.text();
  return JSON.parse(text);
}

// ---------------------------------------------------------------
// Build neurons
// ---------------------------------------------------------------
function buildNeurons(data) {
  neurons = data.nodes;
  const count = neurons.length;

  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  baseColors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const n = neurons[i];
    positions[i * 3] = n.x;
    positions[i * 3 + 1] = n.y;
    positions[i * 3 + 2] = n.z;

    const c = colorForType(n.type);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
    baseColors[i * 3] = c.r;
    baseColors[i * 3 + 1] = c.g;
    baseColors[i * 3 + 2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 7,
    sizeAttenuation: true,
    vertexColors: true,
    map: circleTexture,
    transparent: true,
    alphaTest: 0.1,
    depthWrite: false
  });

  points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  scene.add(points);

  colorAttr = geo.attributes.color;
}

// ---------------------------------------------------------------
// Adjacency + flat arrays for simulation
// ---------------------------------------------------------------
function buildAdjacency(data) {
  const edges = data.edges;
  const n = neurons.length;

  adjacency = new Array(n);
  reverseAdjacency = new Array(n);
  const outCount = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    adjacency[i] = [];
    reverseAdjacency[i] = [];
  }

  for (let i = 0; i < edges.length; i++) {
    const e = edges[i];
    adjacency[e.source].push({ target: e.target, weight: e.weight });
    reverseAdjacency[e.target].push({ source: e.source, weight: e.weight });
    outCount[e.source]++;
  }

  for (let i = 0; i < n; i++) {
    adjacency[i].sort((a, b) => b.weight - a.weight);
    reverseAdjacency[i].sort((a, b) => b.weight - a.weight);
  }

  adjStart = new Int32Array(n + 1);
  let total = 0;
  for (let i = 0; i < n; i++) {
    adjStart[i] = total;
    total += outCount[i];
  }
  adjStart[n] = total;

  adjTarget = new Int32Array(total);
  adjWeight = new Float32Array(total);

  const cursor = new Int32Array(n);
  for (let i = 0; i < edges.length; i++) {
    const e = edges[i];
    const pos = adjStart[e.source] + cursor[e.source];
    adjTarget[pos] = e.target;
    adjWeight[pos] = (e.weight / (1 + e.weight)) * WEIGHT_SCALE;
    cursor[e.source]++;
  }
}

// ---------------------------------------------------------------
// Group by type prefix
// ---------------------------------------------------------------
let groupMap = null;
let groupNames = null;
let selectedGroup = null;
let groupSet = null;
const groupBar = document.getElementById('group-bar');
const groupPanel = document.getElementById('group-panel');

function buildGroups() {
  groupMap = new Map();
  for (let i = 0; i < neurons.length; i++) {
    const type = neurons[i].type || 'unknown';
    const match = type.match(/^[A-Za-z]+/);
    const prefix = match ? match[0].slice(0, 4) : 'OTHER';
    if (!groupMap.has(prefix)) groupMap.set(prefix, []);
    groupMap.get(prefix).push(i);
  }
  groupNames = Array.from(groupMap.keys()).sort((a, b) => groupMap.get(b).length - groupMap.get(a).length);

  groupBar.innerHTML = '';
  for (const name of groupNames) {
    const count = groupMap.get(name).length;
    const pill = document.createElement('button');
    pill.className = 'group-pill';
    pill.dataset.group = name;
    pill.innerHTML = `<span>${name}</span><span class="count">${count}</span>`;
    pill.addEventListener('click', () => selectGroup(name));
    groupBar.appendChild(pill);
  }
}

function selectGroup(name) {
  if (selectedGroup === name) {
    clearGroupSelection();
    return;
  }
  selectedGroup = name;
  groupSet = new Set(groupMap.get(name));

  infoEl.style.display = 'none';

  document.querySelectorAll('.group-pill').forEach((p) => {
    p.classList.toggle('active', p.dataset.group === name);
  });

  updateActivityColors();
  showGroupPanel(name);
}

function clearGroupSelection() {
  selectedGroup = null;
  groupSet = null;
  document.querySelectorAll('.group-pill').forEach((p) => p.classList.remove('active'));
  groupPanel.style.display = 'none';

  const arr = colorAttr.array;
  for (let i = 0; i < neurons.length; i++) {
    arr[i * 3]     = baseColors[i * 3];
    arr[i * 3 + 1] = baseColors[i * 3 + 1];
    arr[i * 3 + 2] = baseColors[i * 3 + 2];
  }
  colorAttr.needsUpdate = true;
}

  groupPanel.innerHTML = `

  `;

// Initialize simulation arrays
function initSimulation() {
  const n = neurons.length;
  v = new Float32Array(n);
  threshold = new Float32Array(n).fill(1.0);
  decay = new Float32Array(n).fill(0.90);
  outWeight = new Float32Array(n).fill(1.0);
  refractory = new Int32Array(n);
  spiked = new Uint8Array(n);
  inhibitory = new Uint8Array(n);
  axonDelay = new Int8Array(n);

  let inhCount = 0;
  for (let i = 0; i < n; i++) {
    if (Math.random() < 0.20) {
      inhibitory[i] = 1;
      inhCount++;
    }
    axonDelay[i] = 1 + ((Math.random() * 4) | 0);
  }
  console.log('Inhibitory neurons:', inhCount, '/', n);

  spikeBuffer = new Array(BUFFER_SIZE);
  for (let i = 0; i < BUFFER_SIZE; i++) spikeBuffer[i] = [];
  bufferHead = 0;
}

// Debug reset — callable from console via resetSim()
window.resetSim = function () {
  if (!v) return;
  v.fill(0);
  refractory.fill(0);
  spiked.fill(0);
  for (let i = 0; i < BUFFER_SIZE; i++) spikeBuffer[i].length = 0;
  bufferHead = 0;
  console.log('Simulation reset');
};

// One simulation step
function simulateStep() {
  const n = neurons.length;

  // 1. Decay potentials
  for (let i = 0; i < n; i++) {
    if (refractory[i] > 0) {
      refractory[i]--;
      v[i] = 0;
      continue;
    }
    v[i] *= decay[i];
  }

  // 2. Deliver scheduled spikes
  const incoming = spikeBuffer[bufferHead];
  for (let k = 0; k < incoming.length; k++) {
    const src = incoming[k];
    const start = adjStart[src];
    const end = adjStart[src + 1];
    const w = outWeight[src];
    const sign = inhibitory[src] ? -1 : 1;
    for (let e = start; e < end; e++) {
      v[adjTarget[e]] += adjWeight[e] * w * sign;
    }
  }
  incoming.length = 0;

  // 3. Spontaneous activity (skip during settle)
  if (settleSteps > 0) {
    settleSteps--;
  } else {
    for (let s = 0; s < SPONTANEOUS_PER_STEP; s++) {
      const idx = (Math.random() * n) | 0;
      v[idx] += 2.5;
    }
  }

  // 4. Check for new spikes with fatigue and hard cap
  spiked.fill(0);
  let spikeCount = 0;
  const fatigueFactor = 1 + globalFatigue;
  for (let i = 0; i < n; i++) {
    if (spikeCount >= MAX_SPIKES_PER_STEP) break;
    if (refractory[i] > 0) continue;
    if (v[i] >= threshold[i] * fatigueFactor) {
      spiked[i] = 1;
      refractory[i] = REFRACTORY_STEPS;
      v[i] = 0;
      spikeCount++;
      const slot = (bufferHead + axonDelay[i]) % BUFFER_SIZE;
      spikeBuffer[slot].push(i);
    } else if (v[i] > threshold[i] * 2) {
      v[i] = threshold[i] * 2;
    }
  }

  // 5. Update global fatigue
  globalFatigue += spikeCount * FATIGUE_PER_SPIKE;
  globalFatigue *= FATIGUE_DECAY;
  if (globalFatigue > FATIGUE_MAX) globalFatigue = FATIGUE_MAX;

  // 6. Advance buffer
  bufferHead = (bufferHead + 1) % BUFFER_SIZE;
}

// Update point colors based on activity
const HOT_COLOR = new THREE.Color(0xffffff);
function updateActivityColors() {
  const n = neurons.length;
  const arr = colorAttr.array;

  if (selectedGroup !== null && groupSet !== null) {
    for (let i = 0; i < n; i++) {
      const k = i * 3;
      if (groupSet.has(i)) {
        let intensity;
        if (spiked[i]) intensity = 1.0;
        else {
          intensity = v[i] / threshold[i];
          if (intensity > 1) intensity = 1;
        }
        arr[k]     = 0.95 + 0.05 * intensity;
        arr[k + 1] = 0.95 + 0.05 * intensity;
        arr[k + 2] = 1.0;
      } else {
        arr[k]     = baseColors[k] * 0.15;
        arr[k + 1] = baseColors[k + 1] * 0.15;
        arr[k + 2] = baseColors[k + 2] * 0.15;
      }
    }
  } else {
    for (let i = 0; i < n; i++) {
      let intensity;
      if (spiked[i]) {
        intensity = 1.0;
      } else {
        intensity = v[i] / threshold[i];
        if (intensity > 1) intensity = 1;
      }
      const base = baseColors;
      const k = i * 3;
      arr[k]     = base[k]     + (1 - base[k])     * intensity * 0.9;
      arr[k + 1] = base[k + 1] + (1 - base[k + 1]) * intensity * 0.9;
      arr[k + 2] = base[k + 2] + (1 - base[k + 2]) * intensity * 0.9;
    }
  }

  if (highlightedIdx !== -1) {
    const k = highlightedIdx * 3;
    arr[k] = 1; arr[k + 1] = 1; arr[k + 2] = 1;
  }
  colorAttr.needsUpdate = true;
}

// Selected neuron edges

function clearEdgeMesh() {
  if (currentEdgeMesh) {
    scene.remove(currentEdgeMesh);
    currentEdgeMesh.geometry.dispose();
    currentEdgeMesh.material.dispose();
    currentEdgeMesh = null;
  }
}

function showNeuronEdges(idx, maxPerDirection) {
  clearEdgeMesh();

  const outgoing = adjacency[idx].slice(0, maxPerDirection);
  const incoming = reverseAdjacency[idx].slice(0, maxPerDirection);
  const total = outgoing.length + incoming.length;
  if (total === 0) return;

  const positions = new Float32Array(total * 6);
  const colors = new Float32Array(total * 6);
  const origin = neurons[idx];

  let o = 0;
  for (const c of outgoing) {
    const b = neurons[c.target];
    positions[o] = origin.x; positions[o + 1] = origin.y; positions[o + 2] = origin.z;
    positions[o + 3] = b.x; positions[o + 4] = b.y; positions[o + 5] = b.z;
    colors[o] = 0.30; colors[o + 1] = 0.79; colors[o + 2] = 0.94;
    colors[o + 3] = 0.30; colors[o + 4] = 0.79; colors[o + 5] = 0.94;
    o += 6;
  }
  for (const c of incoming) {
    const a = neurons[c.source];
    positions[o] = a.x; positions[o + 1] = a.y; positions[o + 2] = a.z;
    positions[o + 3] = origin.x; positions[o + 4] = origin.y; positions[o + 5] = origin.z;
    colors[o] = 0.94; colors[o + 1] = 0.28; colors[o + 2] = 0.44;
    colors[o + 3] = 0.94; colors[o + 4] = 0.28; colors[o + 5] = 0.44;
    o += 6;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.8
  });

  currentEdgeMesh = new THREE.LineSegments(geo, mat);
  currentEdgeMesh.frustumCulled = false;
  scene.add(currentEdgeMesh);
}

// ---------------------------------------------------------------
// Tap detection
// ---------------------------------------------------------------
const infoEl = document.getElementById('info');
const pullTab = document.getElementById('panel-pull');
let lastSelectedIdx = -1;
let pointerDownTime = 0, pointerDownX = 0, pointerDownY = 0;

let panelDrag = null;

infoEl.addEventListener('pointerdown', (e) => {
  if (!e.target.classList.contains('handle')) return;
  e.preventDefault();
  panelDrag = {
    startY: e.clientY,
    offsetY: 0,
    pointerId: e.pointerId
  };
  infoEl.style.transition = 'none';
  e.target.setPointerCapture(e.pointerId);
});

infoEl.addEventListener('pointermove', (e) => {
  if (!panelDrag || e.pointerId !== panelDrag.pointerId) return;
  const dy = Math.max(0, e.clientY - panelDrag.startY);
  panelDrag.offsetY = dy;
  infoEl.style.transform = `translateY(${dy}px)`;
});

function endPanelDrag(e) {
  if (!panelDrag || e.pointerId !== panelDrag.pointerId) return;
  const dy = panelDrag.offsetY;
  panelDrag = null;

  infoEl.style.transition = 'transform 0.28s cubic-bezier(0.22, 1, 0.36, 1)';
  const panelHeight = infoEl.offsetHeight;

  if (dy > panelHeight * 0.35 || dy > 120) {
    infoEl.style.transform = `translateY(${panelHeight + 60}px)`;
    setTimeout(() => {
      infoEl.style.display = 'none';
      infoEl.style.transform = '';
      infoEl.style.transition = '';
      if (lastSelectedIdx !== -1) pullTab.classList.remove('hidden');
    }, 300);
  } else {
    infoEl.style.transform = 'translateY(0px)';
    setTimeout(() => {
      infoEl.style.transform = '';
      infoEl.style.transition = '';
    }, 300);
  }
}

infoEl.addEventListener('pointerup', endPanelDrag);
infoEl.addEventListener('pointercancel', endPanelDrag);

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownTime = performance.now();
  pointerDownX = e.clientX;
  pointerDownY = e.clientY;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  const dt = performance.now() - pointerDownTime;
  const dx = e.clientX - pointerDownX;
  const dy = e.clientY - pointerDownY;
  if (dt > 350 || Math.hypot(dx, dy) > 12) return;

  const rect = renderer.domElement.getBoundingClientRect();
  const tapX = e.clientX - rect.left;
  const tapY = e.clientY - rect.top;
  const TAP_RADIUS_PX = 45;

  let bestIdx = -1;
  let bestDist = TAP_RADIUS_PX;
  const v3 = new THREE.Vector3();

  for (let i = 0; i < neurons.length; i++) {
    const n = neurons[i];
    v3.set(n.x, n.y, n.z).project(camera);
    if (v3.z > 1) continue;
    const sx = (v3.x * 0.5 + 0.5) * rect.width;
    const sy = (-v3.y * 0.5 + 0.5) * rect.height;
    const dist = Math.hypot(sx - tapX, sy - tapY);
    if (dist < bestDist) {
      bestDist = dist;
      bestIdx = i;
    }
  }

  if (bestIdx !== -1) {
    if (selectedGroup !== null) clearGroupSelection();
    lastSelectedIdx = bestIdx;
    showInfo(bestIdx);
    highlightNeuron(bestIdx);
    showNeuronEdges(bestIdx, 60);
  } else {
    infoEl.style.display = 'none';
    clearEdgeMesh();
    unhighlight();
    if (lastSelectedIdx !== -1) pullTab.classList.remove('hidden');
  }
});

function setPointColor(idx, r, g, b) {
  colorAttr.array[idx * 3] = r;
  colorAttr.array[idx * 3 + 1] = g;
  colorAttr.array[idx * 3 + 2] = b;
}

function highlightNeuron(idx) {
  if (highlightedIdx !== -1 && highlightedIdx !== idx) {
    const p = baseColors;
    setPointColor(highlightedIdx, p[highlightedIdx*3], p[highlightedIdx*3+1], p[highlightedIdx*3+2]);
  }
  setPointColor(idx, 1, 1, 1);
  colorAttr.needsUpdate = true;
  highlightedIdx = idx;
}

function unhighlight() {
  if (highlightedIdx === -1) return;
  const p = baseColors;
  setPointColor(highlightedIdx, p[highlightedIdx*3], p[highlightedIdx*3+1], p[highlightedIdx*3+2]);
  colorAttr.needsUpdate = true;
  highlightedIdx = -1;
}

      <input type="range" id="dc-slider" min="0.5" max="0.99" step="0.01" value="${decay[idx]}">
    </div>
    <div class="slider-row">
      <div class="slider-label"><span>Outgoing strength</span><span class="val" id="ow-val">${outWeight[idx].toFixed(2)}</span></div>

// ---------------------------------------------------------------
// Stimulation with dedicated glow layers
// ---------------------------------------------------------------
function clearStim() {
  if (!activeStim) return;
  for (const layer of activeStim.layerMeshes) {
    scene.remove(layer.points);
    layer.points.geometry.dispose();
    layer.points.material.dispose();
  }
  activeStim = null;
}

function buildStimLayers(startIdx) {
  const MAX_HOPS = 4;
  const PER_HOP = 40;

  const visited = new Set([startIdx]);
  const layers = [[startIdx]];

  for (let hop = 0; hop < MAX_HOPS; hop++) {
    const prev = layers[layers.length - 1];
    const next = [];
    for (const idx of prev) {
      for (const conn of adjacency[idx]) {
        if (next.length >= PER_HOP) break;
        if (!visited.has(conn.target)) {
          visited.add(conn.target);
          next.push(conn.target);
        }
      }
      if (next.length >= PER_HOP) break;
    }
    if (next.length === 0) break;
    layers.push(next);
  }
  return layers;
}

function stimulate(startIdx) {
  clearStim();

  const layers = buildStimLayers(startIdx);

  const layerMeshes = [];
  for (let li = 0; li < layers.length; li++) {
    const positions = new Float32Array(layers[li].length * 3);
    for (let i = 0; i < layers[li].length; i++) {
      const n = neurons[layers[li][i]];
      positions[i*3] = n.x;
      positions[i*3+1] = n.y;
      positions[i*3+2] = n.z;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      size: 20,
      map: circleTexture,
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      sizeAttenuation: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    scene.add(pts);

    layerMeshes.push({ points: pts, layerIndex: li });
  }

  activeStim = {
    startTime: performance.now(),
    duration: 1800,
    layerCount: layers.length,
    layerMeshes: layerMeshes
  };
}

function updateStim(now) {
  if (!activeStim) return;
  const t = (now - activeStim.startTime) / activeStim.duration;

  if (t >= 1) {
    clearStim();
    return;
  }

  const L = activeStim.layerCount;
  for (const lm of activeStim.layerMeshes) {
    const layerStart = lm.layerIndex / L;
    const layerSpan = 2 / L;
    const lt = (t - layerStart) / layerSpan;

    if (lt < 0 || lt > 1) {
      lm.points.material.opacity = 0;
      continue;
    }

    const pulse = Math.sin(lt * Math.PI);
    lm.points.material.opacity = pulse;
    lm.points.material.size = 18 + pulse * 35;
  }
}

// ---------------------------------------------------------------
// Buttons
// ---------------------------------------------------------------
document.getElementById('btn-stim').addEventListener('click', () => {
  if (!neurons) return;

  let target = highlightedIdx;
  if (target === -1) {
    target = (Math.random() * neurons.length) | 0;
    highlightNeuron(target);
  }
  lastSelectedIdx = target;

  infoEl.style.transition = 'transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)';
  infoEl.style.transform = 'translateY(120%)';
  setTimeout(() => {
    infoEl.style.display = 'none';
    infoEl.style.transform = '';
    infoEl.style.transition = '';
    if (lastSelectedIdx !== -1) pullTab.classList.remove('hidden');
  }, 260);

  showNeuronEdges(target, 60);
  stimulate(target);
});

document.getElementById('hud-reset').addEventListener('click', () => {
  if (!v) return;

  v.fill(0);
  refractory.fill(0);
  spiked.fill(0);
  for (let i = 0; i < BUFFER_SIZE; i++) spikeBuffer[i].length = 0;
  bufferHead = 0;

  threshold.fill(1.0);
  decay.fill(0.90);
  outWeight.fill(1.0);

  globalFatigue = 0;
  settleSteps = 30;

  if (selectedGroup !== null) clearGroupSelection();

  clearEdgeMesh();
  clearStim();
  unhighlight();
  infoEl.style.display = 'none';
  pullTab.classList.add('hidden');

  updateActivityColors();
});

document.getElementById('hud-fly').addEventListener('click', () => {
  if (!flyModel) return;
  flyModel.visible = !flyModel.visible;
  document.getElementById('hud-fly').classList.toggle('active', flyModel.visible);
});

pullTab.addEventListener('click', () => {
  if (lastSelectedIdx === -1) return;
  showInfo(lastSelectedIdx);
  highlightNeuron(lastSelectedIdx);
  showNeuronEdges(lastSelectedIdx, 60);
});

// ---------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------
const hudStats = document.getElementById('hud-stats');
let lastFpsTime = performance.now();
let frameCount = 0;

function animate(now) {
  requestAnimationFrame(animate);

  if (lastSimTime === 0) lastSimTime = now;
  simAccum += now - lastSimTime;
  lastSimTime = now;

  let simulated = false;
  while (simAccum >= SIM_STEP_MS) {
    simulateStep();
    simAccum -= SIM_STEP_MS;
    simulated = true;
  }

  if (simulated) {
    updateActivityColors();
  }

  controls.update();
  updateStim(now);
  composer.render();

  frameCount++;
  if (now - lastFpsTime > 1000) {
    const fps = Math.round(frameCount * 1000 / (now - lastFpsTime));

    let activeCount = 0;
    let spikingCount = 0;
    for (let i = 0; i < v.length; i++) {
      if (spiked[i]) spikingCount++;
      if (v[i] > threshold[i] * 0.1) activeCount++;
    }

    hudStats.innerHTML =
      `${fps} FPS<br>` +
      `${activeCount.toLocaleString('en')} active<br>` +
      `${spikingCount.toLocaleString('en')} spiking`;

    frameCount = 0;
    lastFpsTime = now;
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------
// Bootstrap
// ---------------------------------------------------------------
(async () => {
  try {
    const data = await loadBrain();
    buildNeurons(data);
    buildAdjacency(data);
    buildGroups();
    loadFlyModel();
    initSimulation();
    requestAnimationFrame(animate);
    loadingEl.style.opacity = '0';
    setTimeout(() => loadingEl.remove(), 400);
  } catch (err) {
    loadingEl.innerHTML = '<div style="color:#ef476f;padding:20px;text-align:center;">' + err.message + '</div>';
    console.error(err);
  }
})();
</script>
