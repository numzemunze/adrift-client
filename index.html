<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ADRIFT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1020; font-family:system-ui,-apple-system,sans-serif; color:#fff; }
  #app { position:fixed; inset:0; }

  .bar { position:fixed; left:0; right:0; padding:10px 12px; display:flex; gap:8px; align-items:center; z-index:10; pointer-events:none; flex-wrap:wrap; justify-content:center; }
  .bar * { pointer-events:auto; }
  #top { top:0; justify-content:flex-start; background:linear-gradient(180deg,rgba(11,16,32,.9),rgba(11,16,32,0)); }
  #bottom, #bottom-visit, #bottom-raid {
    bottom:0; background:linear-gradient(0deg,rgba(11,16,32,.92),rgba(11,16,32,0));
    padding-bottom:14px;
  }

  .pill { background:rgba(255,255,255,.08); backdrop-filter:blur(8px); padding:6px 12px; border-radius:20px; font-size:14px; font-variant-numeric:tabular-nums; color:#fff; border:1px solid rgba(255,255,255,.1); font-family:inherit; }
  .pill b { color:#7dd3fc; }
  .pill-btn { display:flex; gap:8px; align-items:center; cursor:pointer; transition:background .15s; }
  .pill-btn:active { background:rgba(255,255,255,.22); }
  .pill-btn.ready { background:#16a34a; border-color:#22c55e; }
  .pill-btn.ready b { color:#fff; }
  #claim-hint { font-size:12px; opacity:.8; }
  #target-pill b { color:#fca5a5; }

  button {
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.16);
    color:#fff; padding:11px 14px; border-radius:12px;
    font-size:14px; font-weight:500; font-family:inherit; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    transition:transform .1s ease, background .15s ease, box-shadow .15s ease;
  }
  button:active { transform:scale(.94); background:rgba(255,255,255,.22); }
  button.on { background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#60a5fa; }
  button.locked { opacity:.5; }
  button:disabled { opacity:.45; }
  button.danger { background:linear-gradient(180deg,#dc2626,#b91c1c); border-color:#ef4444; }
  button.go { background:linear-gradient(180deg,#22c55e,#15803d); border-color:#4ade80; }
  button.demolish-on { background:linear-gradient(180deg,#dc2626,#7f1d1d); border-color:#ef4444; }
  button.primary { background:linear-gradient(180deg,#3b82f6,#1d4ed8); border-color:#60a5fa; font-weight:600; }
  button.icon { padding:10px 12px; }
  button.rot-on { background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#60a5fa; }

  .swatch {
    display:block; width:22px; height:22px; border-radius:6px;
    border:2px solid rgba(255,255,255,.5);
    box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
    transition: background .15s ease;
  }

  #toast {
    position:fixed; top:64px; left:50%; transform:translateX(-50%) translateY(-8px);
    background:rgba(30,41,59,.96); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); border-radius:14px;
    padding:12px 20px; font-size:14px; font-weight:500;
    max-width:88vw; text-align:center; pointer-events:none; z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0; transition:opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.error { background:rgba(127,29,29,.96); border-color:rgba(239,68,68,.5); }
  #toast.tip { background:rgba(21,128,61,.96); border-color:rgba(74,222,128,.5); }
  #toast.warn { background:rgba(120,53,15,.96); border-color:rgba(245,158,11,.55); }

  #price-tag {
    position:fixed; top:0; left:0;
    background:rgba(17,26,51,.94); backdrop-filter:blur(6px);
    padding:4px 10px; border-radius:10px;
    font-size:13px; font-weight:600; color:#fde68a;
    border:1px solid rgba(255,255,255,.18);
    pointer-events:none; z-index:9; white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  #price-tag.bad { color:#fca5a5; }

  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:#0b1020; z-index:100; font-size:16px; line-height:1.5; }
  #status.hidden { display:none; }
  #err { color:#fca5a5; font-size:13px; }

  .screen { position:fixed; inset:0; background:#0b1020; z-index:50; display:flex; flex-direction:column; padding:14px; overflow-y:auto; animation:fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .screen-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .screen-title { font-size:20px; font-weight:700; }
  .island-row { display:flex; flex-direction:column; gap:4px; width:100%; text-align:left; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:13px 15px; margin-bottom:8px; }
  .island-row:active { background:rgba(255,255,255,.16); }
  .island-row.locked { opacity:.55; }
  .island-name { font-size:16px; font-weight:600; }
  .island-meta { font-size:13px; color:rgba(255,255,255,.7); }
  .island-badge { font-size:12px; color:#fca5a5; }
  .screen-note { text-align:center; color:rgba(255,255,255,.5); padding:32px 16px; }

  #loot-screen { align-items:center; justify-content:center; }
  .loot-card { background:#111a33; border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:28px 24px; text-align:center; max-width:340px; width:100%; }
  .loot-emoji { font-size:48px; margin-bottom:8px; }
  .loot-title { font-size:20px; font-weight:700; margin-bottom:16px; }
  .loot-row { font-size:15px; color:rgba(255,255,255,.8); margin-bottom:8px; }
  .loot-row b { color:#7dd3fc; font-size:18px; }
  .loot-card button { width:100%; margin-top:16px; }

  #onboard-screen { align-items:center; justify-content:center; }
  .onboard-card { background:#111a33; border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:24px 22px; max-width:360px; width:100%; }
  .onboard-emoji { font-size:44px; text-align:center; margin-bottom:6px; }
  .onboard-title { font-size:19px; font-weight:700; text-align:center; margin-bottom:18px; }
  .onboard-step { font-size:14px; line-height:1.5; color:rgba(255,255,255,.85); margin-bottom:12px; }
  .onboard-step b { color:#7dd3fc; }
  .onboard-card button { width:100%; margin-top:6px; }

  #tip-screen {
    background:linear-gradient(0deg, rgba(11,16,32,.95) 0%, rgba(11,16,32,.55) 45%, rgba(11,16,32,0) 100%);
    justify-content:flex-end;
    align-items:center;
    padding-bottom:36px;
  }
  .tip-card {
    background:rgba(17,26,51,.97);
    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;
    padding:18px 20px 16px;
    width:100%; max-width:440px;
    box-shadow:0 14px 44px rgba(0,0,0,.6);
  }
  .tip-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .tip-dot { width:10px; height:10px; border-radius:50%; background:#7dd3fc; box-shadow:0 0 10px #7dd3fc; animation: tipPulse 1.6s ease-in-out infinite; }
  @keyframes tipPulse { 0%,100% { transform:scale(1); opacity:1; } 50% { transform:scale(1.35); opacity:.6; } }
  .tip-title { font-size:15px; font-weight:700; color:#7dd3fc; letter-spacing:.3px; }
  .tip-text { font-size:15px; line-height:1.5; color:rgba(255,255,255,.94); margin-bottom:16px; min-height:44px; }
  .tip-word { display:inline-block; white-space:nowrap; }
  .tip-char { display:inline-block; opacity:0; animation: tipChar .32s ease-out forwards; }
  @keyframes tipChar { from { opacity:0; transform: translateY(7px) scale(.9); } to { opacity:1; transform: none; } }
  .tip-card button { width:100%; }

  #palette, #block-palette, #size-palette {
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:rgba(17,26,51,.98); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15); border-radius:16px;
    padding:14px; z-index:60; box-shadow:0 12px 40px rgba(0,0,0,.6);
    animation:popIn .18s ease-out;
  }
  @keyframes popIn { from { opacity:0; transform:translateX(-50%) scale(.92); } to { opacity:1; transform:translateX(-50%) scale(1); } }
  .palette-title { font-size:12px; color:rgba(255,255,255,.65); margin-bottom:10px; text-align:center; letter-spacing:.5px; text-transform:uppercase; }
  .palette-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .color-dot { width:46px; height:46px; border-radius:12px; border:2px solid rgba(255,255,255,.2); cursor:pointer; padding:0; }
  .color-dot:active { transform:scale(.86); }
  .color-dot.selected { border-color:#fff; border-width:3px; }

  .size-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .size-btn { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:100px; padding:12px 10px; }
  .size-btn .glyph { font-family:ui-monospace,monospace; font-size:15px; font-weight:700; }
  .size-btn .price { font-size:11px; opacity:.75; }
  .size-btn.selected { background:linear-gradient(180deg,#3b82f6,#2563eb); border-color:#60a5fa; }

  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app"></div>

<div class="bar" id="top">
  <button class="pill pill-btn" id="claim-btn" title="Claim">
    ⚡ <b id="ether">—</b>
    <span id="claim-hint">…</span>
  </button>
  <div class="pill">🧱 <b id="cubes">—</b></div>
  <div class="pill">🚩 <b id="flag">—</b></div>
  <div class="pill hidden" id="target-pill">👁 <b id="target-name">—</b></div>
</div>

<div id="price-tag" class="hidden">10⚡</div>

<div class="bar" id="bottom">
  <button id="btn-build" class="primary icon" title="Build">🔨</button>
  <button id="btn-size" class="hidden">📐 <span id="size-label">1×1</span></button>
  <button id="btn-rotate" class="hidden icon" title="Rotate">↔️</button>
  <button id="btn-block-color" class="hidden icon" title="Block color"><span class="swatch" id="swatch-block"></span></button>
  <button id="btn-palette" class="hidden icon" title="Flag color">🎨</button>
  <button id="btn-demolish" class="hidden icon" title="Demolish">🗑</button>
  <button id="btn-world" class="icon" title="World">🌍</button>
  <button id="reload" class="icon" title="Reload">↻</button>
</div>

<div class="bar hidden" id="bottom-visit">
  <button id="btn-back">↩</button>
  <button id="btn-raid" class="danger">⚔️</button>
</div>

<div class="bar hidden" id="bottom-raid">
  <button class="charge" data-charge="1">1 · 10⚡</button>
  <button class="charge on" data-charge="2">2 · 25⚡</button>
  <button class="charge" data-charge="3">3 · 60⚡</button>
  <button id="btn-flag" class="danger">⚔️</button>
  <button id="btn-leave">🏳</button>
</div>

<div id="palette" class="hidden">
  <div class="palette-title" data-i18n="flagColor">Цвет флага</div>
  <div class="palette-grid" id="palette-grid"></div>
</div>

<div id="block-palette" class="hidden">
  <div class="palette-title" data-i18n="blockColor">Цвет блока</div>
  <div class="palette-grid" id="block-palette-grid"></div>
</div>

<div id="size-palette" class="hidden">
  <div class="palette-title" data-i18n="sizeTitle">Размер блока</div>
  <div class="size-grid" id="size-grid"></div>
</div>

<div class="screen hidden" id="world-screen">
  <div class="screen-head">
    <div class="screen-title" data-i18n="worldTitle">🌍 Мир</div>
    <button id="world-close">✕</button>
  </div>
  <div id="world-list"></div>
</div>

<div class="screen hidden" id="loot-screen">
  <div class="loot-card">
    <div class="loot-emoji">🏆</div>
    <div class="loot-title" data-i18n="lootTitle">Флаг разрушен!</div>
    <div class="loot-row"><span data-i18n="lootStolen">Украдено:</span> <b id="loot-stolen">0</b></div>
    <div class="loot-row"><span data-i18n="lootBalance">Баланс:</span> <b id="loot-balance">0</b></div>
    <button id="loot-ok" class="go" data-i18n="returnHome">Вернуться</button>
  </div>
</div>

<div class="screen hidden" id="tip-screen">
  <div class="tip-card">
    <div class="tip-head">
      <div class="tip-dot"></div>
      <div class="tip-title" id="tip-title" data-i18n="tipTitle">Буй говорит</div>
    </div>
    <div class="tip-text" id="tip-text"></div>
    <button id="tip-ok" class="go" data-i18n="tipOk">Ок</button>
  </div>
</div>

<div class="screen hidden" id="onboard-screen">
  <div class="onboard-card">
    <div class="onboard-emoji">🏝️</div>
    <div class="onboard-title" data-i18n="onboardTitle">Добро пожаловать в ADRIFT</div>
    <div class="onboard-step" data-i18n-html="onboard1"></div>
    <div class="onboard-step" data-i18n-html="onboard2"></div>
    <div class="onboard-step" data-i18n-html="onboard3"></div>
    <div class="onboard-step" data-i18n-html="onboard4"></div>
    <button id="onboard-ok" class="go" data-i18n="onboardOk">Понятно, играем</button>
  </div>
</div>

<div id="toast" class="hidden"></div>
<div id="status">Loading...<br><span id="err"></span></div>

  if (h > 0) return h + 'h ' + m + 'm';

async function signIn() {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'apikey':SUPABASE_ANON_KEY, 'Authorization':`Bearer ${SUPABASE_ANON_KEY}` },
    body: '{}',
  });
  if (!res.ok) throw new Error('Auth: ' + res.status);
  const data = await res.json();
  token = data.access_token; myId = data.user.id;
  localStorage.setItem('adrift_token', token);
  localStorage.setItem('adrift_id', myId);
}
function clearSession() { token = null; myId = null; localStorage.removeItem('adrift_token'); localStorage.removeItem('adrift_id'); }

async function api(path, options = {}) {
  const res = await fetch(API_URL + path, {
    ...options,
    headers: { 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json', ...(options.headers||{}) },
  });
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const err = new Error(body?.error?.message || res.statusText);
    err.code = body?.error?.code || ('HTTP_' + res.status);
    throw err;
  }
  return body;
}
const AUTH_ERRORS = ['TOKEN_EXPIRED','TOKEN_INVALID','TOKEN_MISSING','UNAUTHORIZED'];

async function auth() {

    try { await api('/api/v1/build/catalog'); return; }

}

function makeWoodTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size);
  for (let i = 0; i < 22; i++) {
    const y = Math.random() * size;
    ctx.strokeStyle = `rgba(0,0,0,${0.04 + Math.random()*0.06})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath(); ctx.moveTo(0, y);
    for (let x = 0; x <= size; x += 8) ctx.lineTo(x, y + Math.sin(x/14+i)*2.5);
    ctx.stroke();
  }
  for (let i = 0; i < 2; i++) {
    const cx = Math.random()*size, cy = Math.random()*size;
    for (let r = 2; r < 8; r += 2) {
      ctx.strokeStyle = `rgba(0,0,0,${0.08 - r*0.008})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(cx, cy, r*1.6, r, 0, 0, Math.PI*2); ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const WOOD_TEXTURE = makeWoodTexture();

// ---------- КУБЫ ----------
const cubeMeshes = new Map();
let blockedGround = new Set();

function makeCubeMaterial(color) {
  return new THREE.MeshLambertMaterial({
    map: WOOD_TEXTURE,
    color: new THREE.Color(BLOCK_COLORS_HEX[color] || BLOCK_COLORS_HEX.wood),
  });
}
function cubeCenter(c) {
  const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
  return { x: c.x + sx/2, y: c.y + sy/2, z: c.z + sz/2 };
}
function rebuildBlockedGround() {
  blockedGround = new Set();
  for (const m of cubeMeshes.values()) {
    const c = m.userData.cube;
    const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
    if (c.y <= 0 && c.y + sy - 1 >= 0) {
      for (let dx = 0; dx < sx; dx++)
        for (let dz = 0; dz < sz; dz++)
          blockedGround.add((c.x+dx) + ',' + (c.z+dz));
    }
  }
}
function addCube(c) {
  if (cubeMeshes.has(c.id)) return;
  const color = c.color || 'wood';
  const sx = c.size_x||1, sy = c.size_y||1, sz = c.size_z||1;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), makeCubeMaterial(color));
  const cc = cubeCenter({ ...c, size_x:sx, size_y:sy, size_z:sz });
  mesh.position.set(cc.x, cc.y, cc.z);
  mesh.userData.cube = { ...c, color, size_x:sx, size_y:sy, size_z:sz };
  scene.add(mesh); cubeMeshes.set(c.id, mesh);
  paintCube(mesh);
  rebuildBlockedGround();
  resetMinionPath();
}
function paintCube(mesh) {
  const c = mesh.userData.cube;
  const ratio = c.max_hp > 0 ? Math.max(0, Math.min(1, c.hp/c.max_hp)) : 0;
  const base = new THREE.Color(BLOCK_COLORS_HEX[c.color] || BLOCK_COLORS_HEX.wood);
  const hurt = new THREE.Color(0x7f1d1d);
  mesh.material.color.copy(base).lerp(hurt, 1 - ratio);
}
function updateCubeHp(id, hp) {
  const mesh = cubeMeshes.get(id); if (!mesh) return;
  mesh.userData.cube.hp = hp; paintCube(mesh);
}
function removeCube(id) {
  const mesh = cubeMeshes.get(id); if (!mesh) return;
  scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); cubeMeshes.delete(id);
  rebuildBlockedGround(); resetMinionPath();
}
function resetCubes() { for (const id of [...cubeMeshes.keys()]) removeCube(id); rebuildBlockedGround(); }
function countSafeCubes() { let n = 0; for (const m of cubeMeshes.values()) if (m.userData.cube.is_safe_zone) n++; return n; }
function refreshCounters() { $('cubes').textContent = cubeMeshes.size; }
function setFlagVisual(hp, maxHp, color) {
  currentFlagHp = hp; currentFlagMax = maxHp;
  if (color) displayFlagColor = color;
  const ratio = maxHp > 0 ? Math.max(0, Math.min(1, hp/maxHp)) : 0;
  const base = new THREE.Color(FLAG_COLORS_HEX[displayFlagColor] || FLAG_COLORS_HEX.red);
  banner.material.color.copy(base).lerp(new THREE.Color(0x7f1d1d), 1 - ratio);
  $('flag').textContent = Math.max(0, hp) + ' / ' + maxHp;
  setMinionFlagColor(displayFlagColor);
}

const emojiTexCache = new Map();
function emojiTexture(char) {
  if (emojiTexCache.has(char)) return emojiTexCache.get(char);
  const px = 96;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = px;
  const ctx = canvas.getContext('2d');
  ctx.font = `${Math.floor(px * 0.76)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(char, px/2, px/2 + px*0.04);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  emojiTexCache.set(char, tex);
  return tex;
}
function makeSprite(char, size) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: emojiTexture(char), transparent: true, depthWrite: false, opacity: 0,
  }));
  sp.scale.set(size, size, 1); sp.userData.char = char;
  return sp;
}
function setSpriteChar(sp, char, size) {
  if (sp.userData.char !== char) {
    sp.material.map = emojiTexture(char);
    sp.userData.char = char;
    sp.material.needsUpdate = true;
  }
  sp.scale.set(size, size, 1);
}

  bubbleSprite = makeSprite('💬', 1.1);
  bubbleSprite.position.set(0, 2.6, 0);
  minionGroup.add(bubbleSprite);

  // Капли 💦 для паники: летят вверх и расходятся в стороны.
  for (let i = 0; i < 4; i++) {
    const d = makeSprite('💦', 0.55);
    d.userData.phase = i / 4;
    minionGroup.add(d);
    droplets.push(d);
  }

  Object.assign(minionParts, {
    bodyGroup, torso, belt, head, headMesh,
    eyeBaseL, eyeBaseR, pupilL, pupilR, browL, browR, mouth, blushL, blushR,
    armLPivot, elbowLPivot, armLUpper, armLLower, handL,
    armRPivot, elbowRPivot, armRUpper, armRLower, handR, mPole, mFlag,
    legLPivot, kneeLPivot, legLUpper, legLLower, footL,
    legRPivot, kneeRPivot, legRUpper, legRLower, footR,
  });

  scene.add(minionGroup);
})();

// Все оси в одном объекте. Каждый кадр считаем target, ведём current к нему.
const POSE_DEFAULT = {
  armLx: 0, armLz: 0, elbowL: 0,
  armRx: Math.PI, armRz: 0, elbowR: 0,
  legLx: 0, legLz: 0, kneeL: 0,
  legRx: 0, legRz: 0, kneeR: 0,
  headX: 0, headY: 0, headZ: 0,

  rootY: 0, rootOffsetY: 0,

function resetPoseTarget() { Object.assign(poseTarget, POSE_DEFAULT); }

const POSE_SPEED = { leg: 16, arm: 14, elbow: 12, head: 7, body: 6, root: 12 };

function applyPose(dt) {
  const lerp = (c, tt, k) => c + (tt - c) * Math.min(1, dt * k);

  poseCurrent.armLx  = lerp(poseCurrent.armLx,  poseTarget.armLx,  POSE_SPEED.arm);
  poseCurrent.armLz  = lerp(poseCurrent.armLz,  poseTarget.armLz,  POSE_SPEED.arm);
  poseCurrent.elbowL = lerp(poseCurrent.elbowL, poseTarget.elbowL, POSE_SPEED.elbow);
  poseCurrent.armRx  = lerp(poseCurrent.armRx,  poseTarget.armRx,  POSE_SPEED.arm);
  poseCurrent.armRz  = lerp(poseCurrent.armRz,  poseTarget.armRz,  POSE_SPEED.arm);
  poseCurrent.elbowR = lerp(poseCurrent.elbowR, poseTarget.elbowR, POSE_SPEED.elbow);
  poseCurrent.legLx  = lerp(poseCurrent.legLx,  poseTarget.legLx,  POSE_SPEED.leg);
  poseCurrent.legLz  = lerp(poseCurrent.legLz,  poseTarget.legLz,  POSE_SPEED.leg);
  poseCurrent.kneeL  = lerp(poseCurrent.kneeL,  poseTarget.kneeL,  POSE_SPEED.leg);
  poseCurrent.legRx  = lerp(poseCurrent.legRx,  poseTarget.legRx,  POSE_SPEED.leg);
  poseCurrent.legRz  = lerp(poseCurrent.legRz,  poseTarget.legRz,  POSE_SPEED.leg);
  poseCurrent.kneeR  = lerp(poseCurrent.kneeR,  poseTarget.kneeR,  POSE_SPEED.leg);
  poseCurrent.headX  = lerp(poseCurrent.headX,  poseTarget.headX,  POSE_SPEED.head);
  poseCurrent.headY  = lerp(poseCurrent.headY,  poseTarget.headY,  POSE_SPEED.head);
  poseCurrent.headZ  = lerp(poseCurrent.headZ,  poseTarget.headZ,  POSE_SPEED.head);
  poseCurrent.bodyX  = lerp(poseCurrent.bodyX,  poseTarget.bodyX,  POSE_SPEED.body);
  poseCurrent.bodyY  = lerp(poseCurrent.bodyY,  poseTarget.bodyY,  POSE_SPEED.body);
  poseCurrent.bodyZ  = lerp(poseCurrent.bodyZ,  poseTarget.bodyZ,  POSE_SPEED.body);
  poseCurrent.rootY  = lerp(poseCurrent.rootY,  poseTarget.rootY,  POSE_SPEED.root);
  poseCurrent.rootOffsetY = lerp(poseCurrent.rootOffsetY, poseTarget.rootOffsetY, POSE_SPEED.root);

  minionParts.armLPivot.rotation.x = poseCurrent.armLx;
  minionParts.armLPivot.rotation.z = poseCurrent.armLz;
  minionParts.elbowLPivot.rotation.x = poseCurrent.elbowL;

  minionParts.legLPivot.rotation.z = poseCurrent.legLz;
  minionParts.kneeLPivot.rotation.x = poseCurrent.kneeL;
  minionParts.legRPivot.rotation.x = poseCurrent.legRx;
  minionParts.legRPivot.rotation.z = poseCurrent.legRz;
  minionParts.kneeRPivot.rotation.x = poseCurrent.kneeR;
  minionParts.head.rotation.x = poseCurrent.headX;
  minionParts.head.rotation.y = poseCurrent.headY;
  minionParts.head.rotation.z = poseCurrent.headZ;
  minionParts.bodyGroup.rotation.x = poseCurrent.bodyX;
  minionParts.bodyGroup.rotation.y = poseCurrent.bodyY;
  minionParts.bodyGroup.rotation.z = poseCurrent.bodyZ;
  minionGroup.rotation.y = poseCurrent.rootY;
  minionGroup.position.y = poseCurrent.rootOffsetY;
}

// --- Общая логика Буя ---
const minion = {

function setMinionFlagColor(color) {

}

function baseMood() {
  if (mode === 'raid') return 'panic';
  if (mode === 'own' && myRaidAlert) return 'alert';
  return 'calm';
}

function refreshMinionMood() {
  if (minion.frozen || minion.thinking) return;
  minion.mood = baseMood();
  if (!minion.override) minion.emotion = minion.mood;
}

// Событие: включить эмоцию на несколько секунд. Не срабатывает поверх
// «модальных» состояний (совет, паника), чтобы не сбить сцену.
function setMinionEmotion(name, seconds) {
  if (minion.frozen || minion.thinking) return;
  const cur = EMOTIONS[minion.emotion];
  const next = EMOTIONS[name];
  if (next && cur && next.priority < cur.priority) return;
  minion.override = { name, until: performance.now() / 1000 + seconds };
  minion.emotion = name;
}

function cellFree(x, z) {
  if (x < -32 || x > 32 || z < -32 || z > 32) return false;
  if (x === 0 && z === 0) return false;
  return !blockedGround.has(x + ',' + z);
}
function bfsPath(sx, sz, tx, tz) {
  if (!cellFree(tx, tz)) return null;
  const key = (x, z) => x + ',' + z;
  const queue = [[sx, sz]];
  const prev = new Map();
  prev.set(key(sx, sz), null);
  let head = 0;
  while (head < queue.length) {
    const [x, z] = queue[head++];
    if (x === tx && z === tz) {
      const path = [];
      let cur = key(x, z);
      while (cur !== null) {
        const [px, pz] = cur.split(',').map(Number);
        path.push([px, pz]);
        cur = prev.get(cur);
      }
      return path.reverse();
    }
    for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, nz = z + dz;
      const k = key(nx, nz);
      if (prev.has(k)) continue;
      if (!cellFree(nx, nz)) continue;
      prev.set(k, key(x, z));
      queue.push([nx, nz]);
    }
  }
  return null;
}
function resetMinionPath() { minion.path = []; }

function pickMinionTarget() {
  const panic = minion.mood === 'panic';
  const rMin = panic ? PANIC_RADIUS_MIN : MINION_RADIUS_MIN;
  const rMax = panic ? PANIC_RADIUS_MAX : MINION_RADIUS_MAX;
  for (let i = 0; i < 14; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = rMin + Math.random() * (rMax - rMin);
    const tx = Math.round(Math.cos(angle) * r);
    const tz = Math.round(Math.sin(angle) * r);
    if (!cellFree(tx, tz)) continue;
    if (tx === minion.x && tz === minion.z) continue;
    const path = bfsPath(minion.x, minion.z, tx, tz);
    if (path && path.length > 1) { minion.path = path.slice(1); return; }
  }
}
function placeMinionInitial() {
  for (let r = 2; r <= 10; r++) {
    for (let a = 0; a < 16; a++) {
      const ang = (a / 16) * Math.PI * 2;
      const x = Math.round(Math.cos(ang) * r);
      const z = Math.round(Math.sin(ang) * r);
      if (cellFree(x, z)) {
        minion.x = x; minion.z = z;
        minionGroup.position.set(x + 0.5, 0, z + 0.5);
        resetMinionPath();
        return;
      }
    }
  }
  minionGroup.position.set(2.5, 0, 2.5);
}

// Поворот в сторону движения. Отдельная функция, потому что yaw группы
// живёт в poseCurrent.rootY и мы должны его менять в обход обычного lerp.
let desiredYaw = 0;
function faceTowards(tx, tz, dt, speed) {
  const cur = minionGroup.rotation.y;
  const target = Math.atan2(tx, tz);
  let diff = target - cur;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  minionGroup.rotation.y = cur + diff * Math.min(1, dt * speed);
}

// --- Мысли и капли ---
function updateBubbles(now) {
  const e = EMOTIONS[minion.emotion] || EMOTIONS.calm;
  let char = e.bubble;
  let size = 1.1;
  if (minion.frozen && !minion.thinking) { char = '👋'; size = 1.15; }
  if (minion.thinking) { char = '🤔'; size = 1.15; }
  if (minion.emotion === 'panic') { char = '💦'; size = 0.95; }
  if (minion.emotion === 'alert') { char = '⚠️'; size = 1.0; }

  if (char && (minion.mood !== 'calm' || minion.frozen || minion.thinking || minion.emotion !== 'calm' || now < minion.talkUntil)) {
    setSpriteChar(bubbleSprite, char, size);
    const pulse = char === '⚠️' ? 1 + Math.sin(now * 5) * 0.1 : 1 + Math.sin(now * 2.4) * 0.04;
    bubbleSprite.scale.set(size * pulse, size * pulse, 1);
    bubbleSprite.position.y = 2.6 + Math.sin(now * 2.1) * 0.07;
    bubbleSprite.material.opacity = 1;
  } else {
    bubbleSprite.material.opacity = 0;
  }

  for (const d of droplets) {
    if (minion.emotion !== 'panic' && minion.emotion !== 'scared') { d.material.opacity = 0; continue; }
    const t = ((now * 0.85 + d.userData.phase) % 1);
    const ang = d.userData.phase * Math.PI * 2 + now * 2.2;
    d.position.set(Math.cos(ang) * 0.45, 1.15 + t * 1.15, Math.sin(ang) * 0.35);
    d.material.opacity = Math.sin(t * Math.PI) * 0.95;
    d.scale.setScalar(0.45 + t * 0.25);
  }
}

// --- Процедурные позы ---
function walkPose(now, panic, alert) {
  const freq = panic ? 13 + minion.panicBoost * 2 : (alert ? 8 : 6.5);
  minion.phase += (1/60) * freq;   // приблизительно, точный dt применим снаружи
  const s = Math.sin(minion.phase);
  const cs = Math.cos(minion.phase);

  const legAmp = panic ? 0.95 : (alert ? 0.75 : 0.65);
  const armAmp = panic ? 0.6 : (alert ? 0.4 : 0.5);

  const p = {};
  p.legLx = s * legAmp;
  p.legRx = -s * legAmp;
  // Колено сгибается только при движении ноги назад (реалистичный шаг)
  p.kneeL = Math.max(0, -s) * legAmp * 1.2;
  p.kneeR = Math.max(0,  s) * legAmp * 1.2;

  // Рука машет в противофазе ноге
  if (panic) {
    p.armLx = Math.PI * 0.85 + Math.sin(minion.phase * 1.6) * 0.45;
    p.armRx = Math.PI + Math.sin(minion.phase * 1.9 + 1) * 0.2;
    p.elbowL = -0.5 + Math.sin(minion.phase * 2) * 0.3;
    p.elbowR = 0.3;
  } else if (alert) {
    p.armLx = 0.5 - s * 0.35;
    p.armRx = Math.PI;
    p.elbowL = -0.7;
    p.elbowR = 0;
  } else {
    p.armLx = -s * armAmp;
    p.armRx = Math.PI;
    p.elbowL = -0.15 + Math.abs(cs) * 0.1;
    p.elbowR = 0;
  }

  // Наклон корпуса вперёд при разгоне, покачивание при ходьбе
  p.bodyX = panic ? 0.2 : (alert ? 0.12 : 0.07);
  p.bodyZ = Math.sin(minion.phase * 0.5) * 0.03;
  p.headX = panic ? -0.06 : 0.02;
  p.headZ = Math.sin(minion.phase * 0.7) * (panic ? 0.13 : 0.04);
  p.headY = alert ? Math.sin(now * 2.4) * 0.28 : 0;
  p.rootOffsetY = Math.abs(s) * (panic ? 0.13 : 0.05);

  return p;
}

function idleMicroPose(now) {
  // Микро-движения в покое: дыхание + действия, которые включаются иногда.
  const p = {};
  const breath = Math.sin(now * 1.7);
  p.armLx = breath * 0.06;
  p.bodyX = 0;
  p.rootOffsetY = breath * 0.015;
  p.headZ = Math.sin(now * 0.7) * 0.05;
  p.headY = Math.sin(now * 0.45) * 0.16;

  if (minion.idleAct && now < minion.idleActUntil) {
    const t = now - (minion.idleActUntil - 1.8);
    switch (minion.idleAct) {
      case 'stretch':
        p.armLx = -2.4;
        p.armRx = Math.PI - 0.4;
        p.elbowL = -0.3;
        p.headX = -0.15;
        p.rootOffsetY = Math.sin(t * 2.5) * 0.03;
        break;
      case 'tapFoot':
        p.legLx = 0;
        p.kneeL = Math.abs(Math.sin(t * 9)) * 0.4;
        p.armLx = 0.3;
        p.headZ = Math.sin(t * 1.4) * 0.03;
        break;
      case 'scratchHead':
        p.armLx = -2.55;
        p.elbowL = -1.4 + Math.sin(t * 10) * 0.15;
        p.headZ = 0.1;
        p.headY = Math.sin(t * 1.2) * 0.1;
        break;
      case 'lookAround':
        p.headY = Math.sin(t * 2.5) * 0.45;
        p.headZ = 0.02;
        break;
      case 'yawn':
        // Позы тут не меняем, рот откроем через faceTarget
        p.armLx = -1.6;
        p.headX = -0.2;
        break;
    }
  }
  return p;
}

function pickIdleAct(now) {
  const pool = ['stretch', 'tapFoot', 'scratchHead', 'lookAround', 'yawn'];
  const act = pool[Math.floor(Math.random() * pool.length)];
  minion.idleAct = act;
  minion.idleActUntil = now + 1.8;
  if (act === 'yawn') {
    faceTarget.mouthH = 0.16;
    faceTarget.mouthW = 0.1;
    faceTarget.mouthY = -0.09;
    setTimeout(() => { /* вернём через lerp автоматически */ }, 900);
  }
}

// --- Обновление эмоций и позы ---
function updateMinion(dt) {
  const now = performance.now() / 1000;

  if (!minion.frozen && !cellFree(minion.x, minion.z)) placeMinionInitial();

  // Сброс оверрайдов
  if (minion.override && now >= minion.override.until) {
    minion.override = null;
    minion.emotion = minion.mood;
  }

  resetPoseTarget();
  resetFaceTarget();

  // 1. Особые состояния (совет, раздумье)
  if (minion.thinking) {
    minion.emotion = 'thinking';
    poseTarget.armLx = -1.9;
    poseTarget.elbowL = -0.9;
    poseTarget.headX = -0.22;
    poseTarget.headZ = 0.06;
    applyEmotionToTargets('thinking', now);
    return;
  }
  if (minion.frozen) {
    minion.emotion = 'greeting';
    poseTarget.rootY = minionGroup.rotation.y;   // не крутим
    applyEmotionToTargets('greeting', now);
    return;
  }

  // 2. Базовая эмоция
  const emoName = minion.emotion;
  applyEmotionToTargets(emoName, now);

  const panic = emoName === 'panic' || emoName === 'scared';
  const alert = emoName === 'alert';
  minion.panicBoost = Math.max(0, minion.panicBoost - dt * 0.6);

  // 3. Пауза между переходами / выбор новой цели
  if (minion.path.length === 0) {
    if (now < minion.idleUntil) {
      const p = idleMicroPose(now);
      Object.assign(poseTarget, p);
      // Иногда выбираем новую микро-анимацию
      if (now > minion.nextIdleAct) {
        minion.nextIdleAct = now + 4 + Math.random() * 6;
        if (Math.random() < 0.35) pickIdleAct(now);
      }
      return;
    }
    pickMinionTarget();
    if (minion.path.length === 0) { minion.idleUntil = now + 1.0; return; }
    const basePause = panic ? 0.1 + Math.random() * 0.3
                    : (alert ? 0.5 + Math.random() * 1.2
                             : 0.9 + Math.random() * 2.6);
    minion.idleUntil = now + basePause;
  }

  // 4. Идём к следующей клетке
  const [nx, nz] = minion.path[0];
  const tx = nx + 0.5, tz = nz + 0.5;
  const px = minionGroup.position.x, pz = minionGroup.position.z;
  const dx = tx - px, dz = tz - pz;
  const dist = Math.hypot(dx, dz);
  const speed = panic ? (3.0 + minion.panicBoost * 0.8) : (alert ? 2.0 : 1.5);
  const step = speed * dt;

  if (dist <= step) {
    minionGroup.position.x = tx; minionGroup.position.z = tz;
    minion.x = nx; minion.z = nz;
    minion.path.shift();
  } else {
    minionGroup.position.x += (dx / dist) * step;
    minionGroup.position.z += (dz / dist) * step;
  }

  // 5. Поворот
  const targetAngle = Math.atan2(dx, dz);
  let diff = targetAngle - minionGroup.rotation.y;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  minionGroup.rotation.y += diff * Math.min(1, dt * (panic ? 12 : 7));

  // 6. Походка
  const walk = walkPose(now, panic, alert);
  Object.assign(poseTarget, walk);
  // Позицию по Y задаём вручную, минуя lerp позы, иначе шаг «отстаёт»
  poseCurrent.rootOffsetY = poseTarget.rootOffsetY;

  // 7. Редкая «мысль» над головой
  if (!panic && !alert && now > minion.nextTalk && now > minion.talkUntil) {
    minion.talkUntil = now + 2.0;
    minion.nextTalk = now + 6 + Math.random() * 8;
  }
}

const camAnim = {
  active: false, t: 0, dur: 1,
  fromPos: new THREE.Vector3(), toPos: new THREE.Vector3(),
  fromTgt: new THREE.Vector3(), toTgt: new THREE.Vector3(),
  onDone: null,
};
const savedCam = { pos: new THREE.Vector3(), tgt: new THREE.Vector3() };

function animateCamera(toPos, toTgt, dur, onDone) {
  camAnim.active = true; camAnim.t = 0; camAnim.dur = Math.max(0.01, dur);
  camAnim.fromPos.copy(camera.position);
  camAnim.fromTgt.copy(controls.target);
  camAnim.toPos.copy(toPos);
  camAnim.toTgt.copy(toTgt);
  camAnim.onDone = onDone || null;
  controls.enabled = false;
}
function updateCameraAnim(dt) {
  if (!camAnim.active) return false;
  camAnim.t += dt;
  const k = Math.min(1, camAnim.t / camAnim.dur);
  const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
  controls.target.lerpVectors(camAnim.fromTgt, camAnim.toTgt, e);
  if (k >= 1) {
    camAnim.active = false;
    const cb = camAnim.onDone; camAnim.onDone = null;
    if (cb) cb();
  }
  return true;
}

function pickTip() {
  const alertTips = I18N[lang].alertTips || [];
  const tips = I18N[lang].tips;
  if (minion.mood === 'alert' && alertTips.length && Math.random() < 0.6) {
    return alertTips[Math.floor(Math.random() * alertTips.length)].text;
  }
  const hasCubes = cubeMeshes.size > 0;
  const pool = tips.filter(tip => {
    if (tip.cond === 'hasCubes') return hasCubes;
    if (tip.cond === 'noCubes') return !hasCubes;
    return true;
  });
  let idx = Math.floor(Math.random() * pool.length);
  if (pool[idx].text === minion.lastTipText) idx = (idx + 1) % pool.length;
  minion.lastTipText = pool[idx].text;
  return pool[idx].text;
}

function animateTipText(text) {
  const el = $('tip-text');
  el.innerHTML = '';
  let i = 0;
  for (const word of text.split(' ')) {
    const w = document.createElement('span');
    w.className = 'tip-word';
    for (const ch of word) {
      const s = document.createElement('span');
      s.className = 'tip-char';
      s.textContent = ch;
      s.style.animationDelay = (i * 26) + 'ms';
      w.appendChild(s); i++;
    }
    el.appendChild(w);
    el.appendChild(document.createTextNode(' '));
    i++;
  }
  return i * 26 + 340;
}

function openTip() {
  const text = pickTip();
  minion.lastTipText = text;
  minion.frozen = true;
  minion.thinking = true;
  minion.thinkUntil = performance.now() / 1000 + THINK_TIME;
  minion.path = [];

  const mp = minionGroup.position;
  const toCam = new THREE.Vector3().subVectors(camera.position, mp).setY(0);
  if (toCam.lengthSq() < 0.001) toCam.set(1, 0, 1);
  toCam.normalize();
  minionGroup.rotation.y = Math.atan2(toCam.x, toCam.z);

  savedCam.pos.copy(camera.position);
  savedCam.tgt.copy(controls.target);

  const camPos = new THREE.Vector3(mp.x + toCam.x * 4.2, mp.y + 2.3, mp.z + toCam.z * 4.2);
  const camTgt = new THREE.Vector3(mp.x, mp.y + 0.9, mp.z);
  animateCamera(camPos, camTgt, 0.55);

  $('tip-text').innerHTML = '';
  $('tip-ok').disabled = true;
  showScreen('tip-screen');
}

function finishThinking() {
  if (!minion.thinking) return;
  minion.thinking = false;
  $('tip-text').innerHTML = '';
  const text = minion.pendingTip || pickTip();
  minion.pendingTip = null;
  const ms = animateTipText(text);
  setTimeout(() => { $('tip-ok').disabled = false; }, ms);
}

function closeTip() {
  hideScreens();
  minion.frozen = false;
  minion.thinking = false;
  setMinionEmotion('happy', 1.2);
  animateCamera(savedCam.pos, savedCam.tgt, 0.45, () => { controls.enabled = true; });
}

function effFootprint() {

  return rotated ? { sx: s.sz, sz: s.sx } : { sx: s.sx, sz: s.sz };

const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const hitPoint = new THREE.Vector3();
const normalMatrix = new THREE.Matrix3();
const projVec = new THREE.Vector3();
const isTouch = window.matchMedia('(pointer: coarse)').matches;
const aimPoint = { x: 0, y: 0 };
window.addEventListener('pointermove', (ev) => {
  if (isTouch) return;
  aimPoint.x = (ev.clientX / innerWidth) * 2 - 1;
  aimPoint.y = -(ev.clientY / innerHeight) * 2 + 1;
});

function computePlacement(ndcX, ndcY) {
  const { sx, sz } = effFootprint();
  const sy = selectedSize.sy;
  raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
  const cubeHits = raycaster.intersectObjects([...cubeMeshes.values()], false);
  let x, y, z;
  if (cubeHits.length) {
    const h = cubeHits[0];
    const base = h.object.userData.cube;
    const bsx = base.size_x||1, bsy = base.size_y||1, bsz = base.size_z||1;
    const bc = cubeCenter({ ...base, size_x:bsx, size_y:bsy, size_z:bsz });
    normalMatrix.getNormalMatrix(h.object.matrixWorld);
    const n = h.face.normal.clone().applyMatrix3(normalMatrix).normalize();
    const ax = Math.round(n.x), ay = Math.round(n.y), az = Math.round(n.z);
    if (ay !== 0) {
      y = ay > 0 ? base.y + bsy : base.y - sy;
      x = Math.round(bc.x - sx/2); z = Math.round(bc.z - sz/2);
    } else if (ax !== 0) {
      x = ax > 0 ? base.x + bsx : base.x - sx;
      y = base.y + Math.round((bsy - sy)/2);
      z = Math.round(bc.z - sz/2);
    } else {
      z = az > 0 ? base.z + bsz : base.z - sz;
      y = base.y + Math.round((bsy - sy)/2);
      x = Math.round(bc.x - sx/2);
    }
  } else {
    if (!raycaster.ray.intersectPlane(plane, hitPoint)) return null;
    x = Math.round(hitPoint.x - sx/2); y = 0; z = Math.round(hitPoint.z - sz/2);
  }
  const price = WOOD_BASE_COST * sx * sy * sz;
  if (x < -32 || x + sx - 1 > 32 || z < -32 || z + sz - 1 > 32 || y < 0 || y + sy - 1 > 32) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('outOfBounds'), price };
  }
  if (x <= 0 && 0 <= x+sx-1 && y <= 0 && 0 <= y+sy-1 && z <= 0 && 0 <= z+sz-1) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('flagReserved'), price };
  }
  for (const m of cubeMeshes.values()) {
    const c = m.userData.cube;
    const csx = c.size_x||1, csy = c.size_y||1, csz = c.size_z||1;
    if (x < c.x+csx && x+sx > c.x && y < c.y+csy && y+sy > c.y && z < c.z+csz && z+sz > c.z) {
      return { x, y, z, sx, sy, sz, valid:false, reason: t('occupied'), price };
    }
  }
  if (y > 0) {
    for (let dx = 0; dx < sx; dx++) {
      for (let dz = 0; dz < sz; dz++) {
        const cx = x + dx, cz = z + dz;
        let supported = false;
        for (const m of cubeMeshes.values()) {
          const c = m.userData.cube;
          const csx = c.size_x||1, csy = c.size_y||1, csz = c.size_z||1;
          if (c.y <= y-1 && c.y + csy - 1 >= y-1 &&
              c.x <= cx && c.x + csx - 1 >= cx &&
              c.z <= cz && c.z + csz - 1 >= cz) { supported = true; break; }
        }
        if (!supported) return { x, y, z, sx, sy, sz, valid:false, reason: t('noSupport'), price };
      }
    }
  }
  if (econ.ether_balance < price) {
    return { x, y, z, sx, sy, sz, valid:false, reason: t('noEther'), price };
  }
  return { x, y, z, sx, sy, sz, valid:true, reason:'', price };
}

function updateGhost() {
  if (!buildMode || mode !== 'own' || demolishMode) {
    ghost.visible = false; priceEl.classList.add('hidden'); return;
  }
  const p = computePlacement(aimPoint.x, aimPoint.y);
  if (!p) { ghost.visible = false; priceEl.classList.add('hidden'); return; }
  const cc = cubeCenter(p);
  ghost.position.set(cc.x, cc.y, cc.z);
  ghostMat.color.set(p.valid ? 0x22c55e : 0xef4444);
  ghost.visible = true;
  priceEl.textContent = p.price + '⚡';
  priceEl.classList.toggle('bad', !p.valid);
  projVec.set(cc.x, cc.y + p.sy/2 + 0.35, cc.z).project(camera);
  if (projVec.z > 1) { priceEl.classList.add('hidden'); return; }
  const px = (projVec.x * 0.5 + 0.5) * innerWidth;
  const py = (-projVec.y * 0.5 + 0.5) * innerHeight;
  priceEl.style.transform = `translate(${px}px, ${py}px) translate(-50%, -100%)`;
  priceEl.classList.remove('hidden');
}

async function pickFlagColor(key) {
  try {
    const res
